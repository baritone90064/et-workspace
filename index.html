                            <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[var(--text-blue)]"></span>已結束</span>
                        </div>
                        {selectedCalDate && (
                            <div className="mt-3 text-center animate-in zoom-in-95">
                                <span className="tag bg-[var(--pastel-blue)] text-[var(--text-blue)] shadow-sm">
                                    篩選日期: {selectedCalDate} <button onClick={()=>setSelectedCalDate(null)} className="ml-1 font-black">✕</button>
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="flex items-center mx-2 gap-2">
                        <div className="flex gap-1.5 bg-white p-1.5 rounded-[20px] shadow-sm flex-grow min-w-0">
                            <button onClick={()=>switchProjectSubTab('active')} className={`flex-1 min-w-0 py-2 px-1 text-[14px] font-black rounded-[15px] transition-all ${projectSubTab==='active' ? 'bg-[var(--pastel-mint)] text-[var(--text-mint)]' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>進行中</button>
                            <button onClick={()=>switchProjectSubTab('completed')} className={`flex-1 min-w-0 py-2 px-1 text-[14px] font-black rounded-[15px] transition-all ${projectSubTab==='completed' ? 'bg-[var(--pastel-gray)] text-gray-700' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>已結束</button>
                        </div>
                        <button onClick={openProjectQueryPanel} className={`bubble-btn btn-outline bg-white !p-3 shadow-sm border-none shrink-0 ${hasProjectQuery ? 'text-[var(--text-mint)] !bg-[var(--pastel-mint)]/30' : ''}`} title="專案查詢">
                            <Icon name="search" size={20} />
                        </button>
                        <button onClick={()=>setProjectSort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline bg-white !p-3 shadow-sm border-none shrink-0" title={projectSort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                            <Icon name={projectSort === 'desc' ? "sort-desc" : "sort-asc"} size={20} />
                        </button>
                    </div>

                    {hasProjectQuery && (
                        <div className="mx-2 space-y-2">
                            <div className="min-w-0 bg-[var(--pastel-mint)]/35 text-[var(--text-mint)] px-3 py-2 rounded-[16px] text-[12px] font-black flex items-center justify-between gap-2">
                                <span className="truncate">查詢：{projectQuerySummary || '已套用'}</span>
                                <button onClick={clearProjectQuery} className="shrink-0 bg-white/80 rounded-full p-1"><Icon name="x" size={14}/></button>
                            </div>
                            <div className="px-2 text-[12px] font-bold text-[var(--bubble-text)]/45">篩選結果：{displayProjects.length} 個專案</div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {displayProjects.length === 0 && <p className="text-center font-bold text-[var(--bubble-text)]/40 py-10">{hasProjectQuery ? '找不到符合查詢條件的專案' : '尚無專案'}</p>}
                        {displayProjects.map(t => {
                            const isExpanded = expandedProject[t.id];
                            const projectExpenses = getProjectExpenses(t.id);
                            const total = calculateProjectTotal(t);
                            const currentOwners = t.owners && t.owners.length > 0 ? t.owners : [];
                            const checklists = t.checklist || [];
                            
                            return (
                                <div key={t.id} id={`project-card-${t.id}`} className={`bubble-card overflow-hidden ${t.completed ? 'opacity-70 bg-gray-50' : 'bg-white'}`}>
                                    <div className="p-6 cursor-pointer hover:bg-[var(--bubble-bg)]/50 flex items-start gap-4 transition-colors" onClick={()=>setExpandedProject({...expandedProject, [t.id]: !isExpanded})}>
                                        <div className="mt-1"><Icon name={isExpanded ? "folder-open" : "folder"} size={26} className="text-[var(--pastel-blue)]" /></div>
                                        <div className="flex-grow min-w-0 relative">
                                            <div>
                                                <h3 className="font-black text-xl leading-tight text-[var(--bubble-text)] break-words">{t.text}</h3>
                                            </div>
                                            <div className="relative mt-1.5 pr-[100px]">
                                                <div className="flex flex-wrap gap-2">
                                                    <span className="tag bg-[var(--pastel-gray)] text-gray-700 shadow-sm">{t.category}</span>
                                                    {currentOwners.map(o => <span key={o} className="tag bg-[#F8FAFC] text-[var(--bubble-text)] border border-gray-100">{o}</span>)}
                                                </div>
                                                {total > 0 && <span className="absolute right-0 top-0 font-black text-lg bg-[var(--pastel-yellow)] px-3 py-1 rounded-[12px] text-[var(--text-yellow)]">${total.toLocaleString()}</span>}
                                            </div>
                                            {(t.startDate || t.endDate) && <div className="font-bold text-[13px] text-[var(--bubble-text)]/50 mt-1.5 flex items-center gap-1.5"><Icon name="calendar" size={14}/> {t.startDate} {t.endDate && `→ ${t.endDate}`}</div>}
                                            {t.showInCalendar === false && <div className="font-bold text-[12px] text-slate-400 mt-2 flex items-center gap-1.5"><Icon name="calendar-x" size={13}/> 不顯示於行事曆</div>}
                                        </div>
                                    </div>
                                    
                                    {isExpanded && (
                                        <div className="p-6 border-t-2 border-gray-50 bg-white/50">
                                            <div className="flex flex-wrap gap-2 mb-6">
                                                {!t.completed && <button onClick={()=>startDailyExpenseForProject(t)} className="bubble-btn btn-primary !px-4 !py-2 !text-sm"><Icon name="dollar-sign" size={16}/> 記一筆</button>}
                                                <button onClick={()=>openProjectEdit(t)} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm"><Icon name="edit" size={16}/> 編輯</button>
                                                <button onClick={()=>toggleProjectCompleted(t)} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm">{t.completed ? "重新開啟" : "標示為已結束"}</button>
                                                <button onClick={()=>showConfirm('刪除專案', '確定刪除此專案嗎？已記帳的消費會保留在日常流水帳。', async () => await deleteProject(t))} className="bubble-btn btn-danger !px-4 !py-2 !text-sm ml-auto"><Icon name="trash" size={16}/></button>
                                            </div>
                                            
                                            {/* Checklist 區塊 */}
                                            <div className="mb-6 bg-white p-5 rounded-[24px] shadow-sm border border-[var(--pastel-mint)]/40">
                                                <h4 className="font-black text-[14px] text-[var(--text-mint)] flex items-center gap-2 mb-4"><Icon name="check-circle" size={18}/> 任務清單</h4>
                                                <div className="space-y-3 mb-4">
                                                    {checklists.map(item => {
                                                        const itemLinks = item.links || [];
                                                        const itemImages = item.images || [];
                                                        const attachmentCount = itemLinks.length + itemImages.length;
                                                        return (
                                                            <div key={item.id} className={`p-3 rounded-[18px] bg-gray-50/70 border border-gray-100 transition-all ${item.completed ? 'opacity-60' : ''}`}>
                                                                <div className="flex items-start gap-3 group">
                                                                    <div onClick={()=>toggleChecklistItem(t.id, item.id)} className={`cute-checkbox flex-shrink-0 mt-0.5 ${item.completed ? 'checked' : ''}`}>
                                                                        {item.completed && <Icon name="check" size={16} className="text-[var(--text-mint)]" />}
                                                                    </div>
                                                                    <div className="flex-grow min-w-0 cursor-pointer pt-0.5" onClick={()=>toggleChecklistItem(t.id, item.id)}>
                                                                        <span className={`font-bold text-[15px] break-words ${item.completed ? 'line-through' : ''}`}>{item.text}</span>
                                                                    </div>
                                                                    <div className="flex items-center gap-1 flex-shrink-0">
                                                                        <button onClick={()=>openChecklistAttachmentModal(t.id, item.id)} className="relative text-[var(--text-mint)] bg-white hover:bg-[var(--pastel-mint)]/30 p-1.5 rounded-lg transition-all shadow-sm border border-gray-100" title="管理連結與圖片">
                                                                            <Icon name="paperclip" size={16}/>
                                                                            {attachmentCount > 0 && <span className="absolute -top-2 -right-2 min-w-[18px] h-[18px] px-1 rounded-full bg-[var(--pastel-yellow)] text-[var(--text-yellow)] text-[10px] font-black flex items-center justify-center shadow-sm">{attachmentCount}</span>}
                                                                        </button>
                                                                        <button onClick={()=>editChecklistItem(t.id, item.id, item.text)} className="text-[var(--text-blue)] bg-white hover:bg-[var(--pastel-blue)]/20 p-1.5 rounded-lg transition-all shadow-sm border border-gray-100" title="修改項目"><Icon name="edit-2" size={16}/></button>
                                                                        <button onClick={()=>deleteChecklistItem(t.id, item.id)} className="text-[var(--pastel-orange)] bg-white hover:bg-[var(--pastel-orange)]/10 p-1.5 rounded-lg transition-all shadow-sm border border-gray-100" title="刪除項目"><Icon name="trash-2" size={16}/></button>
                                                                    </div>
                                                                </div>
                                                                {(itemLinks.length > 0 || itemImages.length > 0) && (
                                                                    <div className="mt-3 pl-[39px] max-w-full overflow-hidden">
                                                                        {renderAttachmentLinks(itemLinks)}
                                                                        {renderAttachmentImages(itemImages, 'w-16 h-16')}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                    {checklists.length === 0 && <div className="text-sm font-bold text-gray-400">目前沒有清單項目，在下方新增吧！</div>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="新增準備事項、裝備清單..." value={newChecklistText[t.id] || ''} onChange={e=>setNewChecklistText({...newChecklistText, [t.id]: e.target.value})} onKeyDown={e=>{if(e.key==='Enter') addChecklistItem(t.id);}} className="flex-grow min-w-0 !max-w-full !py-2 !px-4 !text-sm !bg-gray-50 border-none" />
                                                    <button onClick={()=>addChecklistItem(t.id)} className="bubble-btn btn-mint !py-2 !px-4 shadow-none"><Icon name="plus" size={18}/></button>
                                                </div>
                                            </div>

                                            {t.note && <div className="font-bold text-[15px] text-[var(--bubble-text)]/80 whitespace-pre-line bg-[#F8FAFC] p-5 rounded-[20px] mb-4 leading-relaxed">{t.note}</div>}
                                            {t.links && t.links.length > 0 && (
                                                <div className="mb-4">
                                                    {renderAttachmentLinks(t.links)}
                                                </div>
                                            )}
                                            {t.images && t.images.length > 0 && (
                                                <div className="mb-4">
                                                    {renderAttachmentImages(t.images, 'w-24 h-24')}
                                                </div>
                                            )}

                                            {projectExpenses.length > 0 && (
                                                <div className="mt-5">
                                                    <h4 className="font-black text-[13px] text-[var(--bubble-text)]/50 uppercase tracking-wider mb-2 ml-1">專案費用明細</h4>
                                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden border border-gray-50 divide-y divide-gray-50">
                                                        {projectExpenses.map(e => (
                                                            <div key={e.id} className="flex justify-between items-center p-4 hover:bg-gray-50 group">
                                                                <div>
                                                                    <div className="font-black text-[15px] text-slate-700">{e.desc || '無備註'} <span className="ml-2 font-bold text-[13px] text-slate-400">{e.item}</span></div>
                                                                    <div className="font-bold text-[12px] text-[var(--bubble-text)]/40 mt-1">{e.date}{e.owner ? ` • ${e.owner}` : ''}</div>
                                                                </div>
                                                                <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 ml-auto pl-2">
                                                                    <div className="flex gap-1 sm:opacity-0 group-hover:opacity-100 transition-opacity order-2 sm:order-1">
                                                                        <button onClick={()=>setDailyEditData({...e})} className="bg-[var(--pastel-blue)]/30 text-[var(--text-blue)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-blue)]"><Icon name="edit-2" size={16} /></button>
                                                                        <button onClick={()=>showConfirm('刪除明細', '確定要刪除這筆專案費用嗎？', () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc(e.id).delete())} className="bg-[var(--pastel-orange)]/30 text-[var(--text-orange)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-orange)]"><Icon name="trash-2" size={16}/></button>
                                                                    </div>
                                                                    <span className="font-black text-lg text-[var(--bubble-text)] text-right order-1 sm:order-2">${parseFloat(e.amount).toLocaleString()}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderAnalyticsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-yellow)] p-2 rounded-2xl"><Icon name="pie-chart" size={24} className="text-[var(--text-yellow)]" /></div>
                        <h1 className="text-2xl font-black tracking-tight">統計分析</h1>
                    </div>
                    <div className="bubble-card p-5 bg-white">
                        <button onClick={()=>setIsAnalyticsFilterOpen(prev => !prev)} className="w-full flex justify-between items-center mb-3">
                            <h3 className="font-bold text-sm text-[var(--bubble-text)]/60">資料篩選設定</h3>
                            <Icon name={isAnalyticsFilterOpen ? "chevron-up" : "chevron-down"} size={18} className="text-[var(--bubble-text)]/40" />
                        </button>
                        {!isAnalyticsFilterOpen && (
                            <div className="text-[12px] font-bold text-[var(--bubble-text)]/45 truncate">
                                {[(!analyticsStart && !analyticsEnd) ? 'All' : formatQueryDateSummary(analyticsStart, analyticsEnd), analyticsCatFilter !== 'all' ? `費用：${analyticsCatFilter}` : '', analyticsOwnerFilter !== 'all' ? analyticsOwnerFilter : '', analyticsProjectCategoryFilter !== 'all' ? `專案分類：${analyticsProjectCategoryFilter}` : '', analyticsProjectFilter !== 'all' ? (analyticsProjectFilter === 'none' ? '無專案' : (projects.find(p => p.id === analyticsProjectFilter)?.text || '專案')) : '', analyticsKeyword ? `關鍵字：${analyticsKeyword}` : ''].filter(Boolean).join('｜') || '未設定篩選'}
                            </div>
                        )}
                        {isAnalyticsFilterOpen && (
                            <div className="space-y-3">
                                <div className="grid grid-cols-4 gap-2">
                                    <button onClick={()=>applyAnalyticsDateShortcut('all')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">All</button>
                                    <button onClick={()=>applyAnalyticsDateShortcut('year')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">今年</button>
                                    <button onClick={()=>applyAnalyticsDateShortcut('month')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">本月</button>
                                    <button onClick={()=>applyAnalyticsDateShortcut('lastMonth')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">上月</button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="date" value={analyticsDraftStart} onChange={e=>setAnalyticsDraftStart(e.target.value)} className="w-full min-w-0 !max-w-full !bg-white !px-2 !py-2 !text-[12px] sm:text-sm text-center" />
                                    <input type="date" value={analyticsDraftEnd} onChange={e=>setAnalyticsDraftEnd(e.target.value)} className="w-full min-w-0 !max-w-full !bg-white !px-2 !py-2 !text-[12px] sm:text-sm text-center" />
                                </div>
                                {isAnalyticsDraftDateInvalid && <div className="text-[var(--text-orange)] text-xs font-bold">截止日期不能早於起始日期！</div>}
                                <div className="grid grid-cols-2 gap-2">
                                    <select value={analyticsDraftCatFilter} onChange={e=>setAnalyticsDraftCatFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                        <option value="all">費用分類</option>
                                        {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                    </select>
                                    <select value={analyticsDraftOwnerFilter} onChange={e=>setAnalyticsDraftOwnerFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                        <option value="all">成員</option>
                                        {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                    </select>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <select value={analyticsDraftProjectCategoryFilter} onChange={e=>setAnalyticsDraftProjectCategoryFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                        <option value="all">專案分類</option>
                                        {categories.map(categoryItem => <option key={categoryItem.id} value={categoryItem.name}>{categoryItem.name}</option>)}
                                    </select>
                                    <select value={analyticsDraftProjectFilter} onChange={e=>setAnalyticsDraftProjectFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                        <option value="all">專案</option>
                                        <option value="none">無專案</option>
                                        {projects.map(project => <option key={project.id} value={project.id}>{project.text}</option>)}
                                    </select>
                                </div>
                                <input type="text" value={analyticsDraftKeyword} onChange={e=>setAnalyticsDraftKeyword(e.target.value)} placeholder="關鍵字：備註、專案名稱..." className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm" />
                                <div className="flex gap-3 pt-2">
                                    <button onClick={clearAnalyticsFilters} className="bubble-btn btn-outline flex-1 !py-2 !px-4 !text-sm"><Icon name="rotate-ccw" size={15}/> 清除</button>
                                    <button onClick={applyAnalyticsFilters} disabled={isAnalyticsDraftDateInvalid} className="bubble-btn btn-primary flex-1 !py-2 !px-4 !text-sm"><Icon name="check" size={15}/> 套用</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {isAnalyticsLoading && (
                        <div className="bubble-card p-4 bg-white text-center font-bold text-[var(--bubble-text)]/50 flex items-center justify-center gap-2">
                            <Icon name="loader" size={18} className="animate-spin" /> 統計資料讀取中...
                        </div>
                    )}

                    <div className="bubble-card p-8 text-center bg-white border-2 border-[var(--pastel-yellow)]/40">
                        <p className="font-bold text-[15px] text-[var(--bubble-text)]/60 mb-2">總計花費</p>
                        <p className="text-3xl font-black tracking-tighter text-[var(--text-yellow)] drop-shadow-sm">${analyticsData.totalExpense.toLocaleString()}</p>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="pie-chart" size={20}/> 項目佔比</h3>
                        {Object.keys(analyticsData.catMap).length > 0 ? (
                            <div className="h-56"><canvas ref={catCanvasRef}></canvas></div>
                        ) : (
                            <div className="text-center font-bold text-gray-400 py-10">此區間無費用資料</div>
                        )}
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="bar-chart-2" size={20}/> 月度趨勢</h3>
                        <div className="h-48"><canvas ref={trendCanvasRef}></canvas></div>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="users" size={20}/> 成員分攤</h3>
                        <div className="space-y-5">
                            {analyticsData.sortedOwners.length === 0 && <div className="text-center font-bold text-gray-400 py-4">無成員資料</div>}
                            {analyticsData.sortedOwners.map(([name, value]) => {
                                const percentage = analyticsData.totalExpense ? ((value / analyticsData.totalExpense) * 100).toFixed(1) : 0;
                                return (
                                    <div key={name}>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="font-black text-[16px]">{name}</span>
                                            <span className="font-bold text-sm text-[var(--bubble-text)]/60">${value.toLocaleString()} ({percentage}%)</span>
                                        </div>
                                        <div className="w-full bg-[#F1F3F5] rounded-full h-3 overflow-hidden">
                                            <div className="bg-[var(--pastel-blue)] h-full rounded-full transition-all duration-1000" style={{width: `${percentage}%`}}></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>


                    <div className="bubble-card p-6 bg-white">
                        <div className="flex justify-between items-center mb-5">
                            <h3 className="text-xl font-black flex items-center gap-2"><Icon name="list" size={20}/> 篩選結果清單</h3>
                            <button onClick={()=>setAnalyticsListSort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline !p-2 !rounded-xl !border-none shadow-sm bg-white" title={analyticsListSort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                                <Icon name={analyticsListSort === 'desc' ? "arrow-down-wide-narrow" : "arrow-up-wide-narrow"} size={18} />
                            </button>
                        </div>
                        <div className="space-y-3">
                            {sortedAnalyticsRows.length === 0 && <div className="text-center font-bold text-gray-400 py-4">無符合條件資料</div>}
                            {sortedAnalyticsRows.map((row, idx) => (
                                <div key={`${row.source}-${row.date}-${idx}`} className="p-3 rounded-[18px] bg-[var(--bubble-bg)]/60 flex justify-between gap-3 items-start">
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className={`tag shadow-sm ${row.source === '日常' ? 'bg-[var(--pastel-blue)] text-[var(--text-blue)]' : 'bg-[var(--pastel-mint)] text-[var(--text-mint)]'}`}>{row.source}</span>
                                            <span className="font-black text-[13px] text-[var(--bubble-text)]/60">{row.date}</span>
                                        </div>
                                        <div className="font-black text-[15px] truncate text-[var(--bubble-text)]">{row.source === '專案' && row.projectName ? `${row.projectName}｜` : ''}{row.title}</div>
                                        <div className="font-bold text-[12px] text-slate-500 mt-0.5">{row.item}　{row.owner}</div>
                                    </div>
                                    <div className="font-black text-[16px] text-[var(--bubble-text)] shrink-0">${Number(row.amount || 0).toLocaleString()}</div>
                                </div>
                            ))}
                        </div>
                    </div>                </div>
            );

            // 設定清單排序：先進入「調整排序」模式才開放拖曳，避免 iPhone 捲動時誤觸。
            // 拖曳只改本機草稿；按「儲存」才批次寫入 Firebase，按「取消」則還原。
            const getSettingsDisplayItems = (collection, items, allowReorder) => {
                if (!allowReorder) return items;
                return settingsDraftOrders[collection] || items;
            };

            const resetSettingsDragState = () => {
                settingsDragRef.current = null;
                setSettingsDragging(null);
                document.body.style.userSelect = '';
                document.body.style.webkitUserSelect = '';
            };

            const beginSettingsOrderEdit = (collection, items) => {
                if (isProcessing || !['categories', 'expenseItems'].includes(collection)) return;
                resetSettingsDragState();
                setSettingsDraftOrders(prev => ({ ...prev, [collection]: [...items] }));
                setSettingsOrderDirty(prev => ({ ...prev, [collection]: false }));
                setSettingsOrderEditing(prev => ({ ...prev, [collection]: true }));
            };

            const cancelSettingsOrderEdit = (collection, items) => {
                if (isProcessing) return;
                resetSettingsDragState();
                setSettingsDraftOrders(prev => ({ ...prev, [collection]: [...items] }));
                setSettingsOrderDirty(prev => ({ ...prev, [collection]: false }));
                setSettingsOrderEditing(prev => ({ ...prev, [collection]: false }));
            };

            const startSettingsDrag = (event, collection, itemId) => {
                if (
                    isProcessing ||
                    !settingsOrderEditing[collection] ||
                    !['categories', 'expenseItems'].includes(collection)
                ) return;
                event.preventDefault();
                try { event.currentTarget.setPointerCapture(event.pointerId); } catch (error) {}
                settingsDragRef.current = {
                    collection,
                    itemId,
                    pointerId: event.pointerId,
                    startY: event.clientY,
                    activated: false
                };
                setSettingsDragging({ collection, itemId });
                document.body.style.userSelect = 'none';
                document.body.style.webkitUserSelect = 'none';
            };

            const moveSettingsDrag = (event) => {
                const drag = settingsDragRef.current;
                if (!drag || drag.pointerId !== event.pointerId || !settingsOrderEditing[drag.collection]) return;
                event.preventDefault();

                // 手指需先移動一小段距離才開始排序，降低 iPhone 點按時的誤觸。
                if (!drag.activated) {
                    if (Math.abs(event.clientY - drag.startY) < 7) return;
                    drag.activated = true;
                }

                // 拖到螢幕上下邊緣時協助捲動，方便長清單排序。
                if (event.clientY < 90) window.scrollBy(0, -10);
                else if (event.clientY > window.innerHeight - 90) window.scrollBy(0, 10);

                const container = settingsListRefs.current[drag.collection];
                if (!container) return;
                const candidateRows = Array.from(container.querySelectorAll('[data-settings-row-id]'))
                    .filter(row => row.dataset.settingsRowId !== drag.itemId);

                let insertIndex = candidateRows.length;
                for (let index = 0; index < candidateRows.length; index++) {
                    const rect = candidateRows[index].getBoundingClientRect();
                    if (event.clientY < rect.top + rect.height / 2) {
                        insertIndex = index;
                        break;
                    }
                }

                setSettingsDraftOrders(prev => {
                    const current = prev[drag.collection] || [];
                    const draggedItem = current.find(item => item.id === drag.itemId);
                    if (!draggedItem) return prev;
                    const remaining = current.filter(item => item.id !== drag.itemId);
                    const nextItems = [...remaining];
                    nextItems.splice(Math.max(0, Math.min(insertIndex, nextItems.length)), 0, draggedItem);
                    const unchanged = nextItems.every((item, index) => item.id === current[index]?.id);
                    return unchanged ? prev : { ...prev, [drag.collection]: nextItems };
                });
                setSettingsOrderDirty(prev => prev[drag.collection]
                    ? prev
                    : ({ ...prev, [drag.collection]: true }));
            };

            const endSettingsDrag = (event) => {
                const drag = settingsDragRef.current;
                if (!drag) return;
                if (event?.pointerId !== undefined && drag.pointerId !== event.pointerId) return;
                try { event?.currentTarget?.releasePointerCapture?.(drag.pointerId); } catch (error) {}
                resetSettingsDragState();
            };

            const saveSettingsOrder = async (collection) => {
                if (isProcessing || !settingsOrderEditing[collection]) return;

                // 沒有移動時直接離開排序模式，不執行 Firebase 寫入。
                if (!settingsOrderDirty[collection]) {
                    setSettingsOrderEditing(prev => ({ ...prev, [collection]: false }));
                    return;
                }

                const orderedItems = settingsDraftOrders[collection] || [];
                setIsProcessing(true);
                try {
                    const collectionRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection);
                    const batch = db.batch();
                    const updatedAt = new Date().toISOString();
                    orderedItems.forEach((item, index) => {
                        batch.update(collectionRef.doc(item.id), { order: index, updatedAt });
                    });
                    await batch.commit();
                    setSettingsOrderDirty(prev => ({ ...prev, [collection]: false }));
                    setSettingsOrderEditing(prev => ({ ...prev, [collection]: false }));
                } catch (error) {
                    console.error(`儲存${collection}排序失敗:`, error);
                    alert('儲存排序失敗，請檢查網路後再試一次。');
                } finally {
                    setIsProcessing(false);
                }
            };

            // 修改 Settings 裡排序的賦值方式，避免刪除又新增後出現同一個 order 的問題。
            const renderSettingsList = (title, collection, items, allowReorder = false) => {
                const displayItems = getSettingsDisplayItems(collection, items, allowReorder);
                const isDirty = Boolean(allowReorder && settingsOrderDirty[collection]);
                const isOrderEditing = Boolean(allowReorder && settingsOrderEditing[collection]);

                return (
                    <div className="mb-8">
                        <div className="flex justify-between items-center gap-3 px-2 mb-4">
                            <div className="min-w-0">
                                <div className="flex items-center gap-2 flex-wrap">
                                    <h3 className="font-black text-xl">{title}</h3>
                                    {isDirty && <span className="tag bg-[var(--pastel-yellow)] text-[var(--text-yellow)] !text-[11px]">尚未儲存</span>}
                                </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                {allowReorder && !isOrderEditing && (
                                    <button
                                        type="button"
                                        disabled={isProcessing}
                                        onClick={()=>beginSettingsOrderEdit(collection, items)}
                                        className="bubble-btn btn-outline !py-1.5 !px-3 !text-[12px] disabled:opacity-40"
                                    >
                                        <Icon name="arrow-up-down" size={15}/>
                                        調整排序
                                    </button>
                                )}
                                {allowReorder && isOrderEditing && (
                                    <>
                                        <button
                                            type="button"
                                            disabled={isProcessing}
                                            onClick={()=>cancelSettingsOrderEdit(collection, items)}
                                            className="bubble-btn btn-outline !py-1.5 !px-3 !text-[12px] disabled:opacity-40"
                                        >
                                            取消
                                        </button>
                                        <button
                                            type="button"
                                            disabled={isProcessing}
                                            onClick={()=>saveSettingsOrder(collection)}
                                            className="bubble-btn btn-mint !py-1.5 !px-3 !text-[12px] disabled:opacity-40"
                                        >
                                            <Icon name={isProcessing ? "loader-circle" : "save"} size={15} className={isProcessing ? "animate-spin" : ""}/>
                                            儲存
                                        </button>
                                    </>
                                )}
                                {!isOrderEditing && (
                                    <button disabled={isProcessing} onClick={()=>showInput(`新增${title}`, '', '請輸入名稱...', async (newName) => {
                                        const list = collection === 'members' ? members : collection === 'categories' ? categories : expenseItems;
                                        const nextOrder = list.length > 0 ? Math.max(...list.map(l => l.order || 0)) + 1 : 0;
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).add({ name: newName, order: nextOrder, createdAt: new Date().toISOString() });
                                    })} className="bubble-btn btn-primary !py-1.5 !px-3 !text-[12px] disabled:opacity-40"><Icon name="plus" size={15}/> 新增</button>
                                )}
                            </div>
                        </div>
                        <div
                            ref={element => { if (allowReorder) settingsListRefs.current[collection] = element; }}
                            className="bubble-card bg-white overflow-hidden divide-y divide-gray-50 p-0"
                        >
                            {displayItems.length === 0 && <div className="p-6 text-center font-bold text-gray-400">無資料</div>}
                            {displayItems.map((item, index) => {
                                const isDragging = settingsDragging?.collection === collection && settingsDragging?.itemId === item.id;
                                return (
                                    <div
                                        key={item.id}
                                        data-settings-row-id={item.id}
                                        className={`flex justify-between items-center gap-2 p-3 transition-all ${isDragging ? 'relative z-10 bg-[var(--pastel-yellow)]/55 shadow-xl scale-[1.01]' : 'hover:bg-[var(--bubble-bg)]/30'}`}
                                    >
                                        <div className="flex items-center gap-2 min-w-0 flex-1">
                                            {isOrderEditing && (
                                                <button
                                                    type="button"
                                                    aria-label={`拖曳調整「${item.name}」排序`}
                                                    onPointerDown={event=>startSettingsDrag(event, collection, item.id)}
                                                    onPointerMove={moveSettingsDrag}
                                                    onPointerUp={endSettingsDrag}
                                                    onPointerCancel={endSettingsDrag}
                                                    onLostPointerCapture={endSettingsDrag}
                                                    onContextMenu={event=>event.preventDefault()}
                                                    className="w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center text-[var(--text-mint)] bg-[var(--pastel-mint)]/30 active:scale-95 select-none"
                                                    style={{ touchAction: 'none', WebkitTouchCallout: 'none' }}
                                                >
                                                    <Icon name="grip-vertical" size={22}/>
                                                </button>
                                            )}
                                            <span className="font-black text-[16px] min-w-0 break-words">{item.name}</span>
                                        </div>
                                        {isOrderEditing ? (
                                            <span className="w-7 text-center text-[12px] font-black text-gray-300 shrink-0">{index + 1}</span>
                                        ) : (
                                            <div className="flex gap-1.5 shrink-0">
                                                <button disabled={isProcessing} onClick={()=>showInput(`編輯名稱`, item.name, '輸入新名稱', async (newName) => {
                                                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).update({ name: newName });
                                                })} className="p-2 rounded-xl text-[var(--text-blue)] bg-[var(--pastel-blue)]/20 hover:bg-[var(--pastel-blue)] transition-all disabled:opacity-40"><Icon name="edit-2" size={18}/></button>
                                                <button disabled={isProcessing} onClick={()=>showConfirm('確認刪除', `確定要刪除「${item.name}」嗎？`, async () => {
                                                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).delete();
                                                })} className="p-2 rounded-xl text-[var(--text-orange)] bg-[var(--pastel-orange)]/20 hover:bg-[var(--pastel-orange)] transition-all disabled:opacity-40"><Icon name="trash-2" size={18}/></button>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-6 py-10 bg-[var(--bubble-bg)]">
                        <div className="bubble-card bg-white p-8 max-w-sm w-full text-center shadow-2xl">
                            <div className="w-16 h-16 mx-auto mb-5 rounded-[24px] bg-[var(--pastel-blue)] flex items-center justify-center">
                                <Icon name="sparkles" size={30} className="text-[var(--text-blue)]" />
                            </div>
                            <h1 className="text-2xl font-black mb-2 text-[var(--bubble-text)]">T&E LifeLog</h1>
                            <p className="text-sm font-bold text-[var(--bubble-text)]/50 mb-4">請使用 Google 帳號登入</p>
                            {authError && (
                                <div className="mb-4 rounded-[18px] bg-red-50 border border-red-100 px-4 py-3 text-left text-[13px] font-bold text-red-700 leading-relaxed">
                                    {authError}
                                </div>
                            )}
                            <button
                                onClick={signInWithGoogle}
                                disabled={isSigningIn}
                                className={`bubble-btn btn-primary w-full py-3 justify-center ${isSigningIn ? 'opacity-60 cursor-not-allowed' : ''}`}
                            >
                                <Icon name={isSigningIn ? "loader-circle" : "log-in"} size={18} className={isSigningIn ? "animate-spin" : ""}/>
                                {isSigningIn ? '登入中...' : '使用 Google 登入'}
                            </button>
                        </div>
                    </div>
                );
            }

            if (!isAllowedEmail(getFirebaseUserEmail(user))) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-6 py-10 bg-[var(--bubble-bg)]">
                        <div className="bubble-card bg-white p-8 max-w-sm w-full text-center shadow-2xl">
                            <div className="w-16 h-16 mx-auto mb-5 rounded-[24px] bg-[var(--pastel-orange)]/40 flex items-center justify-center">
                                <Icon name="shield-alert" size={30} className="text-[var(--text-orange)]" />
                            </div>
                            <h1 className="text-2xl font-black mb-2 text-[var(--bubble-text)]">無法使用此服務</h1>
                            <p className="text-sm font-bold text-[var(--bubble-text)]/50 mb-6">目前登入帳號未授權。</p>
                            <button onClick={signOutUser} className="bubble-btn btn-outline w-full py-3 justify-center">
                                <Icon name="log-out" size={18}/> 登出
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32 pt-8 px-4 sm:px-6">
                    <header className="mb-6 px-2 text-center">
                        <div className="flex justify-center items-center gap-3">
                            <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-emerald-950 drop-shadow-sm flex justify-center items-center gap-3">
                                <Icon name="sparkles" size={28} className="text-amber-500" /> T&E LifeLog
                            </h1>
                        </div>
                    </header>
                    <main>
                        {activeTab === 'daily' && renderDailyView()}
                        {activeTab === 'projects' && renderProjectsView()}
                        {activeTab === 'analytics' && renderAnalyticsView()}
                        {activeTab === 'settings' && (
                            <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-4">
                                <div className="flex items-center gap-3 px-2 mb-6">
                                    <div className="bg-[var(--pastel-gray)] p-2 rounded-2xl"><Icon name="settings" size={24} className="text-gray-700" /></div>
                                    <h1 className="text-2xl font-black tracking-tight">設定管理</h1>
                                </div>
                                {renderSettingsList("參與成員", "members", members)}
                                {renderSettingsList("專案類別", "categories", categories, true)}
                                {renderSettingsList("費用分類", "expenseItems", expenseItems, true)}
                                
                                <div className="mb-8 pt-4">
                                    <h3 className="font-black text-xl px-2 mb-4">資料備份與匯出</h3>
                                    <div className="bubble-card bg-white p-5">
                                        <p className="text-xs font-bold text-gray-500 mb-4 leading-relaxed">日常記帳匯出目前畫面中的查詢結果；專案資料則匯出完整專案內容。</p>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                onClick={handleExportDailyCSV}
                                                className="min-w-0 min-h-[118px] rounded-[22px] border-2 border-[var(--pastel-blue)]/55 bg-[var(--pastel-blue)]/15 px-3 py-4 flex flex-col items-center justify-center gap-2 text-center active:scale-[0.97] transition-transform"
                                            >
                                                <span className="w-11 h-11 rounded-2xl bg-white/80 shadow-sm flex items-center justify-center text-[var(--text-blue)]"><Icon name="wallet" size={22}/></span>
                                                <span className="font-black text-[14px] leading-tight text-[var(--text-blue)]">日常記帳</span>
                                                <span className="font-bold text-[11px] text-[var(--bubble-text)]/45 flex items-center gap-1"><Icon name="download" size={12}/> 匯出 CSV</span>
                                            </button>
                                            <button
                                                onClick={handleExportProjectCSV}
                                                className="min-w-0 min-h-[118px] rounded-[22px] border-2 border-[var(--pastel-mint)]/70 bg-[var(--pastel-mint)]/20 px-3 py-4 flex flex-col items-center justify-center gap-2 text-center active:scale-[0.97] transition-transform"
                                            >
                                                <span className="w-11 h-11 rounded-2xl bg-white/80 shadow-sm flex items-center justify-center text-[var(--text-mint)]"><Icon name="folder" size={22}/></span>
                                                <span className="font-black text-[14px] leading-tight text-[var(--text-mint)]">專案資料</span>
                                                <span className="font-bold text-[11px] text-[var(--bubble-text)]/45 flex items-center gap-1"><Icon name="download" size={12}/> 匯出 CSV</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="pb-8">
                                    <button onClick={signOutUser} className="bubble-btn btn-outline w-full py-3 justify-center text-[var(--text-orange)]">
                                        <Icon name="log-out" size={18}/> 登出
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {isInitialLoading && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-[var(--bubble-bg)]/85 backdrop-blur-sm px-6">
                            <div className="bubble-card bg-white p-6 modal-panel text-center shadow-2xl">
                                <div className="w-14 h-14 mx-auto mb-4 rounded-full bg-[var(--pastel-blue)]/40 flex items-center justify-center">
                                    <Icon name="loader" size={28} className="animate-spin text-[var(--text-blue)]" />
                                </div>
                                <div className="font-black text-lg text-[var(--bubble-text)]">資料載入中</div>
                                <div className="font-bold text-sm text-[var(--bubble-text)]/50 mt-1">正在同步記帳與專案資料...</div>
                            </div>
                        </div>
                    )}


                    {isDailyQueryOpen && (
                        <div className="modal-overlay items-end sm:items-center" onClick={()=>setIsDailyQueryOpen(false)}>
                            <div className="bubble-card bg-white p-5 w-full max-w-md modal-panel animate-in slide-in-from-bottom-4 sm:zoom-in-95 duration-200 mx-4 mb-4 sm:mb-0" onClick={e=>e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-black text-xl text-[var(--text-blue)] flex items-center gap-2"><Icon name="search" size={20}/> 日常查詢</h3>
                                    <button onClick={()=>setIsDailyQueryOpen(false)} className="p-2 bg-gray-50 rounded-full text-gray-500"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="space-y-3">
                                    <div className="grid grid-cols-4 gap-2">
                                        <button onClick={()=>applyDailyDateShortcut('all')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">All</button>
                                        <button onClick={()=>applyDailyDateShortcut('year')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">今年</button>
                                        <button onClick={()=>applyDailyDateShortcut('month')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">本月</button>
                                        <button onClick={()=>applyDailyDateShortcut('lastMonth')} className="bubble-btn btn-outline !py-1.5 !px-2 !text-xs !rounded-xl">上月</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={dailyQueryDraft.start} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, start: e.target.value})} className="w-full min-w-0 !max-w-full !text-[12px] text-center" />
                                        <input type="date" value={dailyQueryDraft.end} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, end: e.target.value})} className="w-full min-w-0 !max-w-full !text-[12px] text-center" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={dailyQueryDraft.item} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, item: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                            <option value="all">分類</option>
                                            {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                        </select>
                                        <select value={dailyQueryDraft.owner} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, owner: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                            <option value="all">成員</option>
                                            {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <select value={dailyQueryDraft.project} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, project: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                        <option value="all">專案</option>
                                        <option value="none">無專案</option>
                                        {projects.map(project => <option key={project.id} value={project.id}>{project.text}</option>)}
                                    </select>
                                    <input type="text" value={dailyQueryDraft.note} onChange={e=>setDailyQueryDraft({...dailyQueryDraft, note: e.target.value})} placeholder="搜尋備註..." className="w-full min-w-0 !max-w-full !text-sm" />
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={clearDailyQuery} className="bubble-btn btn-outline flex-1 !py-2 !px-4 !text-sm">清除</button>
                                        <button onClick={applyDailyQuery} className="bubble-btn btn-primary flex-1 !py-2 !px-4 !text-sm">套用</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isProjectQueryOpen && (
                        <div className="modal-overlay items-end sm:items-center" onClick={()=>setIsProjectQueryOpen(false)}>
                            <div className="bubble-card bg-white p-5 w-full max-w-md modal-panel animate-in slide-in-from-bottom-4 sm:zoom-in-95 duration-200 mx-4 mb-4 sm:mb-0" onClick={e=>e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-black text-xl text-[var(--text-mint)] flex items-center gap-2"><Icon name="search" size={20}/> 專案查詢</h3>
                                    <button onClick={()=>setIsProjectQueryOpen(false)} className="p-2 bg-gray-50 rounded-full text-gray-500"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="space-y-3">
                                    <input type="text" value={projectQueryDraft.text} onChange={e=>setProjectQueryDraft({...projectQueryDraft, text: e.target.value})} placeholder="搜尋專案名稱、專案備註、費用備註..." className="w-full min-w-0 !max-w-full !text-sm" />
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={()=>applyProjectDateShortcut('year')} className="bubble-btn btn-outline !py-1.5 !text-xs !rounded-xl">今年</button>
                                        <button onClick={()=>applyProjectDateShortcut('month')} className="bubble-btn btn-outline !py-1.5 !text-xs !rounded-xl">本月</button>
                                        <button onClick={()=>applyProjectDateShortcut('lastMonth')} className="bubble-btn btn-outline !py-1.5 !text-xs !rounded-xl">上月</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="date" value={projectQueryDraft.start} onChange={e=>setProjectQueryDraft({...projectQueryDraft, start: e.target.value})} className="w-full min-w-0 !max-w-full !text-[12px] text-center" />
                                        <input type="date" value={projectQueryDraft.end} onChange={e=>setProjectQueryDraft({...projectQueryDraft, end: e.target.value})} className="w-full min-w-0 !max-w-full !text-[12px] text-center" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={projectQueryDraft.category} onChange={e=>setProjectQueryDraft({...projectQueryDraft, category: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                            <option value="all">專案分類</option>
                                            {categories.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                        </select>
                                        <select value={projectQueryDraft.expenseItem} onChange={e=>setProjectQueryDraft({...projectQueryDraft, expenseItem: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                            <option value="all">費用分類</option>
                                            {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                        </select>
                                    </div>
                                    <select value={projectQueryDraft.owner} onChange={e=>setProjectQueryDraft({...projectQueryDraft, owner: e.target.value})} className="w-full min-w-0 !max-w-full !text-sm">
                                        <option value="all">成員</option>
                                        {projectOwnerOptions.map(owner => <option key={owner} value={owner}>{owner}</option>)}
                                    </select>
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={clearProjectQuery} className="bubble-btn btn-outline flex-1 !py-2 !px-4 !text-sm">清除</button>
                                        <button onClick={applyProjectQuery} className="bubble-btn btn-mint flex-1 !py-2 !px-4 !text-sm">套用</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 客製化 Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="modal-overlay">
                            <div className="bubble-card bg-white p-6 w-full max-w-sm modal-panel animate-in zoom-in-95 duration-200 shadow-2xl mx-4">
                                <h3 className="font-black text-2xl mb-2 text-[var(--text-orange)]">{confirmDialog.title}</h3>
                                <p className="font-bold text-[var(--bubble-text)]/70 mb-6">{confirmDialog.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={()=>setConfirmDialog({isOpen:false})} className="bubble-btn btn-outline flex-1 py-3">取消</button>
                                    <button onClick={()=>{confirmDialog.onConfirm(); setConfirmDialog({isOpen:false});}} className="bubble-btn btn-danger flex-1 py-3">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 客製化 Input Dialog */}
                    {inputDialog.isOpen && (
                        <div className="modal-overlay">
                            <div className="bubble-card bg-[var(--pastel-blue)] p-6 w-full max-w-sm modal-panel animate-in zoom-in-95 duration-200 shadow-2xl border-none mx-4">
                                <h3 className="font-black text-2xl mb-4 text-[var(--text-blue)] drop-shadow-sm">{inputDialog.title}</h3>
                                <input className="w-full min-w-0 !max-w-full mb-6 !border-none !bg-white" value={inputDialog.value} onChange={e=>setInputDialog({...inputDialog, value: e.target.value})} placeholder={inputDialog.placeholder} autoFocus />
                                <div className="flex gap-3">
                                    <button onClick={()=>setInputDialog({isOpen:false})} className="bubble-btn bg-white/40 text-[var(--text-blue)] flex-1 py-3 hover:bg-white/60">取消</button>
                                    <button onClick={()=>{ if(inputDialog.value.trim()){ inputDialog.onConfirm(inputDialog.value.trim()); setInputDialog({isOpen:false}); } }} className="bubble-btn bg-white text-[var(--text-blue)] flex-1 py-3 shadow-lg">確認儲存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 日常修改 Modal (新加入，讓使用者編輯時不會失去原有位置) */}
                    {dailyEditData && (
                        <div className="modal-overlay" onClick={() => setDailyEditData(null)}>
                            <div className="bubble-card bg-white w-full max-w-sm modal-panel overflow-hidden animate-in zoom-in-95 duration-200 mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 border-b-2 border-gray-50 flex justify-between items-center bg-[var(--pastel-blue)]/30">
                                    <h3 className="font-black text-lg text-[var(--text-blue)]">編輯日常流水帳</h3>
                                    <button onClick={() => setDailyEditData(null)} className="p-1.5 bg-white rounded-full text-gray-500 hover:bg-gray-100"><Icon name="x" size={18}/></button>
                                </div>
                                <form onSubmit={submitDailyEdit} className="p-5 sm:p-6 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mobile-stack">
                                        <input type="date" value={dailyEditData.date} onChange={e=>{ const nextDate = e.target.value; const selectedProject = projects.find(project => project.id === dailyEditData.projectId); setDailyEditData({...dailyEditData, date: nextDate, projectId: selectedProject && projectIncludesExpenseDate(selectedProject, nextDate) ? dailyEditData.projectId : ''}); }} required className="w-full min-w-0 !max-w-full" />
                                        <input type="number" inputMode="decimal" pattern="[0-9]*" enterKeyHint="done" placeholder="金額 $" value={dailyEditData.amount} onChange={e=>setDailyEditData({...dailyEditData, amount: e.target.value})} required className="w-full min-w-0 !max-w-full font-black text-xl text-[var(--text-blue)]" />
                                    </div>
                                    <select value={dailyEditData.projectId || ''} onChange={e=>setDailyEditData({...dailyEditData, projectId: e.target.value})} className="w-full min-w-0 !max-w-full">
                                        <option value="">無專案</option>
                                        {projects.filter(project => projectIncludesExpenseDate(project, dailyEditData.date) || project.id === dailyEditData.projectId).map(project => <option key={project.id} value={project.id}>{project.text}</option>)}
                                    </select>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mobile-stack">
                                        <select value={dailyEditData.item} onChange={e=>setDailyEditData({...dailyEditData, item: e.target.value})} required className="w-full min-w-0 !max-w-full">
                                            <option value="">選擇分類...</option>
                                            {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                        </select>
                                        <select value={dailyEditData.owner} onChange={e=>setDailyEditData({...dailyEditData, owner: e.target.value})} required className="w-full min-w-0 !max-w-full">
                                            {dailyEditData.owner && !dailyOwnerOptions.includes(dailyEditData.owner) && <option value={dailyEditData.owner}>{dailyEditData.owner}</option>}
                                            {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <input placeholder="備註 (選填)..." value={dailyEditData.desc} onChange={e=>setDailyEditData({...dailyEditData, desc: e.target.value})} className="w-full min-w-0 !max-w-full" />
                                    <button type="submit" disabled={isProcessing} className="bubble-btn btn-primary w-full py-3 mt-4">儲存修改</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 專案新增/編輯 Modal */}
                    {isProjectFormOpen && (
                        <div className="modal-overlay" onClick={closeProjectForm}>
                            <div className="bubble-card bg-white w-full max-w-lg modal-panel-wide flex flex-col h-[85vh] animate-in zoom-in-95 duration-200 overflow-hidden mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-5 border-b-2 border-gray-50 flex justify-between items-center bg-white z-10">
                                    <h3 className="font-black text-2xl text-[var(--bubble-text)]">{projectEditingId ? "編輯專案" : "建立新專案"}</h3>
                                    <button onClick={closeProjectForm} className="p-2 bg-gray-50 rounded-full text-gray-500 hover:bg-gray-100"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="p-4 sm:p-6 overflow-y-auto space-y-6 flex-grow bg-[#F8FAFC]/50">
                                    <div>
                                        <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">專案名稱</label>
                                        <input className="w-full min-w-0 !max-w-full text-xl !bg-white" placeholder="輸入名稱..." value={projectText} onChange={e=>setProjectText(e.target.value)} />
                                    </div>
                                    
                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100 space-y-4">
                                        <div>
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">參與成員</label>
                                            <div className="flex flex-wrap gap-2">
                                                {members.map(m => (
                                                    <button key={m.id} type="button" onClick={() => {
                                                        if(owners.includes(m.name)) setOwners(owners.filter(o=>o!==m.name));
                                                        else setOwners([...owners, m.name]);
                                                    }} className={`px-4 py-2 text-sm font-bold rounded-[14px] transition-colors ${owners.includes(m.name) ? 'bg-[var(--pastel-blue)] text-[var(--text-blue)]' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}>
                                                        {m.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">類別</label>
                                            <select className="w-full min-w-0 !max-w-full !bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                                {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="pt-2">
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">專案日期區間</label>
                                            <div className="flex items-center gap-1">
                                                <input
                                                    type="date"
                                                    value={startDate}
                                                    onChange={e => {
                                                        const nextStartDate = e.target.value;
                                                        setStartDate(nextStartDate);
                                                        // 新增專案：選擇開始日期後，結束日期預設同一天。
                                                        // 編輯既有專案時保留原本結束日期，避免誤覆蓋。
                                                        if (!projectEditingId) setEndDate(nextStartDate);
                                                    }}
                                                    className="flex-1 min-w-0 !max-w-full !bg-white !px-2 !py-2.5 !min-h-[46px] !text-sm tracking-tighter text-center"
                                                />
                                                <span className="font-black text-gray-300 shrink-0 mx-0.5">→</span>
                                                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="flex-1 min-w-0 !max-w-full !bg-white !px-2 !py-2.5 !min-h-[46px] !text-sm tracking-tighter text-center" />
                                            </div>
                                            {isProjectDateInvalid && <div className="text-[var(--text-orange)] text-sm font-bold mt-2">結束日期不能早於起始日期！</div>}
                                        </div>
                                        <div className="pt-2">
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">行事曆顯示</label>
                                            <button type="button" onClick={() => setShowInCalendar(prev => !prev)} className={`bubble-btn w-full !justify-start !rounded-[18px] ${showInCalendar ? 'btn-mint' : 'btn-outline'}`}>
                                                <Icon name={showInCalendar ? 'calendar-check' : 'calendar-x'} size={18}/>
                                                {showInCalendar ? '顯示在行事曆' : '不顯示在行事曆'}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60">相關連結</label>
                                            <button type="button" onClick={() => setLinks([...links, {label:'', url:''}])} className="bubble-btn bg-gray-50 text-gray-600 !py-1 !px-3 !text-xs shadow-none"><Icon name="plus" size={14}/> 新增</button>
                                        </div>
                                        <div className="space-y-3">
                                            {links.map((li, i) => (
                                                <div key={i} className="flex gap-2">
                                                    <input className="w-1/3 min-w-0 !max-w-full text-sm !bg-gray-50" placeholder="標籤" value={li.label} onChange={e => { const n = [...links]; n[i].label = e.target.value; setLinks(n); }} />
                                                    <input className="flex-grow min-w-0 !max-w-full text-sm w-full !bg-gray-50" placeholder="網址 (https://...)" value={li.url} onChange={e => { const n = [...links]; n[i].url = e.target.value; setLinks(n); }} />
                                                    <button type="button" onClick={() => setLinks(links.filter((_, idx) => idx !== i))} className="p-2 text-[var(--pastel-orange)] bg-white rounded-xl shadow-sm"><Icon name="trash-2" size={18}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60">圖片附件</label>
                                            <button type="button" disabled={isUploadingImage} onClick={() => document.getElementById('image-upload').click()} className="bubble-btn btn-outline !py-1 !px-3 !text-xs shadow-none"><Icon name="upload" size={14}/> {isUploadingImage ? "上傳中..." : "上傳多張圖片"}</button>
                                            <input id="image-upload" type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" />
                                        </div>
                                        <div className="space-y-3" onPaste={handlePaste}>
                                            {images.length === 0 && !isUploadingImage && <div className="text-sm font-bold text-gray-400 p-4 text-center border-2 border-dashed border-gray-200 rounded-[14px]">點擊上方按鈕可一次選多張，或在此 Ctrl+V 貼上圖片截圖</div>}
                                            
                                            {isUploadingImage && (
                                                <div className="text-sm font-bold text-[var(--text-blue)] p-4 text-center flex items-center justify-center gap-2">
                                                    <Icon name="loader" size={18} className="animate-spin" /> 圖片上傳中，請稍候...
                                                </div>
                                            )}

                                            {images.length > 0 && (
                                                <div className="flex flex-wrap gap-3 p-2 bg-gray-50 rounded-[16px]">
                                                    {images.map((img, i) => (
                                                        <div key={i} className="relative group">
                                                            <img src={img} className="w-20 h-20 object-cover rounded-[12px] shadow-sm border border-gray-200 bg-white" alt="預覽" />
                                                            <button type="button" onClick={() => setImages(images.filter((_, idx) => idx !== i))} className="absolute -top-2 -right-2 p-1.5 text-white bg-rose-500 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={12}/></button>
                                                        </div>
                                                    ))}
                                                </div>
