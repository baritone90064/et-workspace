        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            /* 中性柔和背景 (灰藍) */
            --bubble-bg: #F0F4F8; 
            --bubble-text: #334155; 
            --bubble-card: #FFFFFF;
            
            /* 中性粉嫩色系 */
            --pastel-blue: #A8D8EA;     /* 主色調：寶寶藍 */
            --pastel-mint: #B4F8C8;     /* 輔助色：薄荷綠 */
            --pastel-yellow: #FBE7C6;   /* 點綴色：奶油黃 */
            --pastel-orange: #FFAAA5;   /* 警告色：柔和橘/粉 */
            --pastel-gray: #E2E8F0;     /* 中性灰 */

            /* 文字強調色 */
            --text-blue: #1E3A8A;
            --text-mint: #064E3B;
            --text-yellow: #713F12;
            --text-orange: #7F1D1D;

            /* 陰影設定 */
            --shadow-soft: 0 10px 25px -5px rgba(168, 216, 234, 0.4);
            --shadow-float: 0 15px 30px -5px rgba(168, 216, 234, 0.6);
        }

        html {
            font-size: 15px; /* 取代 body zoom，讓整體比例變小但不破壞 iPhone 寬度計算 */
            -webkit-text-size-adjust: 100%;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bubble-bg);
            color: var(--bubble-text);
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(var(--pastel-blue) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            background-attachment: fixed;
            margin: 0;
            min-width: 0;
            overflow-x: hidden; /* iPhone 防止原生日期欄位把畫面撐出橫向捲軸 */
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 泡泡卡片 */
        .bubble-card {
            background: var(--bubble-card);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
        }
        .bubble-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-float);
        }

        /* 圓潤輸入框：針對 iOS Safari 優化寬度與內距 */
        input, select, textarea {
            background: #F8FAFC !important;
            border: 2px solid #E2E8F0 !important;
            border-radius: 20px !important;
            padding: 12px 16px !important; /* 縮減手機版內距，保留更多打字空間 */

            font-weight: 600 !important;
            color: var(--bubble-text) !important;
            transition: all 0.2s ease;
            box-sizing: border-box !important; /* 核心防呆：強制將內距算入寬度 */
            max-width: 100% !important; /* 核心防呆：絕不允許超出父層寬度 */
        }
        input:focus, select:focus, textarea:focus {
            outline: none !important;
            background: #FFFFFF !important;
            border-color: var(--pastel-blue) !important;
            box-shadow: 0 0 0 4px rgba(168, 216, 234, 0.3) !important;

        input[type="date"] {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;

        }

        /* 膠囊按鈕 */
        .bubble-btn {
            border-radius: 9999px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;

            display: inline-flex;
            align-items: center;

        .btn-danger { background: var(--pastel-orange); color: var(--text-orange); box-shadow: 0 4px 15px rgba(255, 170, 165, 0.5); }
        .btn-outline { background: white; border: 2px solid #E2E8F0; color: var(--bubble-text); }
        .btn-outline:not(:disabled):hover { background: #F8FAFC; border-color: #CBD5E1; }

        .tag {
            padding: 4px 12px;
            border-radius: 12px;

            font-weight: 800;

        .modal-overlay {

            display: flex;

        /* 圓潤打勾方塊 (Checklist 用) */
        .cute-checkbox {
            width: 26px;

            border-radius: 8px;

        .bottom-nav {

            backdrop-filter: blur(15px);
            border-top-left-radius: 30px;

            box-shadow: 0 4px 10px rgba(168, 216, 234, 0.5);

        .modal-panel {

        @media (max-width: 480px) {

                max-width: calc(100vw - 24px) !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .mobile-stack {
                grid-template-columns: minmax(0, 1fr) !important;
            }
            .bottom-nav {
                height: calc(76px + env(safe-area-inset-bottom));
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>

    <script type="text/babel" data-presets="classic-react-env">
        // 替換為你的新 Firebase 配置
        const firebaseConfig = typeof __firebase_config !== 'undefined'

            };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : "unisex-bubble-app";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage(); // 初始化 Firebase Storage
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });
        const ALLOWED_EMAILS = ['baritone90064@gmail.com', 'terry4410@gmail.com'];
        const AUTH_POPUP_WATCHDOG_MS = 45000;
        const DATA_LOADING_TIMEOUT_MS = 15000;
        const GOOGLE_REDIRECT_PENDING_KEY = 'teLifeLogGoogleRedirectPending';

        const { useState, useEffect, useMemo, useRef } = React;

        const getLocalDateString = () => {
            const now = new Date();
            const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
            return local.toISOString().split('T')[0];
        };

        const getCurrentMonthString = () => getLocalDateString().substring(0, 7);

        // 回傳「含首尾」的月份日期區間，例如 2026-07-01 ～ 2026-07-31。
        // 畫面上的日期欄位與前端篩選都使用包含截止日的語意；
        // Firestore 若需要「小於下一日」的查詢，再由呼叫端使用 getNextDateString(end) 轉換。
        const getMonthDateRange = (monthKey) => {
            const [year, month] = monthKey.split('-').map(Number);
            const startDate = new Date(year, month - 1, 1);
            const endDate = new Date(year, month, 0);
            const toLocalISO = (d) => {
                const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
                return local.toISOString().split('T')[0];
            };
            return { start: toLocalISO(startDate), end: toLocalISO(endDate) };
        };

        const getYearDateRange = (year = new Date().getFullYear()) => ({ start: `${year}-01-01`, end: `${year}-12-31` });

        const getPreviousMonthString = () => {
            const current = getCurrentMonthString();
            const [year, month] = current.split('-').map(Number);
            const prev = new Date(year, month - 2, 1);
            return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
        };

        const getDateRangeByShortcut = (shortcut) => {
            // 「All」不設定起訖日，讓 Firestore 讀取目前帳號可存取的全部日期資料。
            if (shortcut === 'all') return { start: '', end: '' };
            if (shortcut === 'year') return getYearDateRange();
            if (shortcut === 'month') return getMonthDateRange(getCurrentMonthString());
            if (shortcut === 'lastMonth') return getMonthDateRange(getPreviousMonthString());
            return { start: '', end: '' };
        };

        const normalizeSearchText = (value) => String(value || '')
            .toLowerCase()
            .replace(/；/g, ';')
            .replace(/\s+/g, ' ')
            .trim();

        const containsSearchText = (source, keyword) => {
            const k = normalizeSearchText(keyword);
            if (!k) return true;
            return normalizeSearchText(source).includes(k);
        };

        const formatQueryDateSummary = (start, end) => {
            if (start && end) return `${start}～${end}`;
            if (start) return `${start} 之後`;
            if (end) return `${end} 以前`;
            return '';
        };

        const getNextDateString = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(`${dateStr}T00:00:00`);
            d.setDate(d.getDate() + 1);
            const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
            return local.toISOString().split('T')[0];
        };

        const getMonthEndDateString = (year, month) => {
            const end = new Date(Number(year), Number(month), 0);
            const yyyy = end.getFullYear();
            const mm = String(end.getMonth() + 1).padStart(2, '0');
            const dd = String(end.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const normalizeProjectDate = (value) => {
            if (!value) return '';
            const text = String(value).trim();
            const ymd = text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (ymd) return `${ymd[1]}-${String(ymd[2]).padStart(2, '0')}-${String(ymd[3]).padStart(2, '0')}`;
            const compact = text.match(/^(\d{4})(\d{2})(\d{2})$/);
            if (compact) return `${compact[1]}-${compact[2]}-${compact[3]}`;
            return text.length >= 10 ? text.substring(0, 10) : text;
        };

        const getProjectDateRange = (project) => {
            const start = normalizeProjectDate(project.startDate || project.endDate);
            const end = normalizeProjectDate(project.endDate || project.startDate);
            if (!start || !end) return null;
            return start <= end ? { start, end } : { start: end, end: start };
        };

        const projectOverlapsDateRange = (project, rangeStart, rangeEnd) => {
            const range = getProjectDateRange(project);
            if (!range) return false;
            return range.start <= rangeEnd && range.end >= rangeStart;
        };

        // 記帳選專案使用：只要記帳日期落在專案起訖期間內即可。
        // 若只有起日，視為自起日起持續；若只有迄日，視為迄日前皆可補登。
        const projectIncludesExpenseDate = (project, dateStr) => {
            if (!dateStr) return false;
            const start = normalizeProjectDate(project.startDate);
            const end = normalizeProjectDate(project.endDate);
            if (!start && !end) return false;
            if (start && dateStr < start) return false;
            if (end && dateStr > end) return false;
            return true;
        };

        const projectMatchesYearMonth = (project, yearFilter, monthFilter) => {
            if (yearFilter === 'all' && monthFilter === 'all') return true;
            const range = getProjectDateRange(project);
            if (!range) return false;

            if (yearFilter !== 'all') {
                const rangeStart = monthFilter !== 'all' ? `${yearFilter}-${monthFilter}-01` : `${yearFilter}-01-01`;
                const rangeEnd = monthFilter !== 'all' ? getMonthEndDateString(yearFilter, monthFilter) : `${yearFilter}-12-31`;
                return range.start <= rangeEnd && range.end >= rangeStart;
            }

            if (monthFilter !== 'all') {
                const targetMonth = Number(monthFilter);
                const start = new Date(`${range.start}T00:00:00`);
                const end = new Date(`${range.end}T00:00:00`);
                if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return false;
                const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
                const endCursor = new Date(end.getFullYear(), end.getMonth(), 1);
                while (cursor <= endCursor) {
                    if (cursor.getMonth() + 1 === targetMonth) return true;
                    cursor.setMonth(cursor.getMonth() + 1);
                }
            }
            return false;
        };

        const LAST_DAILY_OWNER_KEY = 'etWorkspaceLastDailyOwner';
        const LAST_DAILY_PROJECT_KEY = 'etWorkspaceLastDailyProjectByDate';
        const DAILY_COMBO_OWNER = 'Terry； Eric';
        const normalizeDailyOwnerOption = (owner) => {
            const text = String(owner || '').trim();
            return text === 'Terry;Eric' ? DAILY_COMBO_OWNER : text;
        };

        const buildOwnerLabel = (owners = []) => owners.filter(Boolean).join('； ');
        const getSavedDailyOwner = () => {
            try { return normalizeDailyOwnerOption(localStorage.getItem(LAST_DAILY_OWNER_KEY) || ''); }
            catch (e) { return ''; }
        };
        const saveDailyOwner = (owner) => {
            try {
                const normalized = normalizeDailyOwnerOption(owner);
                if (normalized) localStorage.setItem(LAST_DAILY_OWNER_KEY, normalized);
            }
            catch (e) {}
        };

        // 只記住「今天最後一筆成功儲存」的專案；跨日自動失效。
        // projectId 可為空字串，代表上一筆是「無專案」。
        const getSavedDailyProjectForDate = (date) => {
            const today = getLocalDateString();
            if (!date || date !== today) return '';
            try {
                const raw = localStorage.getItem(LAST_DAILY_PROJECT_KEY);
                if (!raw) return '';
                const saved = JSON.parse(raw);
                if (!saved || saved.date !== today) {
                    localStorage.removeItem(LAST_DAILY_PROJECT_KEY);
                    return '';
                }
                return String(saved.projectId || '');
            } catch (e) {
                try { localStorage.removeItem(LAST_DAILY_PROJECT_KEY); } catch (_) {}
                return '';
            }
        };

        const saveDailyProjectForDate = (date, projectId) => {
            const today = getLocalDateString();
            if (!date || date !== today) return;
            try {
                localStorage.setItem(LAST_DAILY_PROJECT_KEY, JSON.stringify({
                    date: today,
                    projectId: String(projectId || '')
                }));
            } catch (e) {}
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const container = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    container.appendChild(i);
                    window.lucide.createIcons({
                        root: container,
                        attrs: { width: size, height: size, class: className, 'stroke-width': 2.5 }
                    });
                    setSvgHtml(container.innerHTML);
                }
            }, [name, size, className]);
            if (!svgHtml) return <span style={{ width: size, height: size, display: 'inline-block' }} className={className} />;
            return <span className="inline-flex shrink-0" dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

        const compressImage = (base64Str, maxWidth = 1024, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        };

        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState('');
            const [isSigningIn, setIsSigningIn] = useState(false);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [loadedSources, setLoadedSources] = useState({
                daily: false,
                projects: false,
                categories: false,
                expenseItems: false,
                members: false
            });
            
            // --- Data States ---
            const [dailyExpenses, setDailyExpenses] = useState([]);
            const [analyticsDailyExpenses, setAnalyticsDailyExpenses] = useState([]);
            const [projects, setProjects] = useState([]);
            const [categories, setCategories] = useState([]);
            const [expenseItems, setExpenseItems] = useState([]);
            const [members, setMembers] = useState([]);

            // 設定頁排序草稿：只有進入「調整排序」模式後才顯示拖曳把手，
            // 拖曳只調整本機順序，按「儲存」後才一次寫入 Firebase。
            const [settingsDraftOrders, setSettingsDraftOrders] = useState({ categories: [], expenseItems: [] });
            const [settingsOrderDirty, setSettingsOrderDirty] = useState({ categories: false, expenseItems: false });
            const [settingsOrderEditing, setSettingsOrderEditing] = useState({ categories: false, expenseItems: false });
            const [settingsDragging, setSettingsDragging] = useState(null);
            const settingsListRefs = useRef({});
            const settingsDragRef = useRef(null);
            
            // --- UI States ---
            const [activeTab, setActiveTab] = useState('daily'); 
            const [projectSubTab, setProjectSubTab] = useState('active'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [isDailyLoading, setIsDailyLoading] = useState(false);
            const [isAnalyticsLoading, setIsAnalyticsLoading] = useState(false);
            const chartRefs = useRef({ trend: null, cat: null });
            const trendCanvasRef = useRef(null);
            const catCanvasRef = useRef(null);
            
            // --- Filter & Sort States ---
            const [dailySort, setDailySort] = useState('desc');

            const [analyticsDraftEnd, setAnalyticsDraftEnd] = useState(initialAnalyticsRange.end);
            const [analyticsDraftCatFilter, setAnalyticsDraftCatFilter] = useState('all');
            const [analyticsDraftOwnerFilter, setAnalyticsDraftOwnerFilter] = useState('all');
            const [analyticsDraftProjectCategoryFilter, setAnalyticsDraftProjectCategoryFilter] = useState('all');
            const [analyticsDraftProjectFilter, setAnalyticsDraftProjectFilter] = useState('all');
            const [analyticsDraftKeyword, setAnalyticsDraftKeyword] = useState('');

            // --- Calendar States ---
            const [currentCalMonth, setCurrentCalMonth] = useState(new Date());

            const [inputDialog, setInputDialog] = useState({ isOpen: false, title: '', value: '', placeholder: '', onConfirm: null });

            // Daily Form
            const [dailyDate, setDailyDate] = useState(getLocalDateString());
            const [dailyAmount, setDailyAmount] = useState('');
            const [dailyItem, setDailyItem] = useState('');
            const [dailyDesc, setDailyDesc] = useState('');
            const [dailyOwner, setDailyOwner] = useState(() => getSavedDailyOwner());
            const [dailyProjectId, setDailyProjectId] = useState(() => getSavedDailyProjectForDate(getLocalDateString()));
            
            // Daily Edit Modal State (取代跳至頂部的設計)
            const [dailyEditData, setDailyEditData] = useState(null);

            // Project Form
            const [isProjectFormOpen, setIsProjectFormOpen] = useState(false);
            const [projectEditingId, setProjectEditingId] = useState(null);
            const [projectText, setProjectText] = useState('');
            const [owners, setOwners] = useState([]);
            const [category, setCategory] = useState('');
            const [note, setNote] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [showInCalendar, setShowInCalendar] = useState(true);
            const [links, setLinks] = useState([]);
            const [images, setImages] = useState([]);
            const [projectOriginalImages, setProjectOriginalImages] = useState([]);
            const [isUploadingImage, setIsUploadingImage] = useState(false);

            const isProjectDateInvalid = startDate && endDate && endDate < startDate;

            // Project Detail
            const [expandedProject, setExpandedProject] = useState({});
            // 舊版專案費用移轉防重入：V32 起所有消費統一存 dailyExpenses。
            const legacyExpenseMigrationRef = useRef(false);
            
            // Project Checklist State 
            const [newChecklistText, setNewChecklistText] = useState({});
            const [checklistAttachmentModal, setChecklistAttachmentModal] = useState(null);
            const [checklistAttachmentLinks, setChecklistAttachmentLinks] = useState([]);
            const [checklistAttachmentImages, setChecklistAttachmentImages] = useState([]);
            const [checklistAttachmentOriginalImages, setChecklistAttachmentOriginalImages] = useState([]);
            const [isUploadingChecklistImage, setIsUploadingChecklistImage] = useState(false);

            // 日常記帳成員選項：保留原本單一成員，同時提供 Terry； Eric 共同記帳選項
            const dailyOwnerOptions = useMemo(() => {
                const names = members.map(m => m.name).filter(Boolean).map(normalizeDailyOwnerOption);
                const comboOwner = DAILY_COMBO_OWNER;
                const hasTerry = names.includes('Terry');
                const hasEric = names.includes('Eric');
                return hasTerry && hasEric && !names.includes(comboOwner) ? [...names, comboOwner] : names;
            }, [members]);

            // 專案的 owners 是陣列；增加「Terry； Eric」條件，用來查詢兩人共同參與的專案。
            const projectOwnerOptions = useMemo(() => {
                const names = members.map(m => m.name).filter(Boolean).map(normalizeDailyOwnerOption);
                const hasTerry = names.includes('Terry');
                const hasEric = names.includes('Eric');
                return hasTerry && hasEric && !names.includes(DAILY_COMBO_OWNER)
                    ? [...names, DAILY_COMBO_OWNER]
                    : names;
            }, [members]);


            const availableProjectsForDailyDate = useMemo(() => projects
                .filter(project => projectIncludesExpenseDate(project, dailyDate))
                .sort((a, b) => (a.startDate || '').localeCompare(b.startDate || '') || (a.text || '').localeCompare(b.text || '')),
            [projects, dailyDate]);

            const projectExpenseMap = useMemo(() => {
                const map = {};
                dailyExpenses.forEach(expense => {
                    if (!expense.projectId) return;
                    if (!map[expense.projectId]) map[expense.projectId] = [];
                    map[expense.projectId].push(expense);
                });
                Object.values(map).forEach(list => list.sort((a, b) => (b.date || '').localeCompare(a.date || '')));
                return map;
            }, [dailyExpenses]);

            const getProjectExpenses = (projectId) => projectExpenseMap[projectId] || [];
            const getExpenseProjectName = (expense) => {
                if (!expense?.projectId) return '';
                return projects.find(project => project.id === expense.projectId)?.text || expense.projectName || '';
            };

            const mergeSettingsDraftWithSource = (draftItems, sourceItems) => {
                const sourceMap = new Map((sourceItems || []).map(item => [item.id, item]));
                const merged = (draftItems || [])
                    .filter(item => sourceMap.has(item.id))
                    .map(item => sourceMap.get(item.id));
                const existingIds = new Set(merged.map(item => item.id));
                (sourceItems || []).forEach(item => {
                    if (!existingIds.has(item.id)) merged.push(item);
                });
                return merged;
            };

            // Firebase 即時資料更新時：未調整排序就直接同步；有未儲存排序時則保留草稿順序，
            // 同時合併新增、刪除或改名後的最新資料。
            useEffect(() => {
                setSettingsDraftOrders(prev => ({
                    ...prev,
                    categories: settingsOrderDirty.categories
                        ? mergeSettingsDraftWithSource(prev.categories, categories)
                        : [...categories]
                }));
            }, [categories]);

            useEffect(() => {
                setSettingsDraftOrders(prev => ({
                    ...prev,
                    expenseItems: settingsOrderDirty.expenseItems
                        ? mergeSettingsDraftWithSource(prev.expenseItems, expenseItems)
                        : [...expenseItems]
                }));
            }, [expenseItems]);

            const markSourceLoaded = (key) => {
                setLoadedSources(prev => prev[key] ? prev : ({ ...prev, [key]: true }));
            };

            const handleDailyOwnerChange = (e) => {
                const owner = e.target.value;
                setDailyOwner(owner);
                saveDailyOwner(owner);
            };

            const handleDailyDateChange = (e) => {
                const nextDate = e.target.value;
                setDailyDate(nextDate);
                // 只有切回今天時，才恢復今天上一筆成功儲存的專案。
                // 查詢／補登其他日期時不沿用，避免誤歸類。
                setDailyProjectId(nextDate === getLocalDateString() ? getSavedDailyProjectForDate(nextDate) : '');
            };

            const normalizeEmail = (email) => String(email || '').trim().toLowerCase();

            const getFirebaseUserEmail = (firebaseUser) => {
                if (!firebaseUser) return '';
                if (firebaseUser.email) return normalizeEmail(firebaseUser.email);
                const providerEmail = (firebaseUser.providerData || []).find(item => item && item.email)?.email;
                return normalizeEmail(providerEmail);
            };

            const isAllowedEmail = (email) => ALLOWED_EMAILS.map(normalizeEmail).includes(normalizeEmail(email));

            const createTimeoutError = (code, message) => {
                const error = new Error(message);
                error.code = code;
                return error;
            };

            const withTimeout = (promise, timeoutMs, code, message) => {
                let timerId;
                const timeoutPromise = new Promise((_, reject) => {
                    timerId = window.setTimeout(() => reject(createTimeoutError(code, message)), timeoutMs);
                });
                return Promise.race([promise, timeoutPromise])
                    .finally(() => window.clearTimeout(timerId));
            };

            const isStandaloneApp = () => {
                try {
                    return window.matchMedia?.('(display-mode: standalone)')?.matches === true
                        || window.navigator.standalone === true;
                } catch (error) {
                    return false;
                }
            };

            const isMobileBrowser = () => {
                const userAgent = navigator.userAgent || '';
                return /Android|iPhone|iPad|iPod|Mobile/i.test(userAgent)
                    || Math.min(window.innerWidth || 9999, window.screen?.width || 9999) <= 768;
            };

            const isEmbeddedPage = () => {
                try { return window.self !== window.top; }
                catch (error) { return true; }
            };

            // 此 App 部署在 Vercel。為避免 signInWithRedirect 在第三方儲存限制下無法回傳，
            // Vercel 正式網域一律使用 popup。請用 Safari／Chrome 正式分頁開啟，不要在內嵌預覽中登入。
            const shouldUseGoogleRedirect = () => false;

            const getGoogleLoginErrorMessage = (err) => {
                switch (err?.code) {
                    case 'auth/popup-blocked':
                        return 'Google 登入視窗被瀏覽器阻擋，請允許彈出視窗後再試一次。';
                    case 'auth/popup-closed-by-user':
                    case 'auth/cancelled-popup-request':
                        return 'Google 登入尚未完成，請重新登入。';
                    case 'auth/unauthorized-domain':
                        return `目前網站網域尚未加入 Firebase 授權網域：${window.location.hostname}`;
                    case 'auth/network-request-failed':
                        return '網路連線異常，請確認網路後再試一次。';
                    case 'auth/web-storage-unsupported':
                        return '瀏覽器目前禁止儲存登入狀態，請允許 Cookie／網站資料後再試一次。';
                    case 'auth/operation-not-supported-in-this-environment':
                        return '目前瀏覽器環境不支援 Google 登入，請改用 Safari、Chrome 或 Edge 開啟正式網站。';
                    case 'auth/account-exists-with-different-credential':
                        return '此電子郵件已使用其他登入方式建立，請改用原本的登入方式。';
                    default:
                        return err?.message || 'Google 登入失敗，請稍後再試。';
                }
            };

            const acceptGoogleUser = async (firebaseUser) => {
                if (!firebaseUser) return false;
                const email = getFirebaseUserEmail(firebaseUser);

                if (!isAllowedEmail(email)) {
                    await auth.signOut().catch(() => {});
                    setUser(null);
                    setAuthError('此 Google 帳號沒有權限使用 T&E LifeLog。');
                    setIsInitialLoading(false);
                    return false;
                }

                setAuthError('');
                setUser(firebaseUser);
                setIsInitialLoading(true);
                return true;
            };

            const signInWithGoogle = async () => {
                if (isSigningIn) return;

                setIsSigningIn(true);
                setAuthError('');

                if (window.location.protocol === 'file:') {
                    setAuthError('Google 登入不能從本機 HTML 檔直接執行，請從正式部署網址開啟。');
                    setIsSigningIn(false);
                    return;
                }

                if (isEmbeddedPage()) {
                    setAuthError('目前頁面是在內嵌預覽中，Google 登入無法完成。請用新分頁開啟正式網站後再登入。');
                    setIsSigningIn(false);
                    return;
                }

                try {
                    // setPersistence 已在 App 初始化時設定。不要在點擊後先 await，
                    // 以免 Safari 判定 popup 已失去使用者點擊觸發資格。
                    if (auth.currentUser?.isAnonymous) {
                        await auth.signOut();
                    }

                    if (shouldUseGoogleRedirect()) {
                        // iPhone、Android 或加入主畫面的 Web App：改用整頁重新導向，
                        // 避免 popup 開到 Safari／新分頁後無法回傳給原本 App。
                        try { sessionStorage.setItem(GOOGLE_REDIRECT_PENDING_KEY, '1'); }
                        catch (error) {}

                        await auth.signInWithRedirect(googleProvider);
                        return;
                    }

                    // 桌機使用 popup。Watchdog 只解除畫面狀態，不用 Promise.race 中斷 Firebase 流程。
                    let popupFinished = false;
                    const watchdogId = window.setTimeout(() => {
                        if (!popupFinished && !auth.currentUser) {
                            setIsSigningIn(false);
                            setAuthError('Google 登入視窗尚未完成。請關閉舊視窗後重試，或確認瀏覽器沒有封鎖彈出視窗。');
                        }
                    }, AUTH_POPUP_WATCHDOG_MS);

                    try {
                        const result = await auth.signInWithPopup(googleProvider);
                        popupFinished = true;
                        await acceptGoogleUser(result?.user || auth.currentUser);
                    } finally {
                        popupFinished = true;
                        window.clearTimeout(watchdogId);
                    }
                } catch (err) {
                    console.error('Google 登入失敗:', err);

                    const currentUser = auth.currentUser;
                    if (currentUser && isAllowedEmail(getFirebaseUserEmail(currentUser))) {
                        await acceptGoogleUser(currentUser);
                    } else {
                        setAuthError(getGoogleLoginErrorMessage(err));
                        setIsInitialLoading(false);
                    }
                } finally {
                    // redirect 成功時頁面會離開；若沒有離開，確保按鈕恢復。
                    setIsSigningIn(false);
                }
            };

            const signOutUser = async () => {
                try {
                    setAuthError('');
                    await auth.signOut();
                } catch (err) {
                    console.error('登出失敗:', err);
                    alert(`登出失敗：${err.message || '請稍後再試'}`);
                }
            };

            useEffect(() => {
                let isMounted = true;

                auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                    .catch(err => console.warn('登入狀態保存設定失敗:', err));

                const finishSignedOutState = () => {
                    if (!isMounted) return;
                    setUser(null);
                    setIsSigningIn(false);
                    setIsInitialLoading(false);
                };

                // 處理行動版 signInWithRedirect 回到本頁後的結果與錯誤。
                auth.getRedirectResult()
                    .then(async result => {
                        if (!isMounted) return;
                        try { sessionStorage.removeItem(GOOGLE_REDIRECT_PENDING_KEY); }
                        catch (error) {}

                        if (result?.user) {
                            await acceptGoogleUser(result.user);
                        }
                    })
                    .catch(err => {
                        if (!isMounted) return;
                        console.error('Google redirect 登入失敗:', err);
                        setAuthError(getGoogleLoginErrorMessage(err));
                        setIsInitialLoading(false);
                    })
                    .finally(() => {
                        if (isMounted) setIsSigningIn(false);
                    });

                const unsubscribe = auth.onAuthStateChanged(
                    currentUser => {
                        if (!isMounted) return;

                        setIsSigningIn(false);

                        if (currentUser?.isAnonymous) {
                            auth.signOut()
                                .catch(err => console.warn('清除舊匿名登入失敗:', err))
                                .finally(finishSignedOutState);
                            return;
                        }

                        if (currentUser) {
                            const email = getFirebaseUserEmail(currentUser);

                            if (!isAllowedEmail(email)) {
                                setAuthError('此 Google 帳號沒有權限使用 T&E LifeLog。');
                                setUser(null);
                                setIsInitialLoading(false);
                                auth.signOut().catch(err => console.warn('未授權帳號自動登出失敗:', err));
                                return;
                            }

                            setAuthError('');
                            setUser(currentUser);
                            return;
                        }

                        setUser(null);
                        setIsInitialLoading(false);
                    },
                    err => {
                        if (!isMounted) return;
                        console.error('監聽登入狀態失敗:', err);
                        setAuthError(getGoogleLoginErrorMessage(err));
                        setIsSigningIn(false);
                        setIsInitialLoading(false);
                    }
                );

                return () => {
                    isMounted = false;
                    unsubscribe();
                };
            }, []);

            useEffect(() => {
                if (!user || !isAllowedEmail(getFirebaseUserEmail(user))) return;
                setIsInitialLoading(true);
                setLoadedSources({ daily: false, projects: false, categories: false, expenseItems: false, members: false });

                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const sortConfig = (a, b) => {
                    const orderDiff = (a.order ?? 0) - (b.order ?? 0);
                    if (orderDiff !== 0) return orderDiff;
                    return a.id.localeCompare(b.id);
                };

                // 專案資料目前仍保留即時監聽：專案筆數通常遠少於日常流水帳，且行事曆/進行中/已結束需要即時同步。
                const unsubProjects = path.collection('tasks').onSnapshot(
                    snap => {
                        setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        markSourceLoaded('projects');
                    },
                    err => { console.error('讀取專案資料失敗:', err); markSourceLoaded('projects'); }
                );
                
                const unsubCats = path.collection('categories').onSnapshot(
                    snap => {
                        let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                        if (d.length === 0) ['日常', '旅遊', '專案'].forEach((name, i) => path.collection('categories').add({ name, order: i, createdAt: new Date().toISOString() }));
                        else setCategories(d);
                        markSourceLoaded('categories');
                    },
                    err => { console.error('讀取專案類別失敗:', err); markSourceLoaded('categories'); }
                );

                const unsubExpItems = path.collection('expenseItems').onSnapshot(
                    snap => {
                        let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                        if (d.length === 0) ['餐飲', '交通', '購物', '娛樂'].forEach((name, i) => path.collection('expenseItems').add({ name, order: i, createdAt: new Date().toISOString() }));
                        else setExpenseItems(d);
                        markSourceLoaded('expenseItems');
                    },
                    err => { console.error('讀取費用分類失敗:', err); markSourceLoaded('expenseItems'); }
                );

                const unsubMembers = path.collection('members').onSnapshot(
                    snap => {
                        let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                        if (d.length === 0) ['Terry', 'Eric'].forEach((name, i) => path.collection('members').add({ name, order: i, createdAt: new Date().toISOString() }));
                        else setMembers(d);
                        markSourceLoaded('members');
                    },
                    err => { console.error('讀取成員失敗:', err); markSourceLoaded('members'); }
                );

                return () => { unsubProjects(); unsubCats(); unsubExpItems(); unsubMembers(); };
            }, [user]);

            useEffect(() => {
                if (!user || !isAllowedEmail(getFirebaseUserEmail(user))) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');

                // V32：dailyExpenses 成為唯一消費資料來源。
                // 一次同步完整消費資料；日常、專案、統計僅在前端依日期/條件顯示，避免同一筆費用存在兩套資料。
                setIsDailyLoading(true);
                setLoadedSources(prev => ({ ...prev, daily: false }));

                const unsubDaily = path.collection('dailyExpenses').onSnapshot(
                    snap => {
                        const allExpenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setDailyExpenses(allExpenses);
                        setAnalyticsDailyExpenses(allExpenses);
                        setIsDailyLoading(false);
                        setIsAnalyticsLoading(false);
                        markSourceLoaded('daily');
                    },
                    err => {
                        console.error('讀取消費資料失敗:', err);
                        setDailyExpenses([]);
                        setAnalyticsDailyExpenses([]);
                        setIsDailyLoading(false);
                        setIsAnalyticsLoading(false);
                        markSourceLoaded('daily');
                    }
                );

                return () => unsubDaily();
            }, [user]);

            useEffect(() => {
                if (!user || !isAllowedEmail(getFirebaseUserEmail(user))) return;

                if (Object.values(loadedSources).every(Boolean)) {
                    setIsInitialLoading(false);
                    return;
                }

                // Firestore 某個監聽若因網路或瀏覽器問題一直沒有回呼，
                // 最多顯示載入畫面 15 秒，避免整個 App 永久被遮住。
                const loadingTimer = window.setTimeout(() => {
                    console.warn('資料載入等待逾時，先解除載入畫面:', loadedSources);
                    setIsInitialLoading(false);
                }, DATA_LOADING_TIMEOUT_MS);

                return () => window.clearTimeout(loadingTimer);
            }, [user, loadedSources]);

            useEffect(() => {
                if (dailyOwnerOptions.length === 0) return;
                const savedOwner = getSavedDailyOwner();
                const normalizedCurrentOwner = normalizeDailyOwnerOption(dailyOwner);
                const nextOwner = savedOwner && dailyOwnerOptions.includes(savedOwner)
                    ? savedOwner
                    : (normalizedCurrentOwner && dailyOwnerOptions.includes(normalizedCurrentOwner) ? normalizedCurrentOwner : dailyOwnerOptions[0]);

                if (!dailyOwner || !dailyOwnerOptions.includes(normalizedCurrentOwner) || dailyOwner !== normalizedCurrentOwner) {
                    setDailyOwner(nextOwner);
                    saveDailyOwner(nextOwner);
                }
            }, [dailyOwnerOptions]);

            useEffect(() => {
                if (!loadedSources.projects || !dailyProjectId) return;
                const selectedProject = projects.find(project => project.id === dailyProjectId);
                if (!selectedProject || !projectIncludesExpenseDate(selectedProject, dailyDate)) {
                    setDailyProjectId('');
                    // 若今天記住的專案已刪除、停用日期不符等，同步清掉失效記憶。
                    if (dailyDate === getLocalDateString()) saveDailyProjectForDate(dailyDate, '');
                }
            }, [dailyDate, dailyProjectId, projects, loadedSources.projects]);

            useEffect(() => {
                if (!user || !isAllowedEmail(getFirebaseUserEmail(user)) || legacyExpenseMigrationRef.current) return;

                setAnalyticsDraftOwnerFilter('all');
                setAnalyticsDraftProjectCategoryFilter('all');
                setAnalyticsDraftProjectFilter('all');
                setAnalyticsDraftKeyword('');
                setAnalyticsStart(currentMonthRange.start);
                setAnalyticsEnd(currentMonthRange.end);
                setAnalyticsCatFilter('all');
                setAnalyticsOwnerFilter('all');
                setAnalyticsProjectCategoryFilter('all');
                setAnalyticsProjectFilter('all');
                setAnalyticsKeyword('');
                setIsAnalyticsFilterOpen(false);
            };

            const dailyQuerySummary = useMemo(() => {
                if (!hasDailyQuery) return '';
                return [
                    (!dailyQuery.start && !dailyQuery.end) ? 'All' : formatQueryDateSummary(dailyQuery.start, dailyQuery.end),
                    dailyQuery.item !== 'all' ? dailyQuery.item : '',
                    dailyQuery.owner !== 'all' ? dailyQuery.owner : '',
                    dailyQuery.project !== 'all' ? (dailyQuery.project === 'none' ? '無專案' : (projects.find(p => p.id === dailyQuery.project)?.text || '專案')) : '',
                    dailyQuery.note.trim() ? `備註：${dailyQuery.note.trim()}` : ''
                ].filter(Boolean).join('｜');
            }, [dailyQuery, hasDailyQuery, projects]);

            const projectQuerySummary = useMemo(() => {
                if (!hasProjectQuery) return '';
                return [
                    formatQueryDateSummary(projectQuery.start, projectQuery.end),
                    projectQuery.category !== 'all' ? `專案：${projectQuery.category}` : '',
                    projectQuery.expenseItem !== 'all' ? `費用：${projectQuery.expenseItem}` : '',
                    projectQuery.owner !== 'all' ? projectQuery.owner : '',
                    projectQuery.text.trim() ? `文字：${projectQuery.text.trim()}` : '',
                    selectedCalDate ? `日期：${selectedCalDate}` : ''
                ].filter(Boolean).join('｜');
            }, [projectQuery, selectedCalDate, hasProjectQuery]);

            // --- 計算與顯示處理 ---
            const displayDaily = useMemo(() => {
                let filtered = [...dailyExpenses];
                if (dailyQuery.start) filtered = filtered.filter(d => (d.date || '') >= dailyQuery.start);
                if (dailyQuery.end) filtered = filtered.filter(d => (d.date || '') <= dailyQuery.end);
                if (dailyQuery.item !== 'all') filtered = filtered.filter(d => d.item === dailyQuery.item);
                if (dailyQuery.owner !== 'all') filtered = filtered.filter(d => normalizeSearchText(d.owner) === normalizeSearchText(dailyQuery.owner));
                if (dailyQuery.project === 'none') filtered = filtered.filter(d => !d.projectId);
                else if (dailyQuery.project !== 'all') filtered = filtered.filter(d => d.projectId === dailyQuery.project);
                if (dailyQuery.note.trim()) filtered = filtered.filter(d => containsSearchText(d.desc, dailyQuery.note));
                filtered.sort((a, b) => {
                    const dateA = a.date || ''; const dateB = b.date || '';
                    return dailySort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [dailyExpenses, dailySort, dailyQuery, hasDailyQuery]);

            const dailyFilteredTotal = useMemo(() => {
                return displayDaily.reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
            }, [displayDaily]);

            const homeScheduleReminders = useMemo(() => {
                const today = getLocalDateString();
                const tomorrow = getNextDateString(today);

                const findProjectsForDate = (targetDate) => projects
                    .filter(p => !p.completed && p.showInCalendar !== false && projectOverlapsDateRange(p, targetDate, targetDate))
                    .sort((a, b) => {
                        const dateA = a.startDate || a.createdAt || '';
                        const dateB = b.startDate || b.createdAt || '';
                        return dateA.localeCompare(dateB);
                    });

                return {
                    today,
                    tomorrow,
                    todayProjects: findProjectsForDate(today),
                    tomorrowProjects: findProjectsForDate(tomorrow)
                };
            }, [projects]);

            const availableProjectYears = useMemo(() => {
                const years = new Set();
                projects.forEach(t => {
                    const range = getProjectDateRange(t);
                    if (!range) return;
                    const startYear = Number(range.start.substring(0, 4));
                    const endYear = Number(range.end.substring(0, 4));
                    if (Number.isNaN(startYear) || Number.isNaN(endYear)) return;
                    for (let y = startYear; y <= endYear; y++) years.add(y);
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [projects]);

            const hasProjectFilters = projectKeyword.trim() || projectYearFilter !== 'all' || projectMonthFilter !== 'all' || selectedCalDate;

            const displayProjects = useMemo(() => {
                let filtered = projects.filter(t => projectSubTab === 'active' ? !t.completed : t.completed);

                if (projectQuery.start || projectQuery.end) {
                    const start = projectQuery.start || '0000-01-01';
                    const end = projectQuery.end || '9999-12-31';
                    filtered = filtered.filter(t => projectOverlapsDateRange(t, start, end));
                }

                if (selectedCalDate) {
                    filtered = filtered.filter(t => {
                        if (!t.startDate && !t.endDate) return false;
                        return t.showInCalendar !== false && projectOverlapsDateRange(t, selectedCalDate, selectedCalDate);
                    });
                }

                if (projectQuery.category !== 'all') filtered = filtered.filter(t => t.category === projectQuery.category);
                if (projectQuery.owner !== 'all') {
                    filtered = filtered.filter(t => {
                        const currentOwners = (t.owners || []).map(normalizeDailyOwnerOption);
                        if (projectQuery.owner === DAILY_COMBO_OWNER) {
                            return currentOwners.includes('Terry') && currentOwners.includes('Eric');
                        }
                        return currentOwners.includes(normalizeDailyOwnerOption(projectQuery.owner));
                    });
                }
                if (projectQuery.expenseItem !== 'all') filtered = filtered.filter(t => getProjectExpenses(t.id).some(e => e.item === projectQuery.expenseItem));

                const keyword = projectQuery.text.trim();
                if (keyword) {
                    filtered = filtered.filter(t => {
                        const expenseNotes = getProjectExpenses(t.id).map(e => e.desc || '').join(' ');
                        const searchableText = [t.text, t.note, expenseNotes].filter(Boolean).join(' ');
                        return containsSearchText(searchableText, keyword);
                    });
                }

                filtered.sort((a, b) => {
                    const dateA = a.startDate || a.createdAt || ''; const dateB = b.startDate || b.createdAt || '';
                    return projectSort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [projects, projectSubTab, projectSort, selectedCalDate, projectQuery, projectExpenseMap]);
            
            const calDays = useMemo(() => {
                const year = currentCalMonth.getFullYear();
                const month = currentCalMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayProjects = projects.filter(t => t.showInCalendar !== false && projectOverlapsDateRange(t, dateStr, dateStr));
                    days.push({ day: i, dateStr, projects: dayProjects });
                }
                return days;
            }, [currentCalMonth, projects]);

            const analyticsData = useMemo(() => {
                const ownerMap = {}; let totalExpense = 0; const trendMap = {}; const catMap = {}; const rows = [];
                const keyword = analyticsKeyword.trim();

                analyticsDailyExpenses.forEach(d => {
                    if (analyticsStart && (d.date || '') < analyticsStart) return;
                    if (analyticsEnd && (d.date || '') > analyticsEnd) return;
                    if (analyticsCatFilter !== 'all' && d.item !== analyticsCatFilter) return;

                    const linkedProject = d.projectId ? projects.find(project => project.id === d.projectId) : null;
                    if (analyticsProjectCategoryFilter !== 'all' && (!linkedProject || linkedProject.category !== analyticsProjectCategoryFilter)) return;
                    if (analyticsProjectFilter === 'none' && d.projectId) return;
                    if (analyticsProjectFilter !== 'all' && analyticsProjectFilter !== 'none' && d.projectId !== analyticsProjectFilter) return;

                    const projectName = getExpenseProjectName(d);
                    if (keyword && !containsSearchText([d.desc, projectName].filter(Boolean).join(' '), keyword)) return;

                    const amt = parseFloat(d.amount) || 0;
                    const legacyOwners = d.legacyProjectExpense && Array.isArray(d.allocationOwners)
                        ? d.allocationOwners.filter(Boolean)
                        : [];

                    // 舊專案費用沿用舊版「依專案參與者平均分攤」的統計邏輯；
                    // V32 新增的記帳則依記帳時自行選擇的成員計算，避免改變既有歷史統計。
                    if (legacyOwners.length > 0) {
                        if (analyticsOwnerFilter !== 'all') {
                            if (!legacyOwners.includes(analyticsOwnerFilter)) return;
                            const splitAmount = amt / legacyOwners.length;
                            totalExpense += splitAmount;
                            ownerMap[analyticsOwnerFilter] = (ownerMap[analyticsOwnerFilter] || 0) + splitAmount;
                            catMap[d.item] = (catMap[d.item] || 0) + splitAmount;
                            const monthKey = d.date ? d.date.substring(0, 7) : 'Unknown';
                            trendMap[monthKey] = (trendMap[monthKey] || 0) + splitAmount;
                            rows.push({ source: d.projectId ? '專案' : '日常', date: d.date || '', title: d.desc || '無備註', item: d.item || '', owner: legacyOwners.join('、'), amount: splitAmount, projectName });
                        } else {
                            totalExpense += amt;
                            catMap[d.item] = (catMap[d.item] || 0) + amt;
                            const monthKey = d.date ? d.date.substring(0, 7) : 'Unknown';
                            trendMap[monthKey] = (trendMap[monthKey] || 0) + amt;
                            const splitAmount = amt / legacyOwners.length;
                            legacyOwners.forEach(owner => { ownerMap[owner] = (ownerMap[owner] || 0) + splitAmount; });
                            rows.push({ source: d.projectId ? '專案' : '日常', date: d.date || '', title: d.desc || '無備註', item: d.item || '', owner: legacyOwners.join('、'), amount: amt, projectName });
                        }
                        return;
                    }

                    if (analyticsOwnerFilter !== 'all' && normalizeSearchText(d.owner) !== normalizeSearchText(analyticsOwnerFilter)) return;
                    totalExpense += amt;
                    ownerMap[d.owner || '未指定'] = (ownerMap[d.owner || '未指定'] || 0) + amt;
                    catMap[d.item] = (catMap[d.item] || 0) + amt;
                    const monthKey = d.date ? d.date.substring(0, 7) : 'Unknown';
                    trendMap[monthKey] = (trendMap[monthKey] || 0) + amt;
                    rows.push({ source: d.projectId ? '專案' : '日常', date: d.date || '', title: d.desc || '無備註', item: d.item || '', owner: d.owner || '', amount: amt, projectName });
                });

                return { sortedOwners: Object.entries(ownerMap).sort((a,b)=>b[1]-a[1]), totalExpense, trendKeys: Object.keys(trendMap).sort(), trendMap, catMap, rows };
            }, [analyticsDailyExpenses, projects, analyticsStart, analyticsEnd, analyticsCatFilter, analyticsOwnerFilter, analyticsProjectCategoryFilter, analyticsProjectFilter, analyticsKeyword]);

            const sortedAnalyticsRows = useMemo(() => {
                return [...analyticsData.rows].sort((a, b) => analyticsListSort === 'desc'
                    ? (b.date || '').localeCompare(a.date || '')
                    : (a.date || '').localeCompare(b.date || ''));
            }, [analyticsData.rows, analyticsListSort]);

            useEffect(() => {
                if (activeTab !== 'analytics') return;

                if (chartRefs.current.trend) { chartRefs.current.trend.destroy(); chartRefs.current.trend = null; }
                if (chartRefs.current.cat) { chartRefs.current.cat.destroy(); chartRefs.current.cat = null; }

                const trendCtx = trendCanvasRef.current?.getContext('2d');
                if (trendCtx) {
                    chartRefs.current.trend = new Chart(trendCtx, {
                        type: 'bar',
                        data: { labels: analyticsData.trendKeys, datasets: [{ data: analyticsData.trendKeys.map(k => analyticsData.trendMap[k]), backgroundColor: '#A8D8EA', borderRadius: 8, borderWidth: 0 }] },
                        options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { borderDash: [4,4] } } } }
                    });
                }

                const catCtx = catCanvasRef.current?.getContext('2d');
                if (catCtx && Object.keys(analyticsData.catMap).length > 0) {
                    const bgColors = ['#A8D8EA', '#B4F8C8', '#FBE7C6', '#FFAAA5', '#E2E8F0', '#FFD3B6', '#D4A5A5', '#A2E1DB', '#EAD8F7'];
                    chartRefs.current.cat = new Chart(catCtx, {
                        type: 'doughnut',
                        data: { labels: Object.keys(analyticsData.catMap), datasets: [{ data: Object.values(analyticsData.catMap), backgroundColor: bgColors, borderWidth: 0 }] },
                        options: { plugins: { legend: { position: 'right' } }, maintainAspectRatio: false }
                    });
                }

                return () => {
                    if (chartRefs.current.trend) { chartRefs.current.trend.destroy(); chartRefs.current.trend = null; }
                    if (chartRefs.current.cat) { chartRefs.current.cat.destroy(); chartRefs.current.cat = null; }
                };
            }, [activeTab, analyticsData]);


            const formatProjectReminderDate = (project) => {
                const start = project.startDate || '未設定日期';
                const end = project.endDate && project.endDate !== project.startDate ? project.endDate : '';
                return end ? `${start} → ${end}` : start;
            };

            const toggleHomeRemindersCollapse = () => {
                setIsHomeReminderCollapsed(prev => {
                    const next = !prev;
                    try {
                        if (next) localStorage.setItem('teLifeLogCollapsedReminderDate', getLocalDateString());
                        else localStorage.removeItem('teLifeLogCollapsedReminderDate');
                    } catch (error) {}
                    return next;
                });
            };

            const openProjectFromReminder = (project) => {
                if (!project) return;
                setActiveTab('projects');
                setProjectSubTab(project.completed ? 'completed' : 'active');
                setProjectKeyword('');
                setProjectYearFilter('all');
                setProjectMonthFilter('all');
                setSelectedCalDate(null);
                setExpandedProject(prev => ({ ...prev, [project.id]: true }));
                if (project.startDate) {
                    const parsedDate = new Date(`${project.startDate}T00:00:00`);
                    if (!Number.isNaN(parsedDate.getTime())) setCurrentCalMonth(parsedDate);
                }
                setTimeout(() => {
                    const target = document.getElementById(`project-card-${project.id}`);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 250);
            };

            const renderAttachmentLinks = (links = []) => links.length > 0 ? (
                <div className="flex flex-wrap gap-2 mt-2">
                    {links.map((link, idx) => (
                        <a key={idx} href={link.url} target="_blank" rel="noreferrer" className="bubble-btn btn-outline !px-3 !py-1.5 !text-[13px] border-none shadow-sm bg-white">
                            <Icon name="link" size={14}/> {link.label || '連結'}
                        </a>
                    ))}
                </div>
            ) : null;

            const renderAttachmentImages = (imageUrls = [], imageClass = 'w-20 h-20') => imageUrls.length > 0 ? (
                <div className="flex flex-wrap gap-3 mt-3">
                    {imageUrls.map((img, idx) => (
                        <a key={idx} href={img} target="_blank" rel="noreferrer">
                            <img src={img} className={`${imageClass} object-cover rounded-[12px] shadow-sm border border-gray-100 hover:opacity-80 transition-opacity bg-white`} alt="附件" />
                        </a>
                    ))}
                </div>
            ) : null;

            const renderReminderList = (title, dateText, reminderProjects, iconName, colorClass) => reminderProjects.length > 0 ? (
                <div className="bg-white rounded-[22px] p-4 shadow-sm border border-gray-50">
                    <div className="flex items-center justify-between gap-2 mb-3">
                        <div className="flex items-center gap-2">
                            <span className={`w-9 h-9 rounded-[14px] flex items-center justify-center ${colorClass}`}>
                                <Icon name={iconName} size={18} />
                            </span>
                            <div>
                                <div className="font-black text-[15px] text-slate-700">{title}</div>
                                <div className="font-bold text-[12px] text-slate-400">{dateText}</div>
                            </div>
                        </div>
                        <span className="tag bg-[var(--pastel-gray)] text-gray-600">{reminderProjects.length} 項</span>
                    </div>
                    <div className="space-y-2">
                        {reminderProjects.slice(0, 5).map(p => (
                            <button key={p.id} type="button" onClick={()=>openProjectFromReminder(p)} className="w-full flex items-center gap-2 bg-[#F8FAFC] rounded-[16px] p-3 text-left hover:bg-[var(--bubble-bg)] transition-colors">
                                <Icon name="calendar-days" size={16} className="text-[var(--text-mint)] flex-shrink-0" />
                                <span className="min-w-0 flex-grow font-black text-[14px] text-slate-700 truncate">{p.text}</span>
                                <span className="flex-shrink-0 font-bold text-[11px] text-slate-400 whitespace-nowrap">{formatProjectReminderDate(p)}</span>
                            </button>
                        ))}
                        {reminderProjects.length > 5 && (
                            <div className="text-center font-bold text-[12px] text-slate-400 pt-1">還有 {reminderProjects.length - 5} 項，請到專案頁查看</div>
                        )}
                    </div>
                </div>
            ) : null;

            const renderHomeScheduleReminders = () => {
                const hasReminders = homeScheduleReminders.todayProjects.length > 0 || homeScheduleReminders.tomorrowProjects.length > 0;
                if (!hasReminders) return null;
                const reminderCount = homeScheduleReminders.todayProjects.length + homeScheduleReminders.tomorrowProjects.length;
                return (
                    <div className="bubble-card bg-white/80 p-4 space-y-3 border-2 border-[var(--pastel-yellow)]/40">
                        <button type="button" onClick={toggleHomeRemindersCollapse} className="w-full flex items-center justify-between gap-2 px-1 text-left" title={isHomeReminderCollapsed ? '展開行程提醒' : '收合行程提醒'}>
                            <div className="flex items-center gap-2 min-w-0">
                                <div className="bg-[var(--pastel-yellow)] p-2 rounded-2xl flex-shrink-0"><Icon name="bell" size={20} className="text-[var(--text-yellow)]" /></div>
                                <div className="min-w-0">
                                    <h3 className="font-black text-lg text-[var(--bubble-text)] truncate">行程提醒</h3>
                                    {isHomeReminderCollapsed && <div className="font-bold text-[12px] text-slate-400">今日 / 明日共 {reminderCount} 項</div>}
                                </div>
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0">
                                {!isHomeReminderCollapsed && <span className="tag bg-[var(--pastel-gray)] text-gray-600">{reminderCount} 項</span>}
                                <span className="bg-white text-slate-400 p-2 rounded-full shadow-sm border border-gray-100">
                                    <Icon name={isHomeReminderCollapsed ? "chevron-down" : "chevron-up"} size={16} />
                                </span>
                            </div>
                        </button>
                        {!isHomeReminderCollapsed && (
                            <div className="space-y-3">
                                {renderReminderList('今日行程', homeScheduleReminders.today, homeScheduleReminders.todayProjects, 'calendar-check', 'bg-[var(--pastel-mint)] text-[var(--text-mint)]')}
                                {renderReminderList('明日行程', homeScheduleReminders.tomorrow, homeScheduleReminders.tomorrowProjects, 'calendar-clock', 'bg-[var(--pastel-blue)] text-[var(--text-blue)]')}
                            </div>
                        )}
                    </div>
                );
            };

            const renderDailyView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-blue)] p-2 rounded-2xl"><Icon name="wallet" size={24} className="text-[var(--text-blue)]" /></div>
                        <h1 className="text-2xl font-black tracking-tight text-[var(--bubble-text)]">日常流水帳</h1>
                    </div>

                    {renderHomeScheduleReminders()}
                    
                    <form onSubmit={submitDailyExpense} className="bubble-card p-6 space-y-4 bg-white border-2 border-[var(--pastel-blue)]/30">
                        <div className="grid grid-cols-2 gap-3">
                            <input type="date" value={dailyDate} onChange={handleDailyDateChange} required className="w-full min-w-0 !max-w-full" />
                            <input type="number" inputMode="decimal" pattern="[0-9]*" enterKeyHint="done" placeholder="金額 $" value={dailyAmount} onChange={e=>setDailyAmount(e.target.value)} required className="w-full min-w-0 !max-w-full text-xl text-[var(--text-blue)] font-black" />
                        </div>
                        <select value={dailyProjectId} onChange={e=>setDailyProjectId(e.target.value)} className="w-full min-w-0 !max-w-full">
                            <option value="">無專案</option>
                            {availableProjectsForDailyDate.map(project => <option key={project.id} value={project.id}>{project.text}</option>)}
                        </select>
                        <div className="grid grid-cols-2 gap-3">
                            <select value={dailyItem} onChange={e=>setDailyItem(e.target.value)} required className="w-full min-w-0 !max-w-full">
                                <option value="">選擇分類...</option>
                                {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                            </select>
                            <select value={dailyOwner} onChange={handleDailyOwnerChange} required className="w-full min-w-0 !max-w-full">
                                {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <input type="text" placeholder="寫點備註..." value={dailyDesc} onChange={e=>setDailyDesc(e.target.value)} className="w-full min-w-0 !max-w-full sm:flex-grow" />
                            <div className="flex gap-3 w-full sm:w-auto">
                                <button type="submit" disabled={isProcessing} className="bubble-btn btn-primary flex-1 sm:flex-none px-8 whitespace-nowrap">
                                    {isProcessing ? <Icon name="loader" className="animate-spin" /> : "記一筆"}
                                </button>
                            </div>
                        </div>
                    </form>

                    <div className="bubble-card bg-white/60 p-4">
                        <div className="flex justify-between items-center px-2 mb-4 gap-3">
                            <h3 className="font-bold text-lg text-[var(--bubble-text)]/80 flex items-center gap-2 min-w-0">
                                <Icon name="list" size={18} /> 消費明細
                            </h3>
                            <div className="flex items-center gap-2 shrink-0">
                                <span className="bg-[var(--pastel-yellow)] text-[var(--text-yellow)] px-3 py-1.5 rounded-full text-base font-black shadow-sm whitespace-nowrap">
                                    總計: ${dailyFilteredTotal.toLocaleString()}
                                </span>
                                <button onClick={openDailyQueryPanel} className={`bubble-btn btn-outline !p-1.5 !rounded-xl !border-none shadow-sm bg-white ${hasDailyQuery ? 'text-[var(--text-blue)] bg-[var(--pastel-blue)]/30' : ''}`} title="日常查詢">
                                    <Icon name="search" size={18} />
                                </button>
                                <button onClick={()=>setDailySort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline !p-1.5 !rounded-xl !border-none shadow-sm bg-white" title={dailySort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                                    <Icon name={dailySort === 'desc' ? "arrow-down-wide-narrow" : "arrow-up-wide-narrow"} size={18} />
                                </button>
                            </div>
                        </div>
                        {hasDailyQuery && (
                            <div className="mb-3 mx-2 flex items-center justify-between gap-2 bg-[var(--pastel-blue)]/35 text-[var(--text-blue)] px-3 py-2 rounded-[16px] text-[12px] font-black">
                                <span className="truncate">查詢：{dailyQuerySummary || '已套用'}</span>
                                <button onClick={clearDailyQuery} className="shrink-0 bg-white/80 rounded-full p-1"><Icon name="x" size={14}/></button>
                            </div>
                        )}

                        <div className="space-y-3">
                            {isDailyLoading && <p className="font-bold text-[var(--bubble-text)]/40 p-5 text-center flex items-center justify-center gap-2"><Icon name="loader" size={16} className="animate-spin" /> 讀取中...</p>}
                            {!isDailyLoading && displayDaily.length === 0 && <p className="font-bold text-[var(--bubble-text)]/40 p-5 text-center">{hasDailyQuery ? '找不到符合查詢條件的日常紀錄' : '目前還沒有日常花費紀錄'}</p>}
                            {!isDailyLoading && displayDaily.map(d => (
                                <div key={d.id} className="relative p-4 bg-white rounded-[20px] shadow-sm hover:shadow-md transition-shadow">
                                    <div className="flex items-start gap-3">
                                        <div className="w-11 h-11 shrink-0 rounded-[15px] bg-slate-100/70 flex items-center justify-center text-slate-500"><Icon name="receipt" size={19} /></div>
                                        <div className="min-w-0 flex-1">
                                            {/* 第一列：分類 + 專案名稱 */}
                                            <div className="flex flex-wrap items-center gap-1.5 min-h-[24px] pr-20">
                                                <span className="font-black text-[15px] text-slate-400">{d.item || '未分類'}</span>
                                                {d.projectId && <span className="tag bg-[var(--pastel-mint)]/55 text-blue-800 shadow-sm max-w-full truncate">{getExpenseProjectName(d) || '專案'}</span>}
                                            </div>
                                            {/* 第二列：備註 */}
                                            <div className="font-black text-[17px] leading-[21px] text-slate-700 tracking-wide mt-1.5 break-words">
                                                {d.desc || '無備註'}
                                            </div>
                                            {/* 第三列：日期 + 成員。右側按鈕採絕對定位，不再撐高第三列。 */}
                                            <div className="relative mt-1.5 pr-[70px] min-h-[18px]">
                                                <div className="min-w-0 font-bold text-[13px] leading-[18px] text-slate-500 truncate">{d.date} • {d.owner}</div>
                                                <div className="absolute right-0 top-[-5px] flex items-center gap-1.5">
                                                    <button onClick={()=>setDailyEditData({...d})} className="bg-[var(--pastel-blue)]/30 text-[var(--text-blue)] p-1.5 rounded-xl transition-all active:scale-95 hover:bg-[var(--pastel-blue)]" title="修改"><Icon name="edit-2" size={16} /></button>
                                                    <button onClick={()=>showConfirm('刪除花費', '確定要刪除這筆紀錄嗎？', ()=>db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc(d.id).delete())} className="bg-[var(--pastel-orange)]/30 text-[var(--text-orange)] p-1.5 rounded-xl transition-all active:scale-95 hover:bg-[var(--pastel-orange)]" title="刪除"><Icon name="trash-2" size={16} /></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 金額維持右上角 */}
                                    <span className="absolute right-4 top-4 font-black text-lg text-[var(--bubble-text)] text-right">${parseFloat(d.amount).toLocaleString()}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderProjectsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <div className="flex items-center gap-3">
                            <div className="bg-[var(--pastel-mint)] p-2 rounded-2xl"><Icon name="folder" size={24} className="text-[var(--text-mint)]" /></div>
                            <h1 className="text-2xl font-black tracking-tight">專案資料夾</h1>
                        </div>
                        <button onClick={()=>{resetProjectForm(); setIsProjectFormOpen(true);}} className="bubble-btn btn-mint !px-5"><Icon name="plus" size={18}/> 新增</button>
                    </div>
                    
                    {/* 專案行事曆區塊 */}
                    <div className="bubble-card bg-white p-4">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() - 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-left" size={20}/></button>
                            <h3 className="font-black text-lg text-[var(--bubble-text)]">{currentCalMonth.getFullYear()}年 {currentCalMonth.getMonth() + 1}月</h3>
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() + 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-right" size={20}/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center">
                            {['日', '一', '二', '三', '四', '五', '六'].map(d => <div key={d} className="text-xs font-bold text-[var(--bubble-text)]/50 pb-2">{d}</div>)}
                            {calDays.map((d, i) => (
                                <div key={i} 
                                    onClick={() => { if(d) setSelectedCalDate(selectedCalDate === d.dateStr ? null : d.dateStr); }}
                                    className={`p-1 flex flex-col items-center justify-start min-h-[45px] rounded-xl transition-all cursor-pointer border border-transparent
                                        ${d ? (selectedCalDate === d.dateStr ? 'cal-day-active' : (d.dateStr === getLocalDateString() ? 'cal-day-today hover:brightness-95' : 'bg-gray-50 hover:bg-gray-100 hover:border-gray-200')) : ''}`}>
                                    {d && (
                                        <>
                                            <span className="text-[12px] font-bold">{d.day}</span>
                                            <div className="flex flex-wrap gap-0.5 justify-center mt-1">
                                                {d.projects.map((t, idx) => <span key={idx} className={`w-1.5 h-1.5 rounded-full ${t.completed ? 'bg-[var(--text-blue)]' : 'bg-[#22C55E]'}`}></span>)}
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-center gap-4 mt-3 text-[12px] font-black text-[var(--bubble-text)]/50">
                            <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#22C55E]"></span>進行中</span>
