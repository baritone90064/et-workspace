    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            /* 中性柔和背景 (灰藍) */
            --bubble-bg: #F0F4F8; 
            --bubble-text: #334155; 
            --bubble-card: #FFFFFF;
            
            /* 中性粉嫩色系 */
            --pastel-blue: #A8D8EA;     /* 主色調：寶寶藍 */
            --pastel-mint: #B4F8C8;     /* 輔助色：薄荷綠 */
            --pastel-yellow: #FBE7C6;   /* 點綴色：奶油黃 */
            --pastel-orange: #FFAAA5;   /* 警告色：柔和橘/粉 */
            --pastel-gray: #E2E8F0;     /* 中性灰 */

            /* 文字強調色 */
            --text-blue: #1E3A8A;
            --text-mint: #064E3B;
            --text-yellow: #713F12;
            --text-orange: #7F1D1D;

            /* 陰影設定 */
            --shadow-soft: 0 10px 25px -5px rgba(168, 216, 234, 0.4);
            --shadow-float: 0 15px 30px -5px rgba(168, 216, 234, 0.6);
        }

        html {
            font-size: 15px; /* 取代 body zoom，讓整體比例變小但不破壞 iPhone 寬度計算 */
            -webkit-text-size-adjust: 100%;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bubble-bg);
            color: var(--bubble-text);
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(var(--pastel-blue) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            background-attachment: fixed;
            margin: 0;
            min-width: 0;
            overflow-x: hidden; /* iPhone 防止原生日期欄位把畫面撐出橫向捲軸 */
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 泡泡卡片 */
        .bubble-card {
            background: var(--bubble-card);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
        }
        .bubble-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-float);
        }

        /* 圓潤輸入框：針對 iOS Safari 優化寬度與內距 */
        input, select, textarea {
            background: #F8FAFC !important;
            border: 2px solid #E2E8F0 !important;
            border-radius: 20px !important;
            padding: 12px 16px !important; /* 縮減手機版內距，保留更多打字空間 */
            font-size: 16px !important; 
            font-weight: 600 !important;
            color: var(--bubble-text) !important;
            transition: all 0.2s ease;
            box-sizing: border-box !important; /* 核心防呆：強制將內距算入寬度 */
            max-width: 100% !important; /* 核心防呆：絕不允許超出父層寬度 */
        }
        input:focus, select:focus, textarea:focus {
            outline: none !important;
            background: #FFFFFF !important;
            border-color: var(--pastel-blue) !important;
            box-shadow: 0 0 0 4px rgba(168, 216, 234, 0.3) !important;
        }

        input[type="date"] {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="date"]::-webkit-date-and-time-value {
            min-width: 0;
            text-align: left;
        }

        /* 膠囊按鈕 */
        .bubble-btn {
            border-radius: 9999px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box !important;
            max-width: 100%;
        }
        .bubble-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bubble-btn:not(:disabled):active { transform: scale(0.95); }
        .btn-primary { background: var(--pastel-blue); color: var(--text-blue); box-shadow: 0 4px 15px rgba(168, 216, 234, 0.5); }
        .btn-primary:not(:disabled):hover { background: #93C5FD; }
        .btn-mint { background: var(--pastel-mint); color: var(--text-mint); box-shadow: 0 4px 15px rgba(180, 248, 200, 0.5); }
        .btn-danger { background: var(--pastel-orange); color: var(--text-orange); box-shadow: 0 4px 15px rgba(255, 170, 165, 0.5); }
        .btn-outline { background: white; border: 2px solid #E2E8F0; color: var(--bubble-text); }
        .btn-outline:not(:disabled):hover { background: #F8FAFC; border-color: #CBD5E1; }

        .tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
        }

        .modal-overlay {
            background: rgba(240, 244, 248, 0.8);
            backdrop-filter: blur(8px);
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px; /* 確保手機四周都有安全距離 */
        }

        /* 圓潤打勾方塊 (Checklist 用) */
        .cute-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #CBD5E1;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cute-checkbox.checked { 
            background: var(--pastel-mint); 
            border-color: var(--pastel-mint);
            transform: scale(1.1);
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.04);
        }
        
        /* 行事曆點擊選取特效 */
        .cal-day-active {
            background-color: var(--pastel-blue) !important;
            color: var(--text-blue) !important;
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(168, 216, 234, 0.5);
        }

        .modal-panel {
            width: min(100%, 420px) !important;
            max-width: min(100%, 420px) !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        .modal-panel-wide {
            width: min(100%, 560px) !important;
            max-width: min(100%, 560px) !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        @media (max-width: 480px) {
            html { font-size: 14px; }
            body { background-size: 24px 24px; }
            .bubble-card { border-radius: 24px; }
            input, select, textarea {
                padding: 10px 12px !important;
                font-size: 15px !important;
                border-radius: 16px !important;
            }
            .bubble-btn {
                padding: 10px 16px;
                font-size: 15px;
            }
            .modal-overlay {
                padding: 12px;
                align-items: center;
            }
            .modal-panel, .modal-panel-wide {
                width: calc(100vw - 24px) !important;
                max-width: calc(100vw - 24px) !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .mobile-stack {
                grid-template-columns: minmax(0, 1fr) !important;
            }
            .bottom-nav {
                height: calc(76px + env(safe-area-inset-bottom));
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>

    <script>

    <script type="text/babel" data-presets="classic-react-env">
        // 替換為你的新 Firebase 配置
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { 
                apiKey: "AIzaSyAKDqURlLgG6vQe6m3TsCm_RYIlWBDzaAU",
                authDomain: "accounts-app-10ed2.firebaseapp.com",
                projectId: "accounts-app-10ed2",
                storageBucket: "accounts-app-10ed2.firebasestorage.app",
                messagingSenderId: "811729703619",
                appId: "1:811729703619:web:2cbecc7f107b8058714876"
            };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : "unisex-bubble-app";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage(); // 初始化 Firebase Storage

        const { useState, useEffect, useMemo, useRef } = React;

        const getLocalDateString = () => {
            const now = new Date();
            const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
            return local.toISOString().split('T')[0];
        };

        const getCurrentMonthString = () => getLocalDateString().substring(0, 7);

        const getMonthDateRange = (monthKey) => {
            const [year, month] = monthKey.split('-').map(Number);
            const startDate = new Date(year, month - 1, 1);
            const endDate = new Date(year, month, 1);
            const toLocalISO = (d) => {
                const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
                return local.toISOString().split('T')[0];
            };
            return { start: toLocalISO(startDate), end: toLocalISO(endDate) };
        };

        const getNextDateString = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(`${dateStr}T00:00:00`);
            d.setDate(d.getDate() + 1);
            const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
            return local.toISOString().split('T')[0];
        };

        const generateRecentMonths = (count = 36) => {
            const [year, month] = getCurrentMonthString().split('-').map(Number);
            return Array.from({ length: count }, (_, index) => {
                const d = new Date(year, month - 1 - index, 1);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                return `${yyyy}-${mm}`;
            });
        };

        const getMonthEndDateString = (year, month) => {
            const end = new Date(Number(year), Number(month), 0);
            const yyyy = end.getFullYear();
            const mm = String(end.getMonth() + 1).padStart(2, '0');
            const dd = String(end.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const normalizeProjectDate = (value) => {
            if (!value) return '';
            const text = String(value).trim();
            const ymd = text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
            if (ymd) return `${ymd[1]}-${String(ymd[2]).padStart(2, '0')}-${String(ymd[3]).padStart(2, '0')}`;
            const compact = text.match(/^(\d{4})(\d{2})(\d{2})$/);
            if (compact) return `${compact[1]}-${compact[2]}-${compact[3]}`;
            return text.length >= 10 ? text.substring(0, 10) : text;
        };

        const getProjectDateRange = (project) => {
            const start = normalizeProjectDate(project.startDate || project.endDate);
            const end = normalizeProjectDate(project.endDate || project.startDate);
            if (!start || !end) return null;
            return start <= end ? { start, end } : { start: end, end: start };
        };

        const projectOverlapsDateRange = (project, rangeStart, rangeEnd) => {
            const range = getProjectDateRange(project);
            if (!range) return false;
            return range.start <= rangeEnd && range.end >= rangeStart;
        };

        const projectMatchesYearMonth = (project, yearFilter, monthFilter) => {
            if (yearFilter === 'all' && monthFilter === 'all') return true;
            const range = getProjectDateRange(project);
            if (!range) return false;

            if (yearFilter !== 'all') {
                const rangeStart = monthFilter !== 'all' ? `${yearFilter}-${monthFilter}-01` : `${yearFilter}-01-01`;
                const rangeEnd = monthFilter !== 'all' ? getMonthEndDateString(yearFilter, monthFilter) : `${yearFilter}-12-31`;
                return range.start <= rangeEnd && range.end >= rangeStart;
            }

            if (monthFilter !== 'all') {
                const targetMonth = Number(monthFilter);
                const start = new Date(`${range.start}T00:00:00`);
                const end = new Date(`${range.end}T00:00:00`);
                if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return false;
                const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
                const endCursor = new Date(end.getFullYear(), end.getMonth(), 1);
                while (cursor <= endCursor) {
                    if (cursor.getMonth() + 1 === targetMonth) return true;
                    cursor.setMonth(cursor.getMonth() + 1);
                }
            }
            return false;
        };

        const LAST_DAILY_OWNER_KEY = 'etWorkspaceLastDailyOwner';
        const getSavedDailyOwner = () => {
            try { return localStorage.getItem(LAST_DAILY_OWNER_KEY) || ''; }
            catch (e) { return ''; }
        };
        const saveDailyOwner = (owner) => {
            try { if (owner) localStorage.setItem(LAST_DAILY_OWNER_KEY, owner); }
            catch (e) {}
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const container = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    container.appendChild(i);
                    window.lucide.createIcons({
                        root: container,
                        attrs: { width: size, height: size, class: className, 'stroke-width': 2.5 }
                    });
                    setSvgHtml(container.innerHTML);
                }
            }, [name, size, className]);
            if (!svgHtml) return <span style={{ width: size, height: size, display: 'inline-block' }} className={className} />;
            return <span className="inline-flex shrink-0" dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

        const compressImage = (base64Str, maxWidth = 1024, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [loadedSources, setLoadedSources] = useState({
                daily: false,
                tasks: false,
                categories: false,
                expenseItems: false,
                members: false
            });
            
            // --- Data States ---
            const [dailyExpenses, setDailyExpenses] = useState([]);
            const [analyticsDailyExpenses, setAnalyticsDailyExpenses] = useState([]);
            const [tasks, setTasks] = useState([]); // Projects
            const [categories, setCategories] = useState([]);
            const [expenseItems, setExpenseItems] = useState([]);
            const [members, setMembers] = useState([]);
            
            // --- UI States ---
            const [activeTab, setActiveTab] = useState('daily'); 
            const [projectSubTab, setProjectSubTab] = useState('active'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [isDailyLoading, setIsDailyLoading] = useState(false);
            const [isAnalyticsLoading, setIsAnalyticsLoading] = useState(false);
            const chartRefs = useRef({ trend: null, cat: null });
            
            // --- Filter & Sort States ---
            const [dailySort, setDailySort] = useState('desc'); 
            const [dailyMonthFilter, setDailyMonthFilter] = useState(getCurrentMonthString()); 
            const [projectSort, setProjectSort] = useState('asc'); 
            const [projectKeyword, setProjectKeyword] = useState('');
            const [projectYearFilter, setProjectYearFilter] = useState('all');
            const [projectMonthFilter, setProjectMonthFilter] = useState('all');
            
            // --- Analytics Range & Additional Filters States ---
            const [analyticsStart, setAnalyticsStart] = useState(getMonthDateRange(getCurrentMonthString()).start);
            const [analyticsEnd, setAnalyticsEnd] = useState(getLocalDateString());
            const [analyticsCatFilter, setAnalyticsCatFilter] = useState('all');
            const [analyticsOwnerFilter, setAnalyticsOwnerFilter] = useState('all');
            const [isAnalyticsDateInvalid, setIsAnalyticsDateInvalid] = useState(false);

            // --- Calendar States ---
            const [currentCalMonth, setCurrentCalMonth] = useState(new Date());
            const [selectedCalDate, setSelectedCalDate] = useState(null); 

            // Custom Dialogs
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const [inputDialog, setInputDialog] = useState({ isOpen: false, title: '', value: '', placeholder: '', onConfirm: null });

            // Daily Form
            const [dailyDate, setDailyDate] = useState(getLocalDateString());
            const [dailyAmount, setDailyAmount] = useState('');
            const [dailyItem, setDailyItem] = useState('');
            const [dailyDesc, setDailyDesc] = useState('');
            const [dailyOwner, setDailyOwner] = useState(() => getSavedDailyOwner());
            
            // Daily Edit Modal State (取代跳至頂部的設計)
            const [dailyEditData, setDailyEditData] = useState(null);

            // Project Form
            const [isProjectFormOpen, setIsProjectFormOpen] = useState(false);
            const [projectEditingId, setProjectEditingId] = useState(null);
            const [taskText, setTaskText] = useState('');
            const [owners, setOwners] = useState([]);
            const [category, setCategory] = useState('');
            const [note, setNote] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [links, setLinks] = useState([]);
            const [images, setImages] = useState([]); 
            const [isUploadingImage, setIsUploadingImage] = useState(false);

            const isProjectDateInvalid = startDate && endDate && endDate < startDate;

            // Project Detail
            const [expandedProject, setExpandedProject] = useState({});
            const [expenseModalTask, setExpenseModalTask] = useState(null);
            
            // Project Single Expense
            const [projExpDate, setProjExpDate] = useState(getLocalDateString());
            const [projExpAmount, setProjExpAmount] = useState('');
            const [projExpItem, setProjExpItem] = useState('');
            const [projExpDesc, setProjExpDesc] = useState('');
            const [projExpEditingIdx, setProjExpEditingIdx] = useState(null);
            
            // Project Checklist State 
            const [newChecklistText, setNewChecklistText] = useState({});

            // 日常記帳成員選項：保留原本單一成員，同時提供 Terry;Eric 共同記帳選項
            const dailyOwnerOptions = useMemo(() => {
                const names = members.map(m => m.name).filter(Boolean);
                const comboOwner = 'Terry;Eric';
                const hasTerry = names.includes('Terry');
                const hasEric = names.includes('Eric');
                return hasTerry && hasEric && !names.includes(comboOwner) ? [...names, comboOwner] : names;
            }, [members]);

            const markSourceLoaded = (key) => {
                setLoadedSources(prev => prev[key] ? prev : ({ ...prev, [key]: true }));
            };

            const handleDailyOwnerChange = (e) => {
                const owner = e.target.value;
                setDailyOwner(owner);
                saveDailyOwner(owner);
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                        else await auth.signInAnonymously();
                    } catch (err) {
                        console.error('登入失敗:', err);
                        setIsInitialLoading(false);
                    }
                };
                initAuth();
                return auth.onAuthStateChanged(setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                setIsInitialLoading(true);
                setLoadedSources({ daily: false, tasks: false, categories: false, expenseItems: false, members: false });

                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const sortConfig = (a, b) => {
                    const orderDiff = (a.order ?? 0) - (b.order ?? 0);
                    if (orderDiff !== 0) return orderDiff;
                    return a.id.localeCompare(b.id);
                };

                // 專案資料目前仍保留即時監聽：專案筆數通常遠少於日常流水帳，且行事曆/進行中/已結束需要即時同步。
                const unsubTasks = path.collection('tasks').onSnapshot(
                    snap => {
                        setTasks(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        markSourceLoaded('tasks');
                    },
                    err => { console.error('讀取專案資料失敗:', err); markSourceLoaded('tasks'); }
                );
                
                const unsubCats = path.collection('categories').onSnapshot(
                    snap => {

            const parseCSVContent = (content) => {
                const rows = [];
                let row = [];
                let current = '';
                let inQuotes = false;
                const text = String(content || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const next = text[i + 1];

                    if (char === '"' && inQuotes && next === '"') {
                        current += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else if (char === '\n' && !inQuotes) {
                        row.push(current.trim());
                        if (row.some(cell => cell !== '')) rows.push(row);
                        row = [];
                        current = '';
                    } else {
                        current += char;
                    }
                }

                row.push(current.trim());
                if (row.some(cell => cell !== '')) rows.push(row);
                return rows;
            };

                return row.some(cell => headerWords.includes(normalizeHeader(cell)));
            };

            const normalizeDateValue = (value) => {
                let text = String(value || '').trim().replace(/^\uFEFF/, '');
                if (!text) return '';

                text = text.replace(/[年月.]/g, '/').replace(/日/g, '').split(' ')[0].trim();

                if (/^\d{8}$/.test(text)) {
                    text = `${text.substring(0, 4)}/${text.substring(4, 6)}/${text.substring(6, 8)}`;
                }

                const serialText = text.replace(/,/g, '');
                if (/^\d+(\.\d+)?$/.test(serialText)) {
                    const serial = Number(serialText);
                    if (serial > 20000 && serial < 80000) {
                        const utcValue = Math.round((serial - 25569) * 86400 * 1000);
                        const date = new Date(utcValue);
                        if (!Number.isNaN(date.getTime())) return date.toISOString().slice(0, 10);
                    }
                }

                const match = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
                if (!match) return '';

                const year = Number(match[1]);
                const month = Number(match[2]);
                const day = Number(match[3]);
                const date = new Date(year, month - 1, day);

                if (
                    date.getFullYear() !== year ||
                    date.getMonth() !== month - 1 ||
                    date.getDate() !== day
                ) return '';

                return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            };

                    .replace(/，/g, '')
                    .replace(/NTD/ig, '')
                    .replace(/TWD/ig, '')
                    .replace(/NT\$/ig, '')
                    .replace(/[＄$元]/g, '');

                const negativeMatch = text.match(/^\((.+)\)$/);

                return { isValid: Number.isFinite(number), value: number };

                            }
                        };

                        for (let i = 0; i < dataRows.length; i++) {
                            const row = dataRows[i];
                            const lineNo = hasHeader ? i + 2 : i + 1;
                            const date = normalizeDateValue(getCell(row, idx.date));
                            const amountResult = normalizeAmountValue(getCell(row, idx.amount));
                            const item = getCell(row, idx.item);
                            const desc = getCell(row, idx.desc);
                            const owner = normalizeOwnerText(getCell(row, idx.owner));

                            if (!date || !amountResult.isValid || !item) {
                                skipped++;
                                if (skippedReasons.length < 5) {
                                    const reason = !date ? '日期格式錯誤' : (!amountResult.isValid ? '金額不是數字' : '費用分類空白');
                                    skippedReasons.push(`第 ${lineNo} 列：${reason}`);
                                }
                                continue;
                            }

                            const ref = refBase.doc();
                            batch.set(ref, {
                                date,
                                amount: amountResult.value,
                                item,
                                desc: desc || '',
                                owner: owner || '',
                                createdAt: now,
                                updatedAt: now
                            });
                            batchOps++;
                            count++;
                            importedMonths.add(date.substring(0, 7));
                            await commitIfNeeded();
                        }

                        await commitIfNeeded(true);

                        if (count > 0) {
                            const latestMonth = Array.from(importedMonths).sort().reverse()[0];
                            if (latestMonth && dailyMonthFilter !== 'all') setDailyMonthFilter(latestMonth);
                        }

                        const detail = skippedReasons.length ? `\n\n略過原因範例：\n${skippedReasons.join('\n')}` : '';
                        alert(`日常記帳匯入完成！\n成功：${count} 筆\n略過：${skipped} 筆${detail}`);
                    } catch (error) {
                        console.error('日常記帳匯入失敗:', error);
                        alert(`日常記帳匯入失敗：${error.message || '請確認 CSV 欄位包含日期、金額、費用分類、備註、成員'}`);
                    }
                    setIsProcessing(false);
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleImportProjectCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const rows = parseCSVContent(ev.target.result);
                        if (rows.length === 0) throw new Error('CSV 沒有資料');

                        const hasHeader = looksLikeHeaderRow(rows[0]);
                        const headers = hasHeader ? rows[0] : [];
                        const dataRows = hasHeader ? rows.slice(1) : rows;
                        const idx = getProjectImportIndexes(headers, hasHeader);

                        if (idx.text < 0) throw new Error('找不到必要欄位：專案名稱');

                        const projectMap = new Map();
                        const skippedReasons = [];
                        const now = new Date().toISOString();
                        let skippedRows = 0;
                        let skippedExpenses = 0;

                        for (let i = 0; i < dataRows.length; i++) {
                            const row = dataRows[i];
                            const lineNo = hasHeader ? i + 2 : i + 1;
                            const text = getCell(row, idx.text);
                            if (!text) {
                                skippedRows++;
                                if (skippedReasons.length < 5) skippedReasons.push(`第 ${lineNo} 列：專案名稱空白`);
                                continue;
                            }

                            const projectCategory = getCell(row, idx.category);
                            const projectOwnersRaw = getCell(row, idx.owners);
                            const startRaw = getCell(row, idx.startDate);
                            const endRaw = getCell(row, idx.endDate);
                            const projectStartDate = startRaw ? normalizeDateValue(startRaw) : '';
                            const projectEndDate = endRaw ? normalizeDateValue(endRaw) : '';
                            const projectNote = getCell(row, idx.note);

                            if (startRaw && !projectStartDate && skippedReasons.length < 5) skippedReasons.push(`第 ${lineNo} 列：起始日期格式錯誤，已留空`);
                            if (endRaw && !projectEndDate && skippedReasons.length < 5) skippedReasons.push(`第 ${lineNo} 列：結束日期格式錯誤，已留空`);

                            const key = [text, projectCategory || '', projectOwnersRaw || '', projectStartDate || '', projectEndDate || '', projectNote || ''].join('||');
                            if (!projectMap.has(key)) {
                                projectMap.set(key, {
                                    text,
                                    category: projectCategory || '',
                                    owners: splitOwners(projectOwnersRaw),
                                    startDate: projectStartDate || '',
                                    endDate: projectEndDate || '',
                                    note: projectNote || '',
                                    images: [],
                                    links: [],
                                    expenses: [],
                                    checklist: [],
                                    completed: false,
                                    createdAt: now,
                                    updatedAt: now
                                });
                            }

                            const expDateRaw = getCell(row, idx.expDate);
                            const expAmountRaw = getCell(row, idx.expAmount);
                            const expItem = getCell(row, idx.expItem);
                            const expDesc = getCell(row, idx.expDesc);
                            const hasExpenseData = expDateRaw || expAmountRaw || expItem || expDesc;

                            if (hasExpenseData) {
                                const expDate = expDateRaw ? normalizeDateValue(expDateRaw) : '';
                                const amountResult = normalizeAmountValue(expAmountRaw);

                                if ((expDateRaw && !expDate) || (expAmountRaw && !amountResult.isValid)) {
                                    skippedExpenses++;
                                    if (skippedReasons.length < 5) {
                                        const reason = expDateRaw && !expDate ? '專案費用日期格式錯誤' : '專案費用金額不是數字';
                                        skippedReasons.push(`第 ${lineNo} 列：${reason}`);
                                    }
                                    continue;
                                }

                                projectMap.get(key).expenses.push({
                                    date: expDate || '',
                                    amount: amountResult.isValid ? amountResult.value : 0,
                                    item: expItem || '',
                                    desc: expDesc || ''
                                });
                            }
                        }

                        const projects = Array.from(projectMap.values());
                        if (projects.length === 0) throw new Error('沒有可匯入的專案資料');

                        const refBase = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks');
                        let batch = db.batch();
                        let batchOps = 0;
                        for (const project of projects) {
                            const ref = refBase.doc();
                            batch.set(ref, project);
                            batchOps++;
                            if (batchOps >= 450) {
                                await batch.commit();
                                batch = db.batch();
                                batchOps = 0;
                            }
                        }
                        if (batchOps > 0) await batch.commit();

                        const detail = skippedReasons.length ? `\n\n略過/修正原因範例：\n${skippedReasons.join('\n')}` : '';
                        alert(`專案匯入完成！\n成功：${projects.length} 個專案\n略過列數：${skippedRows} 列\n略過費用：${skippedExpenses} 筆${detail}`);
                    } catch (error) {
                        console.error('專案匯入失敗:', error);
                        alert(`專案匯入失敗：${error.message || '請確認 CSV 欄位包含專案名稱與相關欄位'}`);
                    }
                    setIsProcessing(false);
                    e.target.value = '';
                };
                reader.readAsText(file);
            };


            // --- 計算與顯示處理 ---
            const availableDailyMonths = useMemo(() => generateRecentMonths(36), []);

            const displayDaily = useMemo(() => {
                let filtered = [...dailyExpenses];
                if (dailyMonthFilter !== 'all') filtered = filtered.filter(d => (d.date || '').startsWith(dailyMonthFilter));
                filtered.sort((a, b) => {
                    const dateA = a.date || ''; const dateB = b.date || '';
                    return dailySort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [dailyExpenses, dailyMonthFilter, dailySort]);

            const dailyFilteredTotal = useMemo(() => {
                return displayDaily.reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
            }, [displayDaily]);

            const availableProjectYears = useMemo(() => {
                const years = new Set();
                tasks.forEach(t => {
                    const range = getProjectDateRange(t);
                    if (!range) return;
                    const startYear = Number(range.start.substring(0, 4));
                    const endYear = Number(range.end.substring(0, 4));
                    if (Number.isNaN(startYear) || Number.isNaN(endYear)) return;
                    for (let y = startYear; y <= endYear; y++) years.add(y);
                });
                return Array.from(years).sort((a, b) => b - a);
            }, [tasks]);

            const hasProjectFilters = projectKeyword.trim() || projectYearFilter !== 'all' || projectMonthFilter !== 'all' || selectedCalDate;

            const displayProjects = useMemo(() => {
                let filtered = tasks.filter(t => projectSubTab === 'active' ? !t.completed : t.completed);

                if (projectYearFilter !== 'all' || projectMonthFilter !== 'all') {
                    filtered = filtered.filter(t => projectMatchesYearMonth(t, projectYearFilter, projectMonthFilter));
                }

                if (selectedCalDate) {
                    filtered = filtered.filter(t => {
                        if (!t.startDate && !t.endDate) return false;
                        return projectOverlapsDateRange(t, selectedCalDate, selectedCalDate);
                    });
                }

                const keyword = projectKeyword.trim().toLowerCase();
                if (keyword) {
                    filtered = filtered.filter(t => {
                        const ownersText = (t.owners || []).join(' ');
                        const linksText = (t.links || []).map(l => `${l.label || ''} ${l.url || ''}`).join(' ');
                        const checklistText = (t.checklist || []).map(item => item.text || '').join(' ');
                        const expenseText = (t.expenses || []).map(e => `${e.date || ''} ${e.amount || ''} ${e.item || ''} ${e.desc || ''}`).join(' ');
                        const searchableText = [
                            t.text,
                            t.category,
                            ownersText,
                            t.note,
                            t.startDate,
                            t.endDate,
                            linksText,
                            checklistText,
                            expenseText
                        ].filter(Boolean).join(' ').toLowerCase();
                        return searchableText.includes(keyword);
                    });
                }

                filtered.sort((a, b) => {
                    const dateA = a.startDate || a.createdAt || ''; const dateB = b.startDate || b.createdAt || '';
                    return projectSort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [tasks, projectSubTab, projectSort, selectedCalDate, projectKeyword, projectYearFilter, projectMonthFilter]);
            
            const calDays = useMemo(() => {
                const year = currentCalMonth.getFullYear();
                const month = currentCalMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayTasks = tasks.filter(t => projectOverlapsDateRange(t, dateStr, dateStr));
                    days.push({ day: i, dateStr, tasks: dayTasks });
                }
                return days;
            }, [currentCalMonth, tasks]);

            const analyticsData = useMemo(() => {
                const ownerMap = {}; let totalExpense = 0; const trendMap = {}; const catMap = {};
                
                analyticsDailyExpenses.forEach(d => {
                    if (analyticsStart && d.date < analyticsStart) return;
                    if (analyticsEnd && d.date > analyticsEnd) return;
                    if (analyticsCatFilter !== 'all' && d.item !== analyticsCatFilter) return;
                    if (analyticsOwnerFilter !== 'all' && d.owner !== analyticsOwnerFilter) return;

                    const amt = parseFloat(d.amount) || 0; 
                    totalExpense += amt;
                    ownerMap[d.owner] = (ownerMap[d.owner] || 0) + amt;
                    catMap[d.item] = (catMap[d.item] || 0) + amt;
                    const monthKey = d.date ? d.date.substring(0, 7) : 'Unknown';
                    trendMap[monthKey] = (trendMap[monthKey] || 0) + amt;
                });
                
                tasks.forEach(t => {
                    const currentOwners = t.owners && t.owners.length > 0 ? t.owners : (t.owner ? [t.owner] : []);
                    
                    if (analyticsOwnerFilter !== 'all' && !currentOwners.includes(analyticsOwnerFilter)) return;

                    (t.expenses || []).forEach(e => {
                        if (analyticsStart && e.date < analyticsStart) return;
                        if (analyticsEnd && e.date > analyticsEnd) return;
                        if (analyticsCatFilter !== 'all' && e.item !== analyticsCatFilter) return;
                        
                        const amt = parseFloat(e.amount) || 0;
                        const splitAmount = currentOwners.length > 0 ? amt / currentOwners.length : amt;
                        const targetAmount = analyticsOwnerFilter !== 'all' ? splitAmount : amt;

                        totalExpense += targetAmount;
                        catMap[e.item] = (catMap[e.item] || 0) + targetAmount;
                        const monthKey = e.date ? e.date.substring(0, 7) : 'Unknown';
                        trendMap[monthKey] = (trendMap[monthKey] || 0) + targetAmount;

                        if (analyticsOwnerFilter !== 'all') {
                            ownerMap[analyticsOwnerFilter] = (ownerMap[analyticsOwnerFilter] || 0) + splitAmount;
                        } else {
                            currentOwners.forEach(o => { ownerMap[o] = (ownerMap[o] || 0) + splitAmount; });
                        }
                    });
                });
                
                return { sortedOwners: Object.entries(ownerMap).sort((a,b)=>b[1]-a[1]), totalExpense, trendKeys: Object.keys(trendMap).sort(), trendMap, catMap };
            }, [analyticsDailyExpenses, tasks, analyticsStart, analyticsEnd, analyticsCatFilter, analyticsOwnerFilter]);

            useEffect(() => {
                if (activeTab !== 'analytics') return;
                const timer = setTimeout(() => {
                    if (chartRefs.current.trend) chartRefs.current.trend.destroy();
                    if (chartRefs.current.cat) chartRefs.current.cat.destroy();

                    const trendCtx = document.getElementById('trendChart')?.getContext('2d');
                    if (trendCtx) {
                        chartRefs.current.trend = new Chart(trendCtx, {
                            type: 'bar',
                            data: { labels: analyticsData.trendKeys, datasets: [{ data: analyticsData.trendKeys.map(k => analyticsData.trendMap[k]), backgroundColor: '#A8D8EA', borderRadius: 8, borderWidth: 0 }] },
                            options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { borderDash: [4,4] } } } }
                        });
                    }

                    const catCtx = document.getElementById('catChart')?.getContext('2d');
                    if (catCtx && Object.keys(analyticsData.catMap).length > 0) {
                        const bgColors = ['#A8D8EA', '#B4F8C8', '#FBE7C6', '#FFAAA5', '#E2E8F0', '#FFD3B6', '#D4A5A5', '#A2E1DB', '#EAD8F7'];
                        chartRefs.current.cat = new Chart(catCtx, {
                            type: 'doughnut',
                            data: { 
                                labels: Object.keys(analyticsData.catMap), 
                                datasets: [{ 
                                    data: Object.values(analyticsData.catMap), 
                                    backgroundColor: bgColors, 
                                    borderWidth: 0 
                                }] 
                            },
                            options: { plugins: { legend: { position: 'right' } }, maintainAspectRatio: false }
                        });
                    }
                }, 100);
                return () => clearTimeout(timer);
            }, [activeTab, analyticsData]);


            const renderDailyView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-blue)] p-2 rounded-2xl"><Icon name="wallet" size={24} className="text-[var(--text-blue)]" /></div>
                        <h1 className="text-2xl font-black tracking-tight text-[var(--bubble-text)]">日常流水帳</h1>
                    </div>
                    
                    <form onSubmit={submitDailyExpense} className="bubble-card p-6 space-y-4 bg-white border-2 border-[var(--pastel-blue)]/30">
                        <div className="grid grid-cols-2 gap-3">
                            <input type="date" value={dailyDate} onChange={e=>setDailyDate(e.target.value)} required className="w-full min-w-0 !max-w-full" />
                            <input type="number" placeholder="金額 $" value={dailyAmount} onChange={e=>setDailyAmount(e.target.value)} required className="w-full min-w-0 !max-w-full text-xl text-[var(--text-blue)] font-black" />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <select value={dailyItem} onChange={e=>setDailyItem(e.target.value)} required className="w-full min-w-0 !max-w-full">
                                <option value="">選擇分類...</option>
                                {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                            </select>
                            <select value={dailyOwner} onChange={handleDailyOwnerChange} required className="w-full min-w-0 !max-w-full">
                                {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <input type="text" placeholder="寫點備註..." value={dailyDesc} onChange={e=>setDailyDesc(e.target.value)} className="w-full min-w-0 !max-w-full sm:flex-grow" />
                            <div className="flex gap-3 w-full sm:w-auto">
                                <button type="submit" disabled={isProcessing} className="bubble-btn btn-primary flex-1 sm:flex-none px-8 whitespace-nowrap">
                                    {isProcessing ? <Icon name="loader" className="animate-spin" /> : "記一筆"}
                                </button>
                            </div>
                        </div>
                    </form>

                    <div className="bubble-card bg-white/60 p-4">
                        <div className="flex justify-between items-start px-2 mb-4">
                            <h3 className="font-bold text-lg text-[var(--bubble-text)]/80 flex items-center gap-2 mt-1">
                                <Icon name="list" size={18} /> 消費明細
                            </h3>
                            <div className="flex flex-col items-end gap-2">
                                <div className="flex gap-2">
                                    <select value={dailyMonthFilter} onChange={e=>setDailyMonthFilter(e.target.value)} className="!py-1.5 !px-3 !text-sm !rounded-xl !bg-white shadow-sm border-none font-bold">
                                        <option value="all">所有月份（讀全部）</option>
                                        {availableDailyMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                    <button onClick={()=>setDailySort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline !p-1.5 !rounded-xl !border-none shadow-sm bg-white" title={dailySort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                                        <Icon name={dailySort === 'desc' ? "sort-desc" : "sort-asc"} size={18} />
                                    </button>
                                </div>
                                <span className="bg-[var(--pastel-yellow)] text-[var(--text-yellow)] px-3 py-1.5 rounded-full text-sm font-black shadow-sm">
                                    總計: ${dailyFilteredTotal.toLocaleString()}
                                </span>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {isDailyLoading && <p className="font-bold text-[var(--bubble-text)]/40 p-5 text-center flex items-center justify-center gap-2"><Icon name="loader" size={16} className="animate-spin" /> 讀取中...</p>}
                            {!isDailyLoading && displayDaily.length === 0 && <p className="font-bold text-[var(--bubble-text)]/40 p-5 text-center">這個月份還沒有花費喔！</p>}
                            {!isDailyLoading && displayDaily.map(d => (
                                <div key={d.id} className="p-4 flex justify-between items-center bg-white rounded-[20px] shadow-sm hover:shadow-md transition-shadow group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-[16px] bg-slate-100/70 flex items-center justify-center text-slate-500"><Icon name="receipt" size={20} /></div>
                                        <div>
                                            <div className="font-black text-[17px] text-slate-700 tracking-wide">
                                                {d.desc || '無備註'} <span className="ml-2 font-bold text-[15px] text-slate-400">{d.item}</span>
                                            </div>
                                            <div className="font-bold text-[13px] text-slate-500 mt-0.5">{d.date} • {d.owner}</div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 ml-auto pl-2">
                                        <div className="flex gap-1 sm:opacity-0 group-hover:opacity-100 transition-opacity order-2 sm:order-1">
                                            {/* 改為開啟彈窗 (Modal) 來編輯，不再需要畫面捲動回上方 */}
                                            <button onClick={()=>setDailyEditData({...d})} className="bg-[var(--pastel-blue)]/30 text-[var(--text-blue)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-blue)]"><Icon name="edit-2" size={16} /></button>
                                            <button onClick={()=>showConfirm('刪除花費', '確定要刪除這筆紀錄嗎？', ()=>db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc(d.id).delete())} className="bg-[var(--pastel-orange)]/30 text-[var(--text-orange)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-orange)]"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                        {/* 明細清單右邊數字調小： text-xl 改為 text-lg */}
                                        <span className="font-black text-lg text-[var(--bubble-text)] text-right order-1 sm:order-2">${parseFloat(d.amount).toLocaleString()}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderProjectsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <div className="flex items-center gap-3">
                            <div className="bg-[var(--pastel-mint)] p-2 rounded-2xl"><Icon name="folder" size={24} className="text-[var(--text-mint)]" /></div>
                            <h1 className="text-2xl font-black tracking-tight">專案資料夾</h1>
                        </div>
                        <button onClick={()=>{resetProjectForm(); setIsProjectFormOpen(true);}} className="bubble-btn btn-mint !px-5"><Icon name="plus" size={18}/> 新增</button>
                    </div>
                    
                    {/* 專案行事曆區塊 */}
                    <div className="bubble-card bg-white p-4">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() - 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-left" size={20}/></button>
                            <h3 className="font-black text-lg text-[var(--bubble-text)]">{currentCalMonth.getFullYear()}年 {currentCalMonth.getMonth() + 1}月</h3>
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() + 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-right" size={20}/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center">
                            {['日', '一', '二', '三', '四', '五', '六'].map(d => <div key={d} className="text-xs font-bold text-[var(--bubble-text)]/50 pb-2">{d}</div>)}
                            {calDays.map((d, i) => (
                                <div key={i} 
                                    onClick={() => { if(d) setSelectedCalDate(selectedCalDate === d.dateStr ? null : d.dateStr); }}
                                    className={`p-1 flex flex-col items-center justify-start min-h-[45px] rounded-xl transition-all cursor-pointer border border-transparent
                                        ${d ? (selectedCalDate === d.dateStr ? 'cal-day-active' : 'bg-gray-50 hover:bg-gray-100 hover:border-gray-200') : ''}`}>
                                    {d && (
                                        <>
                                            <span className="text-[12px] font-bold">{d.day}</span>
                                            <div className="flex flex-wrap gap-0.5 justify-center mt-1">
                                                {d.tasks.map((t, idx) => <span key={idx} className={`w-1.5 h-1.5 rounded-full ${t.completed ? 'bg-[var(--text-blue)]' : 'bg-[#22C55E]'}`}></span>)}
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-center gap-4 mt-3 text-[12px] font-black text-[var(--bubble-text)]/50">
                            <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#22C55E]"></span>進行中</span>
                            <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[var(--text-blue)]"></span>已結束</span>
                        </div>
                        {selectedCalDate && (
                            <div className="mt-3 text-center animate-in zoom-in-95">
                                <span className="tag bg-[var(--pastel-blue)] text-[var(--text-blue)] shadow-sm">
                                    篩選日期: {selectedCalDate} <button onClick={()=>setSelectedCalDate(null)} className="ml-1 font-black">✕</button>
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="flex justify-between items-center mx-2 gap-2">
                        <div className="flex gap-2 bg-white p-1.5 rounded-[20px] shadow-sm flex-grow">
                            <button onClick={()=>switchProjectSubTab('active')} className={`flex-1 py-2 font-black rounded-[15px] transition-all ${projectSubTab==='active' ? 'bg-[var(--pastel-mint)] text-[var(--text-mint)]' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>進行中</button>
                            <button onClick={()=>switchProjectSubTab('completed')} className={`flex-1 py-2 font-black rounded-[15px] transition-all ${projectSubTab==='completed' ? 'bg-[var(--pastel-gray)] text-gray-700' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>已結束</button>
                        </div>
                        <button onClick={()=>setProjectSort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline bg-white !p-3 shadow-sm border-none h-full" title={projectSort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                            <Icon name={projectSort === 'desc' ? "sort-desc" : "sort-asc"} size={20} />
                        </button>
                    </div>

                    <div className="bubble-card bg-white p-3 mx-2">
                        <div className="flex items-center gap-2">
                            <Icon name="search" size={18} className="text-[var(--bubble-text)]/40" />
                            <input
                                type="text"
                                value={projectKeyword}
                                onChange={e=>setProjectKeyword(e.target.value)}
                                placeholder="搜尋專案名稱、類別、成員、備註、費用..."
                                className="flex-grow min-w-0 !max-w-full !py-2 !px-3 !text-sm"
                            />
                            {projectKeyword && (
                                <button onClick={()=>setProjectKeyword('')} className="bg-gray-100 text-gray-500 p-2 rounded-xl transition-all hover:bg-gray-200" title="清除搜尋"><Icon name="x" size={16}/></button>
                            )}
                        </div>
                        <div className="grid grid-cols-[1fr_1fr_auto] gap-2 mt-3">
                            <select value={projectYearFilter} onChange={e=>handleProjectYearChange(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                <option value="all">年份</option>
                                {availableProjectYears.map(y => <option key={y} value={String(y)}>{y}</option>)}
                            </select>
                            <select value={projectMonthFilter} onChange={e=>handleProjectMonthChange(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                <option value="all">月份</option>
                                {Array.from({ length: 12 }, (_, i) => {
                                    const mm = String(i + 1).padStart(2, '0');
                                    return <option key={mm} value={mm}>{i + 1}月</option>;
                                })}
                            </select>
                            <button
                                onClick={clearProjectFilters}
                                disabled={!hasProjectFilters}
                                className="bubble-btn btn-outline bg-white !p-3 shadow-sm border-none h-full"
                                title="清除篩選"
                            >
                                <Icon name="rotate-ccw" size={18} />
                            </button>
                        </div>
                        {hasProjectFilters && (
                            <div className="mt-2 px-2 text-[12px] font-bold text-[var(--bubble-text)]/45">
                                篩選結果：{displayProjects.length} 個專案
                            </div>
                        )}
                    </div>

                    <div className="space-y-4">
                        {displayProjects.length === 0 && <p className="text-center font-bold text-[var(--bubble-text)]/40 py-10">{hasProjectFilters ? '找不到符合篩選的專案' : '尚無專案'}</p>}
                        {displayProjects.map(t => {
                            const isExpanded = expandedProject[t.id];
                            const total = calculateTaskTotal(t);
                            const currentOwners = t.owners && t.owners.length > 0 ? t.owners : [];
                            const checklists = t.checklist || [];
                            
                            return (
                                <div key={t.id} className={`bubble-card overflow-hidden ${t.completed ? 'opacity-70 bg-gray-50' : 'bg-white'}`}>
                                    <div className="p-6 cursor-pointer hover:bg-[var(--bubble-bg)]/50 flex items-start gap-4 transition-colors" onClick={()=>setExpandedProject({...expandedProject, [t.id]: !isExpanded})}>
                                        <div className="mt-1"><Icon name={isExpanded ? "folder-open" : "folder"} size={26} className="text-[var(--pastel-blue)]" /></div>
                                        <div className="flex-grow">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-black text-xl leading-tight text-[var(--bubble-text)]">{t.text}</h3>
                                                {total > 0 && <span className="font-black text-lg bg-[var(--pastel-yellow)] px-3 py-1 rounded-[12px] text-[var(--text-yellow)]">${total.toLocaleString()}</span>}
                                            </div>
                                            <div className="flex flex-wrap gap-2 mt-3">
                                                <span className="tag bg-[var(--pastel-gray)] text-gray-700 shadow-sm">{t.category}</span>
                                                {currentOwners.map(o => <span key={o} className="tag bg-[#F8FAFC] text-[var(--bubble-text)] border border-gray-100">{o}</span>)}
                                            </div>
                                            {(t.startDate || t.endDate) && <div className="font-bold text-[13px] text-[var(--bubble-text)]/50 mt-3 flex items-center gap-1.5"><Icon name="calendar" size={14}/> {t.startDate} {t.endDate && `→ ${t.endDate}`}</div>}
                                        </div>
                                    </div>
                                    
                                    {isExpanded && (
                                        <div className="p-6 border-t-2 border-gray-50 bg-white/50">
                                            <div className="flex flex-wrap gap-2 mb-6">
                                                {!t.completed && <button onClick={()=>openExpenseModal(t)} className="bubble-btn btn-primary !px-4 !py-2 !text-sm"><Icon name="dollar-sign" size={16}/> 記一筆</button>}
                                                <button onClick={()=>openProjectEdit(t)} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm"><Icon name="edit" size={16}/> 編輯</button>
                                                <button onClick={()=>toggleProjectCompleted(t)} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm">{t.completed ? "重新開啟" : "標示為已結束"}</button>
                                                <button onClick={()=>showConfirm('刪除專案', '確定刪除此專案與所有明細嗎？', async () => await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(t.id).delete())} className="bubble-btn btn-danger !px-4 !py-2 !text-sm ml-auto"><Icon name="trash" size={16}/></button>
                                            </div>
                                            
                                            {/* Checklist 區塊 */}
                                            <div className="mb-6 bg-white p-5 rounded-[24px] shadow-sm border border-[var(--pastel-mint)]/40">
                                                <h4 className="font-black text-[14px] text-[var(--text-mint)] flex items-center gap-2 mb-4"><Icon name="check-circle" size={18}/> 任務清單</h4>
                                                <div className="space-y-3 mb-4">
                                                    {checklists.map(item => (
                                                        <div key={item.id} className={`flex items-start gap-3 group transition-all ${item.completed ? 'opacity-50' : ''}`}>
                                                            <div onClick={()=>toggleChecklistItem(t.id, item.id)} className={`cute-checkbox flex-shrink-0 mt-0.5 ${item.completed ? 'checked' : ''}`}>
                                                                {item.completed && <Icon name="check" size={16} className="text-[var(--text-mint)]" />}
                                                            </div>
                                                            <div className="flex-grow pt-0.5 cursor-pointer" onClick={()=>toggleChecklistItem(t.id, item.id)}>
                                                                <span className={`font-bold text-[15px] ${item.completed ? 'line-through' : ''}`}>{item.text}</span>
                                                            </div>
                                                            <button onClick={()=>editChecklistItem(t.id, item.id, item.text)} className="opacity-0 group-hover:opacity-100 text-[var(--text-blue)] hover:bg-[var(--pastel-blue)]/20 p-1.5 rounded-lg transition-all" title="修改項目"><Icon name="edit-2" size={16}/></button>
                                                            <button onClick={()=>deleteChecklistItem(t.id, item.id)} className="opacity-0 group-hover:opacity-100 text-[var(--pastel-orange)] hover:bg-[var(--pastel-orange)]/10 p-1.5 rounded-lg transition-all" title="刪除項目"><Icon name="trash-2" size={16}/></button>
                                                        </div>
                                                    ))}
                                                    {checklists.length === 0 && <div className="text-sm font-bold text-gray-400">目前沒有清單項目，在下方新增吧！</div>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="新增準備事項、裝備清單..." value={newChecklistText[t.id] || ''} onChange={e=>setNewChecklistText({...newChecklistText, [t.id]: e.target.value})} onKeyDown={e=>{if(e.key==='Enter') addChecklistItem(t.id);}} className="flex-grow min-w-0 !max-w-full !py-2 !px-4 !text-sm !bg-gray-50 border-none" />
                                                    <button onClick={()=>addChecklistItem(t.id)} className="bubble-btn btn-mint !py-2 !px-4 shadow-none"><Icon name="plus" size={18}/></button>
                                                </div>
                                            </div>

                                            {t.note && <div className="font-bold text-[15px] text-[var(--bubble-text)]/80 whitespace-pre-line bg-[#F8FAFC] p-5 rounded-[20px] mb-4 leading-relaxed">{t.note}</div>}
                                            
                                            {t.links && t.links.length > 0 && (
                                                <div className="mb-4 flex flex-wrap gap-2">
                                                    {t.links.map((l, i) => (
                                                        <a key={i} href={l.url} target="_blank" className="bubble-btn btn-outline !px-3 !py-1.5 !text-[13px] hover:bg-[var(--pastel-blue)] hover:text-[var(--text-blue)] border-none shadow-sm"><Icon name="link" size={14}/> {l.label || "連結"}</a>
                                                    ))}
                                                </div>
                                            )}

                                            {t.images && t.images.length > 0 && (
                                                <div className="mb-4 flex flex-wrap gap-3">
                                                    {t.images.map((img, idx) => (
                                                        <a key={idx} href={img} target="_blank" rel="noreferrer">
                                                            <img src={img} className="w-24 h-24 object-cover rounded-[16px] shadow-sm border border-gray-100 hover:opacity-80 transition-opacity" alt="附件" />
                                                        </a>
                                                    ))}
                                                </div>
                                            )}

                                            {t.expenses && t.expenses.length > 0 && (
                                                <div className="mt-5">
                                                    <h4 className="font-black text-[13px] text-[var(--bubble-text)]/50 uppercase tracking-wider mb-2 ml-1">專案費用明細</h4>
                                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden border border-gray-50 divide-y divide-gray-50">
                                                        {t.expenses.map((e, idx) => (
                                                            <div key={idx} className="flex justify-between items-center p-4 hover:bg-gray-50 group">
                                                                <div>
                                                                    <div className="font-black text-[15px] text-slate-700">{e.desc || '無備註'} <span className="ml-2 font-bold text-[13px] text-slate-400">{e.item}</span></div>
                                                                    <div className="font-bold text-[12px] text-[var(--bubble-text)]/40 mt-1">{e.date}</div>
                                                                </div>
                                                                <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 ml-auto pl-2">
                                                                    <div className="flex gap-1 sm:opacity-0 group-hover:opacity-100 transition-opacity order-2 sm:order-1">
                                                                        <button onClick={()=>openExpenseModal(t, idx)} className="bg-[var(--pastel-blue)]/30 text-[var(--text-blue)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-blue)]"><Icon name="edit-2" size={16} /></button>
                                                                        <button onClick={()=>showConfirm('刪除明細', '確定要刪除這筆專案費用嗎？', async () => {
                                                                            const updated = [...t.expenses]; updated.splice(idx, 1);
                                                                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(t.id).update({expenses: updated});
                                                                        })} className="bg-[var(--pastel-orange)]/30 text-[var(--text-orange)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-orange)]"><Icon name="trash-2" size={16}/></button>
                                                                    </div>
                                                                    <span className="font-black text-lg text-[var(--bubble-text)] text-right order-1 sm:order-2">${parseFloat(e.amount).toLocaleString()}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderAnalyticsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-yellow)] p-2 rounded-2xl"><Icon name="pie-chart" size={24} className="text-[var(--text-yellow)]" /></div>
                        <h1 className="text-2xl font-black tracking-tight">統計分析</h1>
                    </div>
                    
                    {/* 篩選區間與條件設定 */}
                    <div className="bubble-card p-5 bg-white">
                        <h3 className="font-bold text-sm text-[var(--bubble-text)]/60 mb-3">資料篩選設定</h3>
                        <div className="flex items-center gap-1">
                            <input type="date" value={analyticsStart} onChange={e=>setAnalyticsStart(e.target.value)} className="flex-1 min-w-0 !max-w-full !bg-white !px-1 sm:!px-1.5 !py-2 !text-[11px] sm:text-sm text-center" />
                            <span className="font-black text-gray-300 shrink-0 mx-0.5">→</span>
                            <input type="date" value={analyticsEnd} onChange={e=>setAnalyticsEnd(e.target.value)} className="flex-1 min-w-0 !max-w-full !bg-white !px-1 sm:!px-1.5 !py-2 !text-[11px] sm:text-sm text-center" />
                        </div>
                        {isAnalyticsDateInvalid && <div className="text-[var(--text-orange)] text-xs font-bold mt-2">截止日期不能早於起始日期！</div>}
                        
                        <div className="flex items-center gap-2 mt-3">
                            <select value={analyticsCatFilter} onChange={e=>setAnalyticsCatFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                <option value="all">所有費用分類</option>
                                {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                            </select>
                            <select value={analyticsOwnerFilter} onChange={e=>setAnalyticsOwnerFilter(e.target.value)} className="w-full min-w-0 !max-w-full !py-2 !px-3 !text-sm">
                                <option value="all">所有成員</option>
                                {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                        </div>
                    </div>

                    {isAnalyticsLoading && (
                        <div className="bubble-card p-4 bg-white text-center font-bold text-[var(--bubble-text)]/50 flex items-center justify-center gap-2">
                            <Icon name="loader" size={18} className="animate-spin" /> 統計資料讀取中...
                        </div>
                    )}

                    <div className="bubble-card p-8 text-center bg-white border-2 border-[var(--pastel-yellow)]/40">
                        <p className="font-bold text-[15px] text-[var(--bubble-text)]/60 mb-2">總計花費</p>
                        <p className="text-3xl font-black tracking-tighter text-[var(--text-yellow)] drop-shadow-sm">${analyticsData.totalExpense.toLocaleString()}</p>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="pie-chart" size={20}/> 項目佔比</h3>
                        {Object.keys(analyticsData.catMap).length > 0 ? (
                            <div className="h-56"><canvas id="catChart"></canvas></div>
                        ) : (
                            <div className="text-center font-bold text-gray-400 py-10">此區間無費用資料</div>
                        )}
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="bar-chart-2" size={20}/> 月度趨勢</h3>
                        <div className="h-48"><canvas id="trendChart"></canvas></div>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="users" size={20}/> 成員分攤</h3>
                        <div className="space-y-5">
                            {analyticsData.sortedOwners.length === 0 && <div className="text-center font-bold text-gray-400 py-4">無成員資料</div>}
                            {analyticsData.sortedOwners.map(([name, value]) => {
                                const percentage = analyticsData.totalExpense ? ((value / analyticsData.totalExpense) * 100).toFixed(1) : 0;
                                return (
                                    <div key={name}>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="font-black text-[16px]">{name}</span>
