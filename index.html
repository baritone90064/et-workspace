                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">詳細備註</label>
                                        <textarea className="w-full min-w-0 !max-w-full min-h-[100px] !bg-gray-50" placeholder="寫些什麼..." value={note} onChange={e=>setNote(e.target.value)}></textarea>
                                    </div>
                                </div>
                                <div className="p-5 border-t-2 border-gray-50 bg-white">
                                    <button onClick={submitProject} disabled={isProcessing || isProjectDateInvalid || isUploadingImage} className="bubble-btn btn-primary w-full py-4 text-lg">
                                        {isProcessing || isUploadingImage ? "處理中..." : "儲存專案"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 專案費用已統一使用日常記帳表單，不再保留第二套專案費用 Modal。 */}

                    {/* 任務清單附件管理 Modal */}
                    {checklistAttachmentModal && (
                        <div className="modal-overlay" onClick={() => closeChecklistAttachmentModal(true)}>
                            <div className="bubble-card bg-white w-full max-w-lg modal-panel-wide flex flex-col h-[82vh] animate-in zoom-in-95 duration-200 overflow-hidden mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 border-b-2 border-gray-50 flex justify-between items-start gap-3 bg-[var(--pastel-mint)]/30">
                                    <div className="min-w-0">
                                        <h3 className="font-black text-lg text-[var(--text-mint)] flex items-center gap-2"><Icon name="paperclip" size={18}/> 任務附件</h3>
                                        <div className="font-bold text-[12px] text-[var(--bubble-text)]/50 mt-1 truncate">{checklistAttachmentModal.projectText}</div>
                                        <div className="font-black text-sm text-[var(--bubble-text)] mt-1 break-words">{checklistAttachmentModal.itemText}</div>
                                    </div>
                                    <button onClick={() => closeChecklistAttachmentModal(true)} className="p-1.5 bg-white rounded-full text-gray-500 hover:bg-gray-100 flex-shrink-0"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="flex-grow overflow-y-auto no-scrollbar p-5 space-y-5 bg-[var(--bubble-bg)]/35">
                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60 flex items-center gap-2"><Icon name="link" size={16}/> 連結</label>
                                            <button type="button" onClick={addChecklistAttachmentLink} className="bubble-btn bg-gray-50 text-gray-600 !py-1 !px-3 !text-xs shadow-none"><Icon name="plus" size={14}/> 新增連結</button>
                                        </div>
                                        <div className="space-y-3">
                                            {checklistAttachmentLinks.length === 0 && <div className="text-sm font-bold text-gray-400 p-4 text-center border-2 border-dashed border-gray-200 rounded-[14px]">尚未新增連結</div>}
                                            {checklistAttachmentLinks.map((li, i) => (
                                                <div key={i} className="flex flex-col sm:flex-row gap-2 bg-gray-50 p-3 rounded-[16px]">
                                                    <input className="w-full sm:w-1/3 min-w-0 !max-w-full text-sm !bg-white" placeholder="標籤，例如：訂房、地圖" value={li.label} onChange={e => updateChecklistAttachmentLink(i, 'label', e.target.value)} />
                                                    <input className="flex-grow min-w-0 !max-w-full text-sm w-full !bg-white" placeholder="網址 (https://...)" value={li.url} onChange={e => updateChecklistAttachmentLink(i, 'url', e.target.value)} />
                                                    <button type="button" onClick={() => deleteChecklistAttachmentLink(i)} className="p-2 text-[var(--pastel-orange)] bg-white rounded-xl shadow-sm self-end sm:self-auto"><Icon name="trash-2" size={18}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60 flex items-center gap-2"><Icon name="image" size={16}/> 圖片</label>
                                            <button type="button" disabled={isUploadingChecklistImage} onClick={() => document.getElementById('checklist-image-upload').click()} className="bubble-btn btn-outline !py-1 !px-3 !text-xs shadow-none"><Icon name="upload" size={14}/> {isUploadingChecklistImage ? '上傳中...' : '上傳圖片'}</button>
                                            <input id="checklist-image-upload" type="file" accept="image/*" multiple onChange={handleChecklistImageUpload} className="hidden" />
                                        </div>
                                        <div className="space-y-3" onPaste={handleChecklistImagePaste}>
                                            {checklistAttachmentImages.length === 0 && !isUploadingChecklistImage && <div className="text-sm font-bold text-gray-400 p-4 text-center border-2 border-dashed border-gray-200 rounded-[14px]">可一次選多張圖片，或在此 Ctrl+V 貼上截圖</div>}
                                            {isUploadingChecklistImage && (
                                                <div className="text-sm font-bold text-[var(--text-blue)] p-4 text-center flex items-center justify-center gap-2">
                                                    <Icon name="loader" size={18} className="animate-spin" /> 圖片上傳中，請稍候...
                                                </div>
                                            )}
                                            {checklistAttachmentImages.length > 0 && (
                                                <div className="flex flex-wrap gap-3 p-2 bg-gray-50 rounded-[16px]">
                                                    {checklistAttachmentImages.map((img, i) => (
                                                        <div key={i} className="relative group">
                                                            <a href={img} target="_blank" rel="noreferrer">
                                                                <img src={img} className="w-20 h-20 object-cover rounded-[12px] shadow-sm border border-gray-200 bg-white" alt="任務附件預覽" />
                                                            </a>
                                                            <button type="button" onClick={() => deleteChecklistAttachmentImage(i)} className="absolute -top-2 -right-2 p-1.5 text-white bg-rose-500 rounded-full shadow-md"><Icon name="x" size={12}/></button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-5 border-t-2 border-gray-50 bg-white flex gap-3">
                                    <button onClick={() => closeChecklistAttachmentModal(true)} className="bubble-btn btn-outline flex-1 py-3">取消</button>
                                    <button onClick={saveChecklistAttachments} disabled={isProcessing || isUploadingChecklistImage} className="bubble-btn btn-mint flex-1 py-3">{isProcessing || isUploadingChecklistImage ? '處理中...' : '儲存附件'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 底部導覽列 */}
                    <nav className="fixed bottom-0 left-0 right-0 bottom-nav h-[85px] flex justify-center z-40 px-4">
                        <div className="max-w-md w-full grid grid-cols-4 gap-1 text-center pt-2">
                            <button onClick={()=>setActiveTab('daily')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='daily'?'bg-[var(--pastel-blue)] text-[var(--text-blue)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="wallet" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='daily'?'text-[var(--text-blue)]':'text-gray-400'}`}>日常</span>
                            </button>
                            <button onClick={()=>setActiveTab('projects')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='projects'?'bg-[var(--pastel-mint)] text-[var(--text-mint)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="folder" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='projects'?'text-[var(--text-mint)]':'text-gray-400'}`}>專案</span>
                            </button>
                            <button onClick={()=>setActiveTab('analytics')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='analytics'?'bg-[var(--pastel-yellow)] text-[var(--text-yellow)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="pie-chart" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='analytics'?'text-[var(--text-yellow)]':'text-gray-400'}`}>統計</span>
                            </button>
                            <button onClick={()=>setActiveTab('settings')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='settings'?'bg-[var(--pastel-gray)] text-gray-700 shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="settings" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='settings'?'text-gray-700':'text-gray-400'}`}>設定</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
