                                            <span className="font-bold text-sm text-[var(--bubble-text)]/60">${value.toLocaleString()} ({percentage}%)</span>
                                        </div>
                                        <div className="w-full bg-[#F1F3F5] rounded-full h-3 overflow-hidden">
                                            <div className="bg-[var(--pastel-blue)] h-full rounded-full transition-all duration-1000" style={{width: `${percentage}%`}}></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // 修改 Settings 裡排序的賦值方式，避免刪除又新增後出現同一個 order 的問題
            const renderSettingsList = (title, collection, items) => (
                <div className="mb-8">
                    <div className="flex justify-between items-center px-2 mb-4">
                        <h3 className="font-black text-xl">{title}</h3>
                        <button onClick={()=>showInput(`新增${title}`, '', '請輸入名稱...', async (newName) => {
                            const list = collection === 'members' ? members : collection === 'categories' ? categories : expenseItems;
                            // 改為尋找目前最大的 order 值加一，而不是用陣列長度，避免刪除後發生重複 order
                            const nextOrder = list.length > 0 ? Math.max(...list.map(l => l.order || 0)) + 1 : 0;
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).add({ name: newName, order: nextOrder, createdAt: new Date().toISOString() });
                        })} className="bubble-btn btn-primary !py-1.5 !px-4 !text-[13px]"><Icon name="plus" size={16}/> 新增</button>
                    </div>
                    <div className="bubble-card bg-white overflow-hidden divide-y divide-gray-50 p-0">
                        {items.length === 0 && <div className="p-6 text-center font-bold text-gray-400">無資料</div>}
                        {items.map(item => (
                            <div key={item.id} className="flex justify-between items-center p-4 hover:bg-[var(--bubble-bg)]/30 transition-colors">
                                <span className="font-black text-[16px]">{item.name}</span>
                                <div className="flex gap-2">
                                    <button onClick={()=>showInput(`編輯名稱`, item.name, '輸入新名稱', async (newName) => {
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).update({ name: newName });
                                    })} className="p-2 rounded-xl text-[var(--text-blue)] bg-[var(--pastel-blue)]/20 hover:bg-[var(--pastel-blue)] transition-all"><Icon name="edit-2" size={18}/></button>
                                    <button onClick={()=>showConfirm('確認刪除', `確定要刪除「${item.name}」嗎？`, async () => {
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).delete();
                                    })} className="p-2 rounded-xl text-[var(--text-orange)] bg-[var(--pastel-orange)]/20 hover:bg-[var(--pastel-orange)] transition-all"><Icon name="trash-2" size={18}/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32 pt-8 px-4 sm:px-6">
                    <header className="mb-6 px-2 text-center">
                        <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-emerald-950 drop-shadow-sm flex justify-center items-center gap-3">
                            <Icon name="sparkles" size={28} className="text-amber-500" /> T&E LifeLog
                        </h1>
                    </header>
                    <main>
                        {activeTab === 'daily' && renderDailyView()}
                        {activeTab === 'projects' && renderProjectsView()}
                        {activeTab === 'analytics' && renderAnalyticsView()}
                        {activeTab === 'settings' && (
                            <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-4">
                                <div className="flex items-center gap-3 px-2 mb-6">
                                    <div className="bg-[var(--pastel-gray)] p-2 rounded-2xl"><Icon name="settings" size={24} className="text-gray-700" /></div>
                                    <h1 className="text-2xl font-black tracking-tight">設定管理</h1>
                                </div>
                                {renderSettingsList("參與成員", "members", members)}
                                {renderSettingsList("專案類別", "categories", categories)}
                                {renderSettingsList("費用分類", "expenseItems", expenseItems)}
                                
                                <div className="mb-8 pt-4">
                                    <h3 className="font-black text-xl px-2 mb-4">資料備份與匯入</h3>
                                    <div className="bubble-card bg-white p-5 space-y-4">
                                        <p className="text-xs font-bold text-gray-500 mb-2 leading-relaxed">日常記帳欄位「日期、金額、費用分類、備註、成員」<br/>專案欄位「專案名稱、專案類別、參與成員、起始日期、結束日期、專案備註、專案費用日期、專案費用金額、專案費用分類、專案費用備註」</p>
                                        <div className="bg-[var(--bubble-bg)]/70 rounded-[20px] p-4 space-y-3">
                                            <div className="font-black text-sm text-[var(--text-blue)] flex items-center gap-2"><Icon name="wallet" size={16}/> 日常記帳 CSV</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={handleExportDailyCSV} className="bubble-btn btn-outline !text-sm"><Icon name="download" size={16}/> 匯出目前日常</button>
                                                <button onClick={() => document.getElementById('daily-csv-upload').click()} className="bubble-btn btn-outline !text-sm"><Icon name="upload" size={16}/> 匯入日常</button>
                                                <input id="daily-csv-upload" type="file" accept=".csv" onChange={handleImportDailyCSV} className="hidden" />
                                            </div>
                                        </div>
                                        <div className="bg-[var(--bubble-bg)]/70 rounded-[20px] p-4 space-y-3">
                                            <div className="font-black text-sm text-[var(--text-mint)] flex items-center gap-2"><Icon name="folder" size={16}/> 專案資料 CSV</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={handleExportProjectCSV} className="bubble-btn btn-outline !text-sm"><Icon name="download" size={16}/> 匯出專案</button>
                                                <button onClick={() => document.getElementById('project-csv-upload').click()} className="bubble-btn btn-outline !text-sm"><Icon name="upload" size={16}/> 匯入專案</button>
                                                <input id="project-csv-upload" type="file" accept=".csv" onChange={handleImportProjectCSV} className="hidden" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {isInitialLoading && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-[var(--bubble-bg)]/85 backdrop-blur-sm px-6">
                            <div className="bubble-card bg-white p-6 modal-panel text-center shadow-2xl">
                                <div className="w-14 h-14 mx-auto mb-4 rounded-full bg-[var(--pastel-blue)]/40 flex items-center justify-center">
                                    <Icon name="loader" size={28} className="animate-spin text-[var(--text-blue)]" />
                                </div>
                                <div className="font-black text-lg text-[var(--bubble-text)]">資料載入中</div>
                                <div className="font-bold text-sm text-[var(--bubble-text)]/50 mt-1">正在同步本月記帳與專案資料...</div>
                            </div>
                        </div>
                    )}

                    {/* 客製化 Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="modal-overlay">
                            <div className="bubble-card bg-white p-6 w-full max-w-sm modal-panel animate-in zoom-in-95 duration-200 shadow-2xl mx-4">
                                <h3 className="font-black text-2xl mb-2 text-[var(--text-orange)]">{confirmDialog.title}</h3>
                                <p className="font-bold text-[var(--bubble-text)]/70 mb-6">{confirmDialog.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={()=>setConfirmDialog({isOpen:false})} className="bubble-btn btn-outline flex-1 py-3">取消</button>
                                    <button onClick={()=>{confirmDialog.onConfirm(); setConfirmDialog({isOpen:false});}} className="bubble-btn btn-danger flex-1 py-3">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 客製化 Input Dialog */}
                    {inputDialog.isOpen && (
                        <div className="modal-overlay">
                            <div className="bubble-card bg-[var(--pastel-blue)] p-6 w-full max-w-sm modal-panel animate-in zoom-in-95 duration-200 shadow-2xl border-none mx-4">
                                <h3 className="font-black text-2xl mb-4 text-[var(--text-blue)] drop-shadow-sm">{inputDialog.title}</h3>
                                <input className="w-full min-w-0 !max-w-full mb-6 !border-none !bg-white" value={inputDialog.value} onChange={e=>setInputDialog({...inputDialog, value: e.target.value})} placeholder={inputDialog.placeholder} autoFocus />
                                <div className="flex gap-3">
                                    <button onClick={()=>setInputDialog({isOpen:false})} className="bubble-btn bg-white/40 text-[var(--text-blue)] flex-1 py-3 hover:bg-white/60">取消</button>
                                    <button onClick={()=>{ if(inputDialog.value.trim()){ inputDialog.onConfirm(inputDialog.value.trim()); setInputDialog({isOpen:false}); } }} className="bubble-btn bg-white text-[var(--text-blue)] flex-1 py-3 shadow-lg">確認儲存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 日常修改 Modal (新加入，讓使用者編輯時不會失去原有位置) */}
                    {dailyEditData && (
                        <div className="modal-overlay" onClick={() => setDailyEditData(null)}>
                            <div className="bubble-card bg-white w-full max-w-sm modal-panel overflow-hidden animate-in zoom-in-95 duration-200 mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 border-b-2 border-gray-50 flex justify-between items-center bg-[var(--pastel-blue)]/30">
                                    <h3 className="font-black text-lg text-[var(--text-blue)]">編輯日常流水帳</h3>
                                    <button onClick={() => setDailyEditData(null)} className="p-1.5 bg-white rounded-full text-gray-500 hover:bg-gray-100"><Icon name="x" size={18}/></button>
                                </div>
                                <form onSubmit={submitDailyEdit} className="p-5 sm:p-6 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mobile-stack">
                                        <input type="date" value={dailyEditData.date} onChange={e=>setDailyEditData({...dailyEditData, date: e.target.value})} required className="w-full min-w-0 !max-w-full" />
                                        <input type="number" placeholder="金額 $" value={dailyEditData.amount} onChange={e=>setDailyEditData({...dailyEditData, amount: e.target.value})} required className="w-full min-w-0 !max-w-full font-black text-xl text-[var(--text-blue)]" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mobile-stack">
                                        <select value={dailyEditData.item} onChange={e=>setDailyEditData({...dailyEditData, item: e.target.value})} required className="w-full min-w-0 !max-w-full">
                                            <option value="">選擇分類...</option>
                                            {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                                        </select>
                                        <select value={dailyEditData.owner} onChange={e=>setDailyEditData({...dailyEditData, owner: e.target.value})} required className="w-full min-w-0 !max-w-full">
                                            {dailyOwnerOptions.map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <input placeholder="備註 (選填)..." value={dailyEditData.desc} onChange={e=>setDailyEditData({...dailyEditData, desc: e.target.value})} className="w-full min-w-0 !max-w-full" />
                                    <button type="submit" disabled={isProcessing} className="bubble-btn btn-primary w-full py-3 mt-4">儲存修改</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 專案新增/編輯 Modal */}
                    {isProjectFormOpen && (
                        <div className="modal-overlay" onClick={() => setIsProjectFormOpen(false)}>
                            <div className="bubble-card bg-white w-full max-w-lg modal-panel-wide flex flex-col h-[85vh] animate-in zoom-in-95 duration-200 overflow-hidden mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-5 border-b-2 border-gray-50 flex justify-between items-center bg-white z-10">
                                    <h3 className="font-black text-2xl text-[var(--bubble-text)]">{projectEditingId ? "編輯專案" : "建立新專案"}</h3>
                                    <button onClick={() => setIsProjectFormOpen(false)} className="p-2 bg-gray-50 rounded-full text-gray-500 hover:bg-gray-100"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="p-4 sm:p-6 overflow-y-auto space-y-6 flex-grow bg-[#F8FAFC]/50">
                                    <div>
                                        <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">專案名稱</label>
                                        <input className="w-full min-w-0 !max-w-full text-xl !bg-white" placeholder="輸入名稱..." value={taskText} onChange={e=>setTaskText(e.target.value)} />
                                    </div>
                                    
                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100 space-y-4">
                                        <div>
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">參與成員</label>
                                            <div className="flex flex-wrap gap-2">
                                                {members.map(m => (
                                                    <button key={m.id} type="button" onClick={() => {
                                                        if(owners.includes(m.name)) setOwners(owners.filter(o=>o!==m.name));
                                                        else setOwners([...owners, m.name]);
                                                    }} className={`px-4 py-2 text-sm font-bold rounded-[14px] transition-colors ${owners.includes(m.name) ? 'bg-[var(--pastel-blue)] text-[var(--text-blue)]' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}>
                                                        {m.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">類別</label>
                                            <select className="w-full min-w-0 !max-w-full !bg-white" value={category} onChange={e=>setCategory(e.target.value)}>
                                                {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="pt-2">
                                            <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">專案日期區間</label>
                                            <div className="flex items-center gap-1">
                                                <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="flex-1 min-w-0 !max-w-full !bg-white !px-1.5 !py-2 !text-xs tracking-tighter sm:text-sm text-center" />
                                                <span className="font-black text-gray-300 shrink-0 mx-0.5">→</span>
                                                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="flex-1 min-w-0 !max-w-full !bg-white !px-1.5 !py-2 !text-xs tracking-tighter sm:text-sm text-center" />
                                            </div>
                                            {isProjectDateInvalid && <div className="text-[var(--text-orange)] text-sm font-bold mt-2">結束日期不能早於起始日期！</div>}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60">相關連結</label>
                                            <button type="button" onClick={() => setLinks([...links, {label:'', url:''}])} className="bubble-btn bg-gray-50 text-gray-600 !py-1 !px-3 !text-xs shadow-none"><Icon name="plus" size={14}/> 新增</button>
                                        </div>
                                        <div className="space-y-3">
                                            {links.map((li, i) => (
                                                <div key={i} className="flex gap-2">
                                                    <input className="w-1/3 min-w-0 !max-w-full text-sm !bg-gray-50" placeholder="標籤" value={li.label} onChange={e => { const n = [...links]; n[i].label = e.target.value; setLinks(n); }} />
                                                    <input className="flex-grow min-w-0 !max-w-full text-sm w-full !bg-gray-50" placeholder="網址 (https://...)" value={li.url} onChange={e => { const n = [...links]; n[i].url = e.target.value; setLinks(n); }} />
                                                    <button type="button" onClick={() => setLinks(links.filter((_, idx) => idx !== i))} className="p-2 text-[var(--pastel-orange)] bg-white rounded-xl shadow-sm"><Icon name="trash-2" size={18}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="font-black text-sm text-[var(--bubble-text)]/60">圖片附件</label>
                                            <button type="button" disabled={isUploadingImage} onClick={() => document.getElementById('image-upload').click()} className="bubble-btn btn-outline !py-1 !px-3 !text-xs shadow-none"><Icon name="upload" size={14}/> {isUploadingImage ? "上傳中..." : "上傳多張圖片"}</button>
                                            <input id="image-upload" type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" />
                                        </div>
                                        <div className="space-y-3" onPaste={handlePaste}>
                                            {images.length === 0 && !isUploadingImage && <div className="text-sm font-bold text-gray-400 p-4 text-center border-2 border-dashed border-gray-200 rounded-[14px]">點擊上方按鈕可一次選多張，或在此 Ctrl+V 貼上圖片截圖</div>}
                                            
                                            {isUploadingImage && (
                                                <div className="text-sm font-bold text-[var(--text-blue)] p-4 text-center flex items-center justify-center gap-2">
                                                    <Icon name="loader" size={18} className="animate-spin" /> 圖片上傳中，請稍候...
                                                </div>
                                            )}

                                            {images.length > 0 && (
                                                <div className="flex flex-wrap gap-3 p-2 bg-gray-50 rounded-[16px]">
                                                    {images.map((img, i) => (
                                                        <div key={i} className="relative group">
                                                            <img src={img} className="w-20 h-20 object-cover rounded-[12px] shadow-sm border border-gray-200 bg-white" alt="預覽" />
                                                            <button type="button" onClick={() => setImages(images.filter((_, idx) => idx !== i))} className="absolute -top-2 -right-2 p-1.5 text-white bg-rose-500 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={12}/></button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-[24px] shadow-sm border border-gray-100">
                                        <label className="font-black mb-2 block text-sm text-[var(--bubble-text)]/60">詳細備註</label>
                                        <textarea className="w-full min-w-0 !max-w-full min-h-[100px] !bg-gray-50" placeholder="寫些什麼..." value={note} onChange={e=>setNote(e.target.value)}></textarea>
                                    </div>
                                </div>
                                <div className="p-5 border-t-2 border-gray-50 bg-white">
                                    <button onClick={submitProject} disabled={isProcessing || isProjectDateInvalid || isUploadingImage} className="bubble-btn btn-primary w-full py-4 text-lg">
                                        {isProcessing || isUploadingImage ? "處理中..." : "儲存專案"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 專案記單筆花費 Modal (降一列垂直排列解決手機板破圖) */}
                    {expenseModalTask && (
                        <div className="modal-overlay" onClick={() => setExpenseModalTask(null)}>
                            <div className="bubble-card bg-white w-full max-w-sm modal-panel overflow-hidden animate-in zoom-in-95 duration-200 mx-4" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 border-b-2 border-gray-50 flex justify-between items-center bg-[var(--pastel-mint)]/30">
                                    <h3 className="font-black text-lg text-[var(--text-mint)]">{projExpEditingIdx !== null ? '編輯專案費用' : '記一筆專案費用'}</h3>
                                    <button onClick={() => setExpenseModalTask(null)} className="p-1.5 bg-white rounded-full text-gray-500 hover:bg-gray-100"><Icon name="x" size={18}/></button>
                                </div>
                                <form onSubmit={submitProjectExpense} className="p-5 sm:p-6 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mobile-stack">
                                        <input type="date" value={projExpDate} onChange={e=>setProjExpDate(e.target.value)} required className="w-full min-w-0 !max-w-full" />
                                        <input type="number" placeholder="金額 $" value={projExpAmount} onChange={e=>setProjExpAmount(e.target.value)} required className="w-full min-w-0 !max-w-full font-black text-xl text-[var(--text-mint)]" />
                                    </div>
                                    <select className="w-full min-w-0 !max-w-full" value={projExpItem} onChange={e=>setProjExpItem(e.target.value)} required>
                                        <option value="">選擇分類...</option>
                                        {expenseItems.map(opt => <option key={opt.id} value={opt.name}>{opt.name}</option>)}
                                        <option value="其他">其他</option>
                                    </select>
                                    <input placeholder="備註 (選填)..." value={projExpDesc} onChange={e=>setProjExpDesc(e.target.value)} className="w-full min-w-0 !max-w-full" />
                                    <button type="submit" disabled={isProcessing} className="bubble-btn btn-mint w-full py-3 mt-4">{projExpEditingIdx !== null ? '儲存修改' : '加入明細'}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 底部導覽列 */}
                    <nav className="fixed bottom-0 left-0 right-0 bottom-nav h-[85px] flex justify-center z-40 px-4">
                        <div className="max-w-md w-full grid grid-cols-4 gap-1 text-center pt-2">
                            <button onClick={()=>setActiveTab('daily')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='daily'?'bg-[var(--pastel-blue)] text-[var(--text-blue)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="wallet" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='daily'?'text-[var(--text-blue)]':'text-gray-400'}`}>日常</span>
                            </button>
                            <button onClick={()=>setActiveTab('projects')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='projects'?'bg-[var(--pastel-mint)] text-[var(--text-mint)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="folder" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='projects'?'text-[var(--text-mint)]':'text-gray-400'}`}>專案</span>
                            </button>
                            <button onClick={()=>setActiveTab('analytics')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='analytics'?'bg-[var(--pastel-yellow)] text-[var(--text-yellow)] shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="pie-chart" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='analytics'?'text-[var(--text-yellow)]':'text-gray-400'}`}>統計</span>
                            </button>
                            <button onClick={()=>setActiveTab('settings')} className="flex flex-col items-center gap-0.5 group">
                                <div className={`p-1.5 rounded-[14px] transition-all ${activeTab==='settings'?'bg-[var(--pastel-gray)] text-gray-700 shadow-sm':'text-gray-400 group-hover:bg-gray-100'}`}><Icon name="settings" size={22} /></div>
                                <span className={`text-[11px] font-black ${activeTab==='settings'?'text-gray-700':'text-gray-400'}`}>設定</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
