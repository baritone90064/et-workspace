<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E&T Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- 新增 Storage SDK 用來處理圖片上傳 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            /* 中性柔和背景 (灰藍) */
            --bubble-bg: #F0F4F8; 
            --bubble-text: #334155; 
            --bubble-card: #FFFFFF;
            
            /* 中性粉嫩色系 */
            --pastel-blue: #A8D8EA;     /* 主色調：寶寶藍 */
            --pastel-mint: #B4F8C8;     /* 輔助色：薄荷綠 */
            --pastel-yellow: #FBE7C6;   /* 點綴色：奶油黃 */
            --pastel-orange: #FFAAA5;   /* 警告色：柔和橘/粉 */
            --pastel-gray: #E2E8F0;     /* 中性灰 */

            /* 文字強調色 */
            --text-blue: #1E3A8A;
            --text-mint: #064E3B;
            --text-yellow: #713F12;
            --text-orange: #7F1D1D;

            /* 陰影設定 */
            --shadow-soft: 0 10px 25px -5px rgba(168, 216, 234, 0.4);
            --shadow-float: 0 15px 30px -5px rgba(168, 216, 234, 0.6);
        }

        body { 
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: var(--bubble-bg);
            color: var(--bubble-text);
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(var(--pastel-blue) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            background-attachment: fixed;
            zoom: 0.90; /* 將畫面整體縮小為 90% */
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        /* 泡泡卡片 */
        .bubble-card {
            background: var(--bubble-card);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
        }
        .bubble-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-float);
        }

        /* 圓潤輸入框 */
        input, select, textarea {
            background: #F8FAFC !important;
            border: 2px solid #E2E8F0 !important;
            border-radius: 20px !important;
            padding: 14px 20px !important;
            font-size: 16px !important; 
            font-weight: 600 !important;
            color: var(--bubble-text) !important;
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none !important;
            background: #FFFFFF !important;
            border-color: var(--pastel-blue) !important;
            box-shadow: 0 0 0 4px rgba(168, 216, 234, 0.3) !important;
        }

        /* 膠囊按鈕 */
        .bubble-btn {
            border-radius: 9999px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .bubble-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bubble-btn:not(:disabled):active { transform: scale(0.95); }
        .btn-primary { background: var(--pastel-blue); color: var(--text-blue); box-shadow: 0 4px 15px rgba(168, 216, 234, 0.5); }
        .btn-primary:not(:disabled):hover { background: #93C5FD; }
        .btn-mint { background: var(--pastel-mint); color: var(--text-mint); box-shadow: 0 4px 15px rgba(180, 248, 200, 0.5); }
        .btn-danger { background: var(--pastel-orange); color: var(--text-orange); box-shadow: 0 4px 15px rgba(255, 170, 165, 0.5); }
        .btn-outline { background: white; border: 2px solid #E2E8F0; color: var(--bubble-text); }
        .btn-outline:not(:disabled):hover { background: #F8FAFC; border-color: #CBD5E1; }

        .tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
        }

        .modal-overlay {
            background: rgba(240, 244, 248, 0.8);
            backdrop-filter: blur(8px);
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 圓潤打勾方塊 (Checklist 用) */
        .cute-checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #CBD5E1;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cute-checkbox.checked { 
            background: var(--pastel-mint); 
            border-color: var(--pastel-mint);
            transform: scale(1.1);
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.04);
        }
        
        /* 行事曆點擊選取特效 */
        .cal-day-active {
            background-color: var(--pastel-blue) !important;
            color: var(--text-blue) !important;
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(168, 216, 234, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        Babel.registerPreset('classic-react-env', {
            presets: [
                [Babel.availablePresets['env'], { modules: false }],
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="classic-react-env">
        // 替換為你的新 Firebase 配置
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { 
                apiKey: "AIzaSyAKDqURlLgG6vQe6m3TsCm_RYIlWBDzaAU",
                authDomain: "accounts-app-10ed2.firebaseapp.com",
                projectId: "accounts-app-10ed2",
                storageBucket: "accounts-app-10ed2.firebasestorage.app",
                messagingSenderId: "811729703619",
                appId: "1:811729703619:web:2cbecc7f107b8058714876"
            };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : "unisex-bubble-app";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage(); // 初始化 Firebase Storage

        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const container = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    container.appendChild(i);
                    window.lucide.createIcons({
                        root: container,
                        attrs: { width: size, height: size, class: className, 'stroke-width': 2.5 }
                    });
                    setSvgHtml(container.innerHTML);
                }
            }, [name, size, className]);
            if (!svgHtml) return <span style={{ width: size, height: size, display: 'inline-block' }} className={className} />;
            return <span className="inline-flex shrink-0" dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

        const compressImage = (base64Str, maxWidth = 1024, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        };

        function App() {
            const [user, setUser] = useState(null);
            
            // --- Data States ---
            const [dailyExpenses, setDailyExpenses] = useState([]);
            const [tasks, setTasks] = useState([]); // Projects
            const [categories, setCategories] = useState([]);
            const [expenseItems, setExpenseItems] = useState([]);
            const [members, setMembers] = useState([]);
            
            // --- UI States ---
            const [activeTab, setActiveTab] = useState('daily'); 
            const [projectSubTab, setProjectSubTab] = useState('active'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const chartRefs = useRef({ trend: null, cat: null });
            
            // --- Filter & Sort States ---
            const [dailySort, setDailySort] = useState('desc'); 
            const [dailyMonthFilter, setDailyMonthFilter] = useState('all'); 
            const [projectSort, setProjectSort] = useState('desc'); 
            
            // --- Analytics Range & Additional Filters States ---
            const [analyticsStart, setAnalyticsStart] = useState('');
            const [analyticsEnd, setAnalyticsEnd] = useState('');
            const [analyticsCatFilter, setAnalyticsCatFilter] = useState('all');
            const [analyticsOwnerFilter, setAnalyticsOwnerFilter] = useState('all');
            const [isAnalyticsDateInvalid, setIsAnalyticsDateInvalid] = useState(false);

            // --- Calendar States ---
            const [currentCalMonth, setCurrentCalMonth] = useState(new Date());
            const [selectedCalDate, setSelectedCalDate] = useState(null); 

            // Custom Dialogs
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const [inputDialog, setInputDialog] = useState({ isOpen: false, title: '', value: '', placeholder: '', onConfirm: null });

            // Daily Form
            const [dailyDate, setDailyDate] = useState(new Date().toISOString().split('T')[0]);
            const [dailyAmount, setDailyAmount] = useState('');
            const [dailyItem, setDailyItem] = useState('');
            const [dailyDesc, setDailyDesc] = useState('');
            const [dailyOwner, setDailyOwner] = useState('');
            const [dailyEditingId, setDailyEditingId] = useState(null);

            // Project Form
            const [isProjectFormOpen, setIsProjectFormOpen] = useState(false);
            const [projectEditingId, setProjectEditingId] = useState(null);
            const [taskText, setTaskText] = useState('');
            const [owners, setOwners] = useState([]);
            const [category, setCategory] = useState('');
            const [note, setNote] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [links, setLinks] = useState([]);
            const [images, setImages] = useState([]); 
            const [isUploadingImage, setIsUploadingImage] = useState(false); // 新增圖片上傳狀態

            const isProjectDateInvalid = startDate && endDate && endDate < startDate;

            // Project Detail
            const [expandedProject, setExpandedProject] = useState({});
            const [expenseModalTask, setExpenseModalTask] = useState(null);
            
            // Project Single Expense
            const [projExpDate, setProjExpDate] = useState(new Date().toISOString().split('T')[0]);
            const [projExpAmount, setProjExpAmount] = useState('');
            const [projExpItem, setProjExpItem] = useState('');
            const [projExpDesc, setProjExpDesc] = useState('');
            
            // Project Checklist State 
            const [newChecklistText, setNewChecklistText] = useState({});

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                        else await auth.signInAnonymously();
                    } catch (err) {}
                };
                initAuth();
                return auth.onAuthStateChanged(setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                // 修復清單亂跳的問題：加入第二排序條件 `doc.id`，確保 order 相當時也能保持固定順序
                const sortConfig = (a, b) => {
                    const orderDiff = (a.order ?? 0) - (b.order ?? 0);
                    if (orderDiff !== 0) return orderDiff;
                    // 如果 order 相同，使用文件 ID 來穩定排序
                    return a.id.localeCompare(b.id);
                };

                const unsubDaily = path.collection('dailyExpenses').onSnapshot(snap => setDailyExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubTasks = path.collection('tasks').onSnapshot(snap => setTasks(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                
                const unsubCats = path.collection('categories').onSnapshot(snap => {
                    let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                    if (d.length === 0) ['日常', '旅遊', '專案'].forEach((name, i) => path.collection('categories').add({ name, order: i, createdAt: new Date().toISOString() }));
                    else setCategories(d);
                });

                const unsubExpItems = path.collection('expenseItems').onSnapshot(snap => {
                    let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                    if (d.length === 0) ['餐飲', '交通', '購物', '娛樂'].forEach((name, i) => path.collection('expenseItems').add({ name, order: i, createdAt: new Date().toISOString() }));
                    else setExpenseItems(d);
                });

                const unsubMembers = path.collection('members').onSnapshot(snap => {
                    let d = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortConfig);
                    if (d.length === 0) ['Terry', 'Eric'].forEach((name, i) => path.collection('members').add({ name, order: i, createdAt: new Date().toISOString() }));
                    else setMembers(d);
                });

                return () => { unsubDaily(); unsubTasks(); unsubCats(); unsubExpItems(); unsubMembers(); };
            }, [user]);

            useEffect(() => { if (members.length > 0 && !dailyOwner) setDailyOwner(members[0].name); }, [members]);

            useEffect(() => {
                setIsAnalyticsDateInvalid(analyticsStart && analyticsEnd && analyticsEnd < analyticsStart);
            }, [analyticsStart, analyticsEnd]);

            const showConfirm = (title, message, onConfirm) => setConfirmDialog({ isOpen: true, title, message, onConfirm });
            const showInput = (title, defaultValue, placeholder, onConfirm) => setInputDialog({ isOpen: true, title, value: defaultValue, placeholder, onConfirm });

            // --- 日常記帳相關 ---
            const submitDailyExpense = async (e) => {
                e.preventDefault();
                if (!dailyAmount || !dailyItem || isProcessing) return;
                setIsProcessing(true);
                try {
                    const data = {
                        date: dailyDate, amount: parseFloat(dailyAmount), item: dailyItem, desc: dailyDesc, owner: dailyOwner, updatedAt: new Date().toISOString()
                    };
                    if (dailyEditingId) {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc(dailyEditingId).update(data);
                        setDailyEditingId(null);
                    } else {
                        data.createdAt = new Date().toISOString();
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').add(data);
                    }
                    setDailyAmount(''); setDailyDesc('');
                } catch (err) {}
                setIsProcessing(false);
            };

            const editDailyExpense = (d) => {
                setDailyDate(d.date || new Date().toISOString().split('T')[0]);
                setDailyAmount(d.amount);
                setDailyItem(d.item);
                setDailyDesc(d.desc || '');
                setDailyOwner(d.owner);
                setDailyEditingId(d.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // --- 圖片處理與上傳至 Firebase Storage ---
            const uploadImageToStorage = async (base64Str) => {
                // 產生獨特的檔案名稱，避免覆蓋
                const fileName = `images/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.jpg`;
                const storageRef = storage.ref().child(fileName);
                const snapshot = await storageRef.putString(base64Str, 'data_url');
                const downloadURL = await snapshot.ref.getDownloadURL();
                return downloadURL;
            };

            const processAndUploadFile = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (re) => {
                        try {
                            const compressed = await compressImage(re.target.result);
                            const url = await uploadImageToStorage(compressed); // 傳到 Storage
                            resolve(url);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                setIsUploadingImage(true);
                try {
                    // Promise.all 同時上傳多張圖片
                    const urls = await Promise.all(files.map(processAndUploadFile));
                    setImages(prev => [...prev, ...urls]);
                } catch (error) {
                    console.error("圖片上傳失敗:", error);
                    alert("圖片上傳失敗，請檢查權限或網路連線");
                } finally {
                    setIsUploadingImage(false);
                }
                // 清空 input 讓下次可以選同樣的圖
                e.target.value = '';
            };

            const handlePaste = async (e) => {
                const items = e.clipboardData.items;
                const files = [];
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        files.push(items[i].getAsFile());
                    }
                }
                if (files.length === 0) return;
                
                setIsUploadingImage(true);
                try {
                    const urls = await Promise.all(files.map(processAndUploadFile));
                    setImages(prev => [...prev, ...urls]);
                } catch (error) {
                    console.error("圖片上傳失敗:", error);
                    alert("圖片上傳失敗");
                } finally {
                    setIsUploadingImage(false);
                }
            };

            // --- 專案相關 ---
            const submitProject = async (e) => {
                e.preventDefault();
                if (!taskText.trim() || isProcessing || isProjectDateInvalid || isUploadingImage) return;
                setIsProcessing(true);
                const data = {
                    text: taskText.trim(), owners, category: category || (categories[0]?.name || ''), note, startDate, endDate, 
                    images: images.filter(img => img.trim() !== ''), links: links.filter(l => l.url.trim() !== ''), updatedAt: new Date().toISOString()
                };
                try {
                    const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks');
                    if (projectEditingId) await ref.doc(projectEditingId).update(data);
                    else await ref.add({ ...data, completed: false, checklist: [], createdAt: new Date().toISOString() });
                    setIsProjectFormOpen(false); resetProjectForm();
                } catch (err) {}
                setIsProcessing(false);
            };
            
            const resetProjectForm = () => {
                setTaskText(''); setNote(''); setStartDate(''); setEndDate(''); setImages([]); setLinks([]); setProjectEditingId(null);
                if (members.length > 0) setOwners([members[0].name]); if (categories.length > 0) setCategory(categories[0].name);
            };
            
            const openProjectEdit = (t) => {
                setTaskText(t.text); setOwners(t.owners || []); setCategory(t.category || ''); setNote(t.note || '');
                setStartDate(t.startDate || ''); setEndDate(t.endDate || ''); setImages(t.images || []); setLinks(t.links || []); setProjectEditingId(t.id);
                setIsProjectFormOpen(true);
            };

            const openExpenseModal = (t) => {
                setExpenseModalTask(t);
                setProjExpDate(new Date().toISOString().split('T')[0]);
                setProjExpAmount(''); setProjExpItem(''); setProjExpDesc('');
            };

            const submitProjectExpense = async (e) => {
                e.preventDefault();
                if (!projExpAmount || !projExpItem || isProcessing) return;
                setIsProcessing(true);
                try {
                    const newExp = { date: projExpDate, amount: projExpAmount, item: projExpItem, desc: projExpDesc };
                    const currentTask = tasks.find(t => t.id === expenseModalTask.id);
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(currentTask.id).update({ expenses: [...(currentTask.expenses || []), newExp] });
                    setExpenseModalTask(null);
                } catch(err) {}
                setIsProcessing(false);
            };
            
            const addChecklistItem = async (taskId) => {
                const text = newChecklistText[taskId]?.trim();
                if(!text) return;
                const task = tasks.find(t => t.id === taskId);
                const list = task.checklist || [];
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(taskId).update({
                    checklist: [...list, { id: Date.now().toString(), text, completed: false }]
                });
                setNewChecklistText({...newChecklistText, [taskId]: ''});
            };
            
            const toggleChecklistItem = async (taskId, itemId) => {
                const task = tasks.find(t => t.id === taskId);
                const list = (task.checklist || []).map(item => item.id === itemId ? {...item, completed: !item.completed} : item);
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(taskId).update({ checklist: list });
            };
            
            const deleteChecklistItem = async (taskId, itemId) => {
                const task = tasks.find(t => t.id === taskId);
                const list = (task.checklist || []).filter(item => item.id !== itemId);
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(taskId).update({ checklist: list });
            };

            const editChecklistItem = (taskId, itemId, currentText) => {
                showInput('修改任務項目', currentText || '', '請輸入新的任務內容...', async (newText) => {
                    const task = tasks.find(t => t.id === taskId);
                    const list = (task.checklist || []).map(item => item.id === itemId ? {...item, text: newText} : item);
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(taskId).update({ checklist: list });
                });
            };

            const calculateTaskTotal = (t) => (t.expenses || []).reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);

            // --- CSV 匯出匯入相關 ---
            const csvEscape = (value) => {
                const text = value === undefined || value === null ? '' : String(value);
                return `"${text.replace(/"/g, '""')}"`;
            };

            const parseCSVLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const next = line[i + 1];
                    if (char === '"' && inQuotes && next === '"') {
                        current += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            };

            const downloadCSV = (filename, header, rows) => {
                const csv = [header.map(csvEscape).join(','), ...rows.map(row => row.map(csvEscape).join(','))].join('\n');
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            };

            const handleExportDailyCSV = () => {
                const rows = dailyExpenses.map(d => [d.date || '', d.amount || 0, d.item || '', d.desc || '', d.owner || '']);
                downloadCSV("ET_Workspace_Daily_Expenses.csv", ["日期", "金額", "費用分類", "備註", "成員"], rows);
            };

            const handleExportProjectCSV = () => {
                const rows = [];
                tasks.forEach(t => {
                    const base = [
                        t.text || '',
                        t.category || '',
                        (t.owners || []).join(';'),
                        t.startDate || '',
                        t.endDate || '',
                        t.note || ''
                    ];
                    const projectExpenses = t.expenses || [];
                    if (projectExpenses.length > 0) {
                        projectExpenses.forEach(e => {
                            rows.push([...base, e.date || '', e.amount || 0, e.item || '', e.desc || '']);
                        });
                    } else {
                        rows.push([...base, '', '', '', '']);
                    }
                });
                downloadCSV("ET_Workspace_Projects.csv", ["專案名稱", "專案類別", "參與成員", "起始日期", "結束日期", "專案備註", "專案費用日期", "專案費用金額", "專案費用分類", "專案費用備註"], rows);
            };

            const handleImportDailyCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const lines = ev.target.result.split(/\r?\n/).filter(line => line.trim());
                        const batch = db.batch();
                        let count = 0;
                        for (let i = 1; i < lines.length; i++) {
                            const [date, amount, item, desc, owner] = parseCSVLine(lines[i]);
                            if (!date || !amount || !item) continue;
                            const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc();
                            batch.set(ref, {
                                date,
                                amount: parseFloat(amount) || 0,
                                item,
                                desc: desc || '',
                                owner: owner || '',
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            });
                            count++;
                        }
                        await batch.commit();
                        alert(`成功匯入 ${count} 筆日常記帳資料！`);
                    } catch (error) {
                        alert("日常記帳匯入失敗，請確認 CSV 欄位為：日期、金額、費用分類、備註、成員");
                    }
                    setIsProcessing(false);
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleImportProjectCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true);
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const lines = ev.target.result.split(/\r?\n/).filter(line => line.trim());
                        const projectMap = new Map();
                        for (let i = 1; i < lines.length; i++) {
                            const [text, projectCategory, projectOwners, projectStartDate, projectEndDate, projectNote, expDate, expAmount, expItem, expDesc] = parseCSVLine(lines[i]);
                            if (!text) continue;

                            const key = [text, projectCategory || '', projectOwners || '', projectStartDate || '', projectEndDate || '', projectNote || ''].join('||');
                            if (!projectMap.has(key)) {
                                projectMap.set(key, {
                                    text,
                                    category: projectCategory || '',
                                    owners: projectOwners ? projectOwners.split(';').map(o => o.trim()).filter(Boolean) : [],
                                    startDate: projectStartDate || '',
                                    endDate: projectEndDate || '',
                                    note: projectNote || '',
                                    images: [],
                                    links: [],
                                    expenses: [],
                                    checklist: [],
                                    completed: false,
                                    createdAt: new Date().toISOString(),
                                    updatedAt: new Date().toISOString()
                                });
                            }

                            if (expDate || expAmount || expItem || expDesc) {
                                projectMap.get(key).expenses.push({
                                    date: expDate || '',
                                    amount: parseFloat(expAmount) || 0,
                                    item: expItem || '',
                                    desc: expDesc || ''
                                });
                            }
                        }

                        const batch = db.batch();
                        const refBase = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks');
                        projectMap.forEach(project => {
                            const ref = refBase.doc();
                            batch.set(ref, project);
                        });
                        await batch.commit();
                        alert(`成功匯入 ${projectMap.size} 個專案資料！`);
                    } catch (error) {
                        alert("專案匯入失敗，請確認 CSV 欄位為：專案名稱、專案類別、參與成員、起始日期、結束日期、專案備註、專案費用日期、專案費用金額、專案費用分類、專案費用備註");
                    }
                    setIsProcessing(false);
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            // --- 計算與顯示處理 ---
            const availableDailyMonths = useMemo(() => {
                const months = new Set();
                dailyExpenses.forEach(d => { if(d.date) months.add(d.date.substring(0, 7)); });
                return Array.from(months).sort().reverse(); 
            }, [dailyExpenses]);

            const displayDaily = useMemo(() => {
                let filtered = [...dailyExpenses];
                if (dailyMonthFilter !== 'all') filtered = filtered.filter(d => (d.date || '').startsWith(dailyMonthFilter));
                filtered.sort((a, b) => {
                    const dateA = a.date || ''; const dateB = b.date || '';
                    return dailySort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [dailyExpenses, dailyMonthFilter, dailySort]);

            const dailyFilteredTotal = useMemo(() => {
                return displayDaily.reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
            }, [displayDaily]);

            const displayProjects = useMemo(() => {
                let filtered = tasks.filter(t => projectSubTab === 'active' ? !t.completed : t.completed);
                if (selectedCalDate) {
                    filtered = filtered.filter(t => {
                        if (!t.startDate) return false;
                        const s = t.startDate;
                        const e = t.endDate || t.startDate;
                        return selectedCalDate >= s && selectedCalDate <= e;
                    });
                }
                filtered.sort((a, b) => {
                    const dateA = a.startDate || a.createdAt || ''; const dateB = b.startDate || b.createdAt || '';
                    return projectSort === 'desc' ? dateB.localeCompare(dateA) : dateA.localeCompare(dateB);
                });
                return filtered;
            }, [tasks, projectSubTab, projectSort, selectedCalDate]);
            
            const calDays = useMemo(() => {
                const year = currentCalMonth.getFullYear();
                const month = currentCalMonth.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayTasks = tasks.filter(t => {
                        if (t.completed) return false;
                        if (!t.startDate) return false;
                        const s = t.startDate;
                        const e = t.endDate || t.startDate;
                        return dateStr >= s && dateStr <= e;
                    });
                    days.push({ day: i, dateStr, tasks: dayTasks });
                }
                return days;
            }, [currentCalMonth, tasks]);

            const analyticsData = useMemo(() => {
                const ownerMap = {}; let totalExpense = 0; const trendMap = {}; const catMap = {};
                
                dailyExpenses.forEach(d => {
                    if (analyticsStart && d.date < analyticsStart) return;
                    if (analyticsEnd && d.date > analyticsEnd) return;
                    if (analyticsCatFilter !== 'all' && d.item !== analyticsCatFilter) return;
                    if (analyticsOwnerFilter !== 'all' && d.owner !== analyticsOwnerFilter) return;

                    const amt = parseFloat(d.amount) || 0; 
                    totalExpense += amt;
                    ownerMap[d.owner] = (ownerMap[d.owner] || 0) + amt;
                    catMap[d.item] = (catMap[d.item] || 0) + amt;
                    const monthKey = d.date ? d.date.substring(0, 7) : 'Unknown';
                    trendMap[monthKey] = (trendMap[monthKey] || 0) + amt;
                });
                
                tasks.forEach(t => {
                    const currentOwners = t.owners && t.owners.length > 0 ? t.owners : (t.owner ? [t.owner] : []);
                    
                    if (analyticsOwnerFilter !== 'all' && !currentOwners.includes(analyticsOwnerFilter)) return;

                    (t.expenses || []).forEach(e => {
                        if (analyticsStart && e.date < analyticsStart) return;
                        if (analyticsEnd && e.date > analyticsEnd) return;
                        if (analyticsCatFilter !== 'all' && e.item !== analyticsCatFilter) return;
                        
                        const amt = parseFloat(e.amount) || 0;
                        const splitAmount = currentOwners.length > 0 ? amt / currentOwners.length : amt;
                        const targetAmount = analyticsOwnerFilter !== 'all' ? splitAmount : amt;

                        totalExpense += targetAmount;
                        catMap[e.item] = (catMap[e.item] || 0) + targetAmount;
                        const monthKey = e.date ? e.date.substring(0, 7) : 'Unknown';
                        trendMap[monthKey] = (trendMap[monthKey] || 0) + targetAmount;

                        if (analyticsOwnerFilter !== 'all') {
                            ownerMap[analyticsOwnerFilter] = (ownerMap[analyticsOwnerFilter] || 0) + splitAmount;
                        } else {
                            currentOwners.forEach(o => { ownerMap[o] = (ownerMap[o] || 0) + splitAmount; });
                        }
                    });
                });
                
                return { sortedOwners: Object.entries(ownerMap).sort((a,b)=>b[1]-a[1]), totalExpense, trendKeys: Object.keys(trendMap).sort(), trendMap, catMap };
            }, [dailyExpenses, tasks, analyticsStart, analyticsEnd, analyticsCatFilter, analyticsOwnerFilter]);

            useEffect(() => {
                if (activeTab !== 'analytics') return;
                const timer = setTimeout(() => {
                    if (chartRefs.current.trend) chartRefs.current.trend.destroy();
                    if (chartRefs.current.cat) chartRefs.current.cat.destroy();

                    const trendCtx = document.getElementById('trendChart')?.getContext('2d');
                    if (trendCtx) {
                        chartRefs.current.trend = new Chart(trendCtx, {
                            type: 'bar',
                            data: { labels: analyticsData.trendKeys, datasets: [{ data: analyticsData.trendKeys.map(k => analyticsData.trendMap[k]), backgroundColor: '#A8D8EA', borderRadius: 8, borderWidth: 0 }] },
                            options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { borderDash: [4,4] } } } }
                        });
                    }

                    const catCtx = document.getElementById('catChart')?.getContext('2d');
                    if (catCtx && Object.keys(analyticsData.catMap).length > 0) {
                        const bgColors = ['#A8D8EA', '#B4F8C8', '#FBE7C6', '#FFAAA5', '#E2E8F0', '#FFD3B6', '#D4A5A5', '#A2E1DB', '#EAD8F7'];
                        chartRefs.current.cat = new Chart(catCtx, {
                            type: 'doughnut',
                            data: { 
                                labels: Object.keys(analyticsData.catMap), 
                                datasets: [{ 
                                    data: Object.values(analyticsData.catMap), 
                                    backgroundColor: bgColors, 
                                    borderWidth: 0 
                                }] 
                            },
                            options: { plugins: { legend: { position: 'right' } }, maintainAspectRatio: false }
                        });
                    }
                }, 100);
                return () => clearTimeout(timer);
            }, [activeTab, analyticsData]);


            const renderDailyView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-blue)] p-2 rounded-2xl"><Icon name="wallet" size={24} className="text-[var(--text-blue)]" /></div>
                        <h1 className="text-3xl font-black tracking-tight text-[var(--bubble-text)]">日常流水帳</h1>
                    </div>
                    
                    <form onSubmit={submitDailyExpense} className="bubble-card p-6 space-y-4 bg-white border-2 border-[var(--pastel-blue)]/30">
                        <div className="grid grid-cols-2 gap-3">
                            <input type="date" value={dailyDate} onChange={e=>setDailyDate(e.target.value)} required />
                            <input type="number" placeholder="金額 $" value={dailyAmount} onChange={e=>setDailyAmount(e.target.value)} required className="text-xl text-[var(--text-blue)] font-black" />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <select value={dailyItem} onChange={e=>setDailyItem(e.target.value)} required>
                                <option value="">選擇分類...</option>
                                {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                            </select>
                            <select value={dailyOwner} onChange={e=>setDailyOwner(e.target.value)} required>
                                {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                            </select>
                        </div>
                        <div className="flex gap-3">
                            <input type="text" placeholder="寫點備註..." value={dailyDesc} onChange={e=>setDailyDesc(e.target.value)} className="flex-grow" />
                            {dailyEditingId && <button type="button" onClick={() => {setDailyEditingId(null); setDailyAmount(''); setDailyDesc('');}} className="bubble-btn btn-outline whitespace-nowrap px-4">取消</button>}
                            <button type="submit" disabled={isProcessing} className="bubble-btn btn-primary whitespace-nowrap px-8">
                                {isProcessing ? <Icon name="loader" className="animate-spin" /> : (dailyEditingId ? "儲存修改" : "記一筆")}
                            </button>
                        </div>
                    </form>

                    <div className="bubble-card bg-white/60 p-4">
                        <div className="flex justify-between items-center px-2">
                            <h3 className="font-bold text-lg text-[var(--bubble-text)]/80 flex items-center gap-2">
                                <Icon name="list" size={18} /> 消費明細
                            </h3>
                            <div className="flex gap-2">
                                <select value={dailyMonthFilter} onChange={e=>setDailyMonthFilter(e.target.value)} className="!py-1.5 !px-3 !text-sm !rounded-xl !bg-white shadow-sm border-none font-bold">
                                    <option value="all">所有月份</option>
                                    {availableDailyMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                                <button onClick={()=>setDailySort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline !p-1.5 !rounded-xl !border-none shadow-sm bg-white" title={dailySort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                                    <Icon name={dailySort === 'desc' ? "sort-desc" : "sort-asc"} size={18} />
                                </button>
                            </div>
                        </div>
                        
                        <div className="px-2 mt-2 mb-4">
                            <span className="bg-[var(--pastel-yellow)] text-[var(--text-yellow)] px-3 py-1.5 rounded-full text-sm font-black inline-block shadow-sm">
                                總計: ${dailyFilteredTotal.toLocaleString()}
                            </span>
                        </div>

                        <div className="space-y-3">
                            {displayDaily.length === 0 && <p className="font-bold text-[var(--bubble-text)]/40 p-5 text-center">這個月還沒有花費喔！</p>}
                            {displayDaily.map(d => (
                                <div key={d.id} className="p-4 flex justify-between items-center bg-white rounded-[20px] shadow-sm hover:shadow-md transition-shadow group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-[16px] bg-slate-100/70 flex items-center justify-center text-slate-500"><Icon name="receipt" size={20} /></div>
                                        <div>
                                            <div className="font-black text-[17px] text-slate-700 tracking-wide">
                                                {d.desc || '無備註'} <span className="ml-2 font-black">{d.item}</span>
                                            </div>
                                            <div className="font-bold text-[13px] text-slate-500 mt-0.5">{d.date} • {d.owner}</div>
                                        </div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 ml-auto pl-2">
                                        <div className="flex gap-1 sm:opacity-0 group-hover:opacity-100 transition-opacity order-2 sm:order-1">
                                            <button onClick={()=>editDailyExpense(d)} className="bg-[var(--pastel-blue)]/30 text-[var(--text-blue)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-blue)]"><Icon name="edit-2" size={16} /></button>
                                            <button onClick={()=>showConfirm('刪除花費', '確定要刪除這筆紀錄嗎？', ()=>db.collection('artifacts').doc(appId).collection('public').doc('data').collection('dailyExpenses').doc(d.id).delete())} className="bg-[var(--pastel-orange)]/30 text-[var(--text-orange)] p-1.5 rounded-xl transition-all hover:bg-[var(--pastel-orange)]"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                        <span className="font-black text-xl text-[var(--bubble-text)] text-right order-1 sm:order-2">${parseFloat(d.amount).toLocaleString()}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderProjectsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <div className="flex items-center gap-3">
                            <div className="bg-[var(--pastel-mint)] p-2 rounded-2xl"><Icon name="folder" size={24} className="text-[var(--text-mint)]" /></div>
                            <h1 className="text-3xl font-black tracking-tight">專案資料夾</h1>
                        </div>
                        <button onClick={()=>{resetProjectForm(); setIsProjectFormOpen(true);}} className="bubble-btn btn-mint !px-5"><Icon name="plus" size={18}/> 新增</button>
                    </div>
                    
                    {/* 專案行事曆區塊 */}
                    <div className="bubble-card bg-white p-4">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() - 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-left" size={20}/></button>
                            <h3 className="font-black text-lg text-[var(--bubble-text)]">{currentCalMonth.getFullYear()}年 {currentCalMonth.getMonth() + 1}月</h3>
                            <button onClick={()=>setCurrentCalMonth(new Date(currentCalMonth.getFullYear(), currentCalMonth.getMonth() + 1, 1))} className="p-2 hover:bg-gray-100 rounded-full"><Icon name="chevron-right" size={20}/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center">
                            {['日', '一', '二', '三', '四', '五', '六'].map(d => <div key={d} className="text-xs font-bold text-[var(--bubble-text)]/50 pb-2">{d}</div>)}
                            {calDays.map((d, i) => (
                                <div key={i} 
                                    onClick={() => { if(d) setSelectedCalDate(selectedCalDate === d.dateStr ? null : d.dateStr); }}
                                    className={`p-1 flex flex-col items-center justify-start min-h-[45px] rounded-xl transition-all cursor-pointer border border-transparent
                                        ${d ? (selectedCalDate === d.dateStr ? 'cal-day-active' : 'bg-gray-50 hover:bg-gray-100 hover:border-gray-200') : ''}`}>
                                    {d && (
                                        <>
                                            <span className="text-[12px] font-bold">{d.day}</span>
                                            <div className="flex flex-wrap gap-0.5 justify-center mt-1">
                                                {d.tasks.map((t, idx) => <span key={idx} className="w-1.5 h-1.5 rounded-full bg-[var(--text-blue)]"></span>)}
                                            </div>
                                        </>
                                    )}
                                </div>
                            ))}
                        </div>
                        {selectedCalDate && (
                            <div className="mt-3 text-center animate-in zoom-in-95">
                                <span className="tag bg-[var(--pastel-blue)] text-[var(--text-blue)] shadow-sm">
                                    篩選日期: {selectedCalDate} <button onClick={()=>setSelectedCalDate(null)} className="ml-1 font-black">✕</button>
                                </span>
                            </div>
                        )}
                    </div>

                    <div className="flex justify-between items-center mx-2 gap-2">
                        <div className="flex gap-2 bg-white p-1.5 rounded-[20px] shadow-sm flex-grow">
                            <button onClick={()=>setProjectSubTab('active')} className={`flex-1 py-2 font-black rounded-[15px] transition-all ${projectSubTab==='active' ? 'bg-[var(--pastel-mint)] text-[var(--text-mint)]' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>進行中</button>
                            <button onClick={()=>setProjectSubTab('completed')} className={`flex-1 py-2 font-black rounded-[15px] transition-all ${projectSubTab==='completed' ? 'bg-[var(--pastel-gray)] text-gray-700' : 'text-[var(--bubble-text)]/50 hover:bg-gray-50'}`}>已結束</button>
                        </div>
                        <button onClick={()=>setProjectSort(prev => prev === 'desc' ? 'asc' : 'desc')} className="bubble-btn btn-outline bg-white !p-3 shadow-sm border-none h-full" title={projectSort === 'desc' ? '改為舊到新' : '改為新到舊'}>
                            <Icon name={projectSort === 'desc' ? "sort-desc" : "sort-asc"} size={20} />
                        </button>
                    </div>

                    <div className="space-y-4">
                        {displayProjects.length === 0 && <p className="text-center font-bold text-[var(--bubble-text)]/40 py-10">尚無專案</p>}
                        {displayProjects.map(t => {
                            const isExpanded = expandedProject[t.id];
                            const total = calculateTaskTotal(t);
                            const currentOwners = t.owners && t.owners.length > 0 ? t.owners : [];
                            const checklists = t.checklist || [];
                            
                            return (
                                <div key={t.id} className={`bubble-card overflow-hidden ${t.completed ? 'opacity-70 bg-gray-50' : 'bg-white'}`}>
                                    <div className="p-6 cursor-pointer hover:bg-[var(--bubble-bg)]/50 flex items-start gap-4 transition-colors" onClick={()=>setExpandedProject({...expandedProject, [t.id]: !isExpanded})}>
                                        <div className="mt-1"><Icon name={isExpanded ? "folder-open" : "folder"} size={26} className="text-[var(--pastel-blue)]" /></div>
                                        <div className="flex-grow">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-black text-xl leading-tight text-[var(--bubble-text)]">{t.text}</h3>
                                                {total > 0 && <span className="font-black text-lg bg-[var(--pastel-yellow)] px-3 py-1 rounded-[12px] text-[var(--text-yellow)]">${total.toLocaleString()}</span>}
                                            </div>
                                            <div className="flex flex-wrap gap-2 mt-3">
                                                <span className="tag bg-[var(--pastel-gray)] text-gray-700 shadow-sm">{t.category}</span>
                                                {currentOwners.map(o => <span key={o} className="tag bg-[#F8FAFC] text-[var(--bubble-text)] border border-gray-100">{o}</span>)}
                                            </div>
                                            {(t.startDate || t.endDate) && <div className="font-bold text-[13px] text-[var(--bubble-text)]/50 mt-3 flex items-center gap-1.5"><Icon name="calendar" size={14}/> {t.startDate} {t.endDate && `→ ${t.endDate}`}</div>}
                                        </div>
                                    </div>
                                    
                                    {isExpanded && (
                                        <div className="p-6 border-t-2 border-gray-50 bg-white/50">
                                            <div className="flex flex-wrap gap-2 mb-6">
                                                {!t.completed && <button onClick={()=>openExpenseModal(t)} className="bubble-btn btn-primary !px-4 !py-2 !text-sm"><Icon name="dollar-sign" size={16}/> 記一筆</button>}
                                                <button onClick={()=>openProjectEdit(t)} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm"><Icon name="edit" size={16}/> 編輯</button>
                                                <button onClick={()=>db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(t.id).update({ completed: !t.completed })} className="bubble-btn btn-outline !px-4 !py-2 !text-sm !border-none shadow-sm">{t.completed ? "重新開啟" : "標示為已結束"}</button>
                                                <button onClick={()=>showConfirm('刪除專案', '確定刪除此專案與所有明細嗎？', async () => await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(t.id).delete())} className="bubble-btn btn-danger !px-4 !py-2 !text-sm ml-auto"><Icon name="trash" size={16}/></button>
                                            </div>
                                            
                                            {/* Checklist 區塊 */}
                                            <div className="mb-6 bg-white p-5 rounded-[24px] shadow-sm border border-[var(--pastel-mint)]/40">
                                                <h4 className="font-black text-[14px] text-[var(--text-mint)] flex items-center gap-2 mb-4"><Icon name="check-circle" size={18}/> 任務清單</h4>
                                                <div className="space-y-3 mb-4">
                                                    {checklists.map(item => (
                                                        <div key={item.id} className={`flex items-start gap-3 group transition-all ${item.completed ? 'opacity-50' : ''}`}>
                                                            <div onClick={()=>toggleChecklistItem(t.id, item.id)} className={`cute-checkbox flex-shrink-0 mt-0.5 ${item.completed ? 'checked' : ''}`}>
                                                                {item.completed && <Icon name="check" size={16} className="text-[var(--text-mint)]" />}
                                                            </div>
                                                            <div className="flex-grow pt-0.5 cursor-pointer" onClick={()=>toggleChecklistItem(t.id, item.id)}>
                                                                <span className={`font-bold text-[15px] ${item.completed ? 'line-through' : ''}`}>{item.text}</span>
                                                            </div>
                                                            <button onClick={()=>editChecklistItem(t.id, item.id, item.text)} className="opacity-0 group-hover:opacity-100 text-[var(--text-blue)] hover:bg-[var(--pastel-blue)]/20 p-1.5 rounded-lg transition-all" title="修改項目"><Icon name="edit-2" size={16}/></button>
                                                            <button onClick={()=>deleteChecklistItem(t.id, item.id)} className="opacity-0 group-hover:opacity-100 text-[var(--pastel-orange)] hover:bg-[var(--pastel-orange)]/10 p-1.5 rounded-lg transition-all" title="刪除項目"><Icon name="trash-2" size={16}/></button>
                                                        </div>
                                                    ))}
                                                    {checklists.length === 0 && <div className="text-sm font-bold text-gray-400">目前沒有清單項目，在下方新增吧！</div>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input type="text" placeholder="新增準備事項、裝備清單..." value={newChecklistText[t.id] || ''} onChange={e=>setNewChecklistText({...newChecklistText, [t.id]: e.target.value})} onKeyDown={e=>{if(e.key==='Enter') addChecklistItem(t.id);}} className="flex-grow !py-2 !px-4 !text-sm !bg-gray-50 border-none" />
                                                    <button onClick={()=>addChecklistItem(t.id)} className="bubble-btn btn-mint !py-2 !px-4 shadow-none"><Icon name="plus" size={18}/></button>
                                                </div>
                                            </div>

                                            {t.note && <div className="font-bold text-[15px] text-[var(--bubble-text)]/80 whitespace-pre-line bg-[#F8FAFC] p-5 rounded-[20px] mb-4 leading-relaxed">{t.note}</div>}
                                            
                                            {t.links && t.links.length > 0 && (
                                                <div className="mb-4 flex flex-wrap gap-2">
                                                    {t.links.map((l, i) => (
                                                        <a key={i} href={l.url} target="_blank" className="bubble-btn btn-outline !px-3 !py-1.5 !text-[13px] hover:bg-[var(--pastel-blue)] hover:text-[var(--text-blue)] border-none shadow-sm"><Icon name="link" size={14}/> {l.label || "連結"}</a>
                                                    ))}
                                                </div>
                                            )}

                                            {t.images && t.images.length > 0 && (
                                                <div className="mb-4 flex flex-wrap gap-3">
                                                    {t.images.map((img, idx) => (
                                                        <a key={idx} href={img} target="_blank" rel="noreferrer">
                                                            <img src={img} className="w-24 h-24 object-cover rounded-[16px] shadow-sm border border-gray-100 hover:opacity-80 transition-opacity" alt="附件" />
                                                        </a>
                                                    ))}
                                                </div>
                                            )}

                                            {t.expenses && t.expenses.length > 0 && (
                                                <div className="mt-5">
                                                    <h4 className="font-black text-[13px] text-[var(--bubble-text)]/50 uppercase tracking-wider mb-2 ml-1">專案費用明細</h4>
                                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden border border-gray-50 divide-y divide-gray-50">
                                                        {t.expenses.map((e, idx) => (
                                                            <div key={idx} className="flex justify-between items-center p-4 hover:bg-gray-50">
                                                                <div>
                                                                    <div className="font-black text-[15px] text-slate-700">{e.desc || '無備註'} <span className="ml-2 font-black">{e.item}</span></div>
                                                                    <div className="font-bold text-[12px] text-[var(--bubble-text)]/40 mt-1">{e.date}</div>
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    <span className="font-black text-lg text-[var(--bubble-text)]">${parseFloat(e.amount).toLocaleString()}</span>
                                                                    <button onClick={()=>showConfirm('刪除明細', '確定要刪除這筆專案費用嗎？', async () => {
                                                                        const updated = [...t.expenses]; updated.splice(idx, 1);
                                                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('tasks').doc(t.id).update({expenses: updated});
                                                                    })} className="text-[var(--pastel-orange)] hover:bg-[var(--pastel-orange)]/20 p-2 rounded-xl transition-all"><Icon name="x" size={16}/></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderAnalyticsView = () => (
                <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-6">
                    <div className="flex items-center gap-3 px-2 mb-2">
                        <div className="bg-[var(--pastel-yellow)] p-2 rounded-2xl"><Icon name="pie-chart" size={24} className="text-[var(--text-yellow)]" /></div>
                        <h1 className="text-3xl font-black tracking-tight">統計分析</h1>
                    </div>
                    
                    {/* 篩選區間與條件設定 */}
                    <div className="bubble-card p-5 bg-white">
                        <h3 className="font-bold text-sm text-[var(--bubble-text)]/60 mb-3">資料篩選設定</h3>
                        <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-center">
                            <input type="date" value={analyticsStart} onChange={e=>setAnalyticsStart(e.target.value)} className="w-full min-w-0 !py-2 !px-3 !text-sm" />
                            <span className="font-black text-gray-300">→</span>
                            <input type="date" value={analyticsEnd} onChange={e=>setAnalyticsEnd(e.target.value)} className="w-full min-w-0 !py-2 !px-3 !text-sm" />
                        </div>
                        {isAnalyticsDateInvalid && <div className="text-[var(--text-orange)] text-xs font-bold mt-2">截止日期不能早於起始日期！</div>}
                        
                        <div className="flex items-center gap-2 mt-3">
                            <select value={analyticsCatFilter} onChange={e=>setAnalyticsCatFilter(e.target.value)} className="w-full !py-2 !px-3 !text-sm">
                                <option value="all">所有費用分類</option>
                                {expenseItems.map(i => <option key={i.id} value={i.name}>{i.name}</option>)}
                            </select>
                            <select value={analyticsOwnerFilter} onChange={e=>setAnalyticsOwnerFilter(e.target.value)} className="w-full !py-2 !px-3 !text-sm">
                                <option value="all">所有成員</option>
                                {members.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="bubble-card p-8 text-center bg-white border-2 border-[var(--pastel-yellow)]/40">
                        <p className="font-bold text-[15px] text-[var(--bubble-text)]/60 mb-2">總計花費</p>
                        <p className="text-5xl font-black tracking-tighter text-[var(--text-yellow)] drop-shadow-sm">${analyticsData.totalExpense.toLocaleString()}</p>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="pie-chart" size={20}/> 項目佔比</h3>
                        {Object.keys(analyticsData.catMap).length > 0 ? (
                            <div className="h-56"><canvas id="catChart"></canvas></div>
                        ) : (
                            <div className="text-center font-bold text-gray-400 py-10">此區間無費用資料</div>
                        )}
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="bar-chart-2" size={20}/> 月度趨勢</h3>
                        <div className="h-48"><canvas id="trendChart"></canvas></div>
                    </div>

                    <div className="bubble-card p-6 bg-white">
                        <h3 className="text-xl font-black mb-5 flex items-center gap-2"><Icon name="users" size={20}/> 成員分攤</h3>
                        <div className="space-y-5">
                            {analyticsData.sortedOwners.length === 0 && <div className="text-center font-bold text-gray-400 py-4">無成員資料</div>}
                            {analyticsData.sortedOwners.map(([name, value]) => {
                                const percentage = analyticsData.totalExpense ? ((value / analyticsData.totalExpense) * 100).toFixed(1) : 0;
                                return (
                                    <div key={name}>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="font-black text-[16px]">{name}</span>
                                            <span className="font-bold text-sm text-[var(--bubble-text)]/60">${value.toLocaleString()} ({percentage}%)</span>
                                        </div>
                                        <div className="w-full bg-[#F1F3F5] rounded-full h-3 overflow-hidden">
                                            <div className="bg-[var(--pastel-blue)] h-full rounded-full transition-all duration-1000" style={{width: `${percentage}%`}}></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // 修改 Settings 裡排序的賦值方式，避免刪除又新增後出現同一個 order 的問題
            const renderSettingsList = (title, collection, items) => (
                <div className="mb-8">
                    <div className="flex justify-between items-center px-2 mb-4">
                        <h3 className="font-black text-xl">{title}</h3>
                        <button onClick={()=>showInput(`新增${title}`, '', '請輸入名稱...', async (newName) => {
                            const list = collection === 'members' ? members : collection === 'categories' ? categories : expenseItems;
                            // 改為尋找目前最大的 order 值加一，而不是用陣列長度，避免刪除後發生重複 order
                            const nextOrder = list.length > 0 ? Math.max(...list.map(l => l.order || 0)) + 1 : 0;
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).add({ name: newName, order: nextOrder, createdAt: new Date().toISOString() });
                        })} className="bubble-btn btn-primary !py-1.5 !px-4 !text-[13px]"><Icon name="plus" size={16}/> 新增</button>
                    </div>
                    <div className="bubble-card bg-white overflow-hidden divide-y divide-gray-50 p-0">
                        {items.length === 0 && <div className="p-6 text-center font-bold text-gray-400">無資料</div>}
                        {items.map(item => (
                            <div key={item.id} className="flex justify-between items-center p-4 hover:bg-[var(--bubble-bg)]/30 transition-colors">
                                <span className="font-black text-[16px]">{item.name}</span>
                                <div className="flex gap-2">
                                    <button onClick={()=>showInput(`編輯名稱`, item.name, '輸入新名稱', async (newName) => {
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).update({ name: newName });
                                    })} className="p-2 rounded-xl text-[var(--text-blue)] bg-[var(--pastel-blue)]/20 hover:bg-[var(--pastel-blue)] transition-all"><Icon name="edit-2" size={18}/></button>
                                    <button onClick={()=>showConfirm('確認刪除', `確定要刪除「${item.name}」嗎？`, async () => {
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collection).doc(item.id).delete();
                                    })} className="p-2 rounded-xl text-[var(--text-orange)] bg-[var(--pastel-orange)]/20 hover:bg-[var(--pastel-orange)] transition-all"><Icon name="trash-2" size={18}/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-32 pt-8 px-4 sm:px-6">
                    <header className="mb-6 px-2 text-center">
                        <h1 className="text-3xl font-black tracking-tight text-emerald-950 drop-shadow-sm flex justify-center items-center gap-3">
                            <Icon name="sparkles" size={28} className="text-amber-500" /> E&T Workspace
                        </h1>
                    </header>
                    <main>
                        {activeTab === 'daily' && renderDailyView()}
                        {activeTab === 'projects' && renderProjectsView()}
                        {activeTab === 'analytics' && renderAnalyticsView()}
                        {activeTab === 'settings' && (
                            <div className="animate-in fade-in duration-300 max-w-xl mx-auto space-y-4">
                                <div className="flex items-center gap-3 px-2 mb-6">
                                    <div className="bg-[var(--pastel-gray)] p-2 rounded-2xl"><Icon name="settings" size={24} className="text-gray-700" /></div>
                                    <h2 className="text-2xl font-black tracking-tight">設定管理</h2>
                                </div>
                                {renderSettingsList("參與成員", "members", members)}
                                {renderSettingsList("專案類別", "categories", categories)}
                                {renderSettingsList("費用分類", "expenseItems", expenseItems)}
                                
                                <div className="mb-8 pt-4">
                                    <h3 className="font-black text-xl px-2 mb-4">資料備份與匯入</h3>
                                    <div className="bubble-card bg-white p-5 space-y-4">
                                        <p className="text-xs font-bold text-gray-500 mb-2 leading-relaxed">日常記帳欄位「日期、金額、費用分類、備註、成員」<br/>專案欄位「專案名稱、專案類別、參與成員、起始日期、結束日期、專案備註、專案費用日期、專案費用金額、專案費用分類、專案費用備註」</p>
                                        <div className="bg-[var(--bubble-bg)]/70 rounded-[20px] p-4 space-y-3">
                                            <div className="font-black text-sm text-[var(--text-blue)] flex items-center gap-2"><Icon name="wallet" size={16}/> 日常記帳 CSV</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={handleExportDailyCSV} className="bubble-btn btn-outline !text-sm"><Icon name="download" size={16}/> 匯出日常</button>
                                                <button onClick={() => document.getElementById('daily-csv-upload').click()} className="bubble-btn btn-outline !text-sm"><Icon name="upload" size={16}/> 匯入日常</button>
                                                <input id="daily-csv-upload" type="file" accept=".csv" onChange={handleImportDailyCSV} className="hidden" />
                                            </div>
                                        </div>
                                        <div className="bg-[var(--bubble-bg)]/70 rounded-[20px] p-4 space-y-3">
                                            <div className="font-black text-sm text-[var(--text-mint)] flex items-center gap-2"><Icon name="folder" size={16}/> 專案資料 CSV</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={handleExportProjectCSV} className="bubble-btn btn-outline !text-sm"><Icon name="download" size={16}/> 匯出專案</button>
                                                <button onClick={() => document.getElementById('project-csv-upload').click()} className="bubble-btn btn-outline !text-sm"><Icon name="upload" size={16}/> 匯入專案</button>
                                                <input id="project-csv-upload" type="file" accept=".csv" onChange={handleImportProjectCSV} className="hidden" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 客製化 Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="modal-overlay">
                            <div className="bubble-card bg-white p-6 w-full max-w-sm animate-in zoom-in-95 duration-200 shadow-2xl">
                                <h3 className="font-black text-2xl mb-2 text-[var(--text-orange)]">{confirmDialog.title}</h3>
                                <p className="font-bold text-[var(--bubble-text)]/70 mb-6">{confirmDialog.message}</p>
                                <div className="flex gap-3">
